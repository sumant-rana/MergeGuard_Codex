[project]
name = "mergeguard-agentic-demo"
version = "0.2.0"
description = "Agentic MergeGuard demo with independently deployable Magenta-style analyzer agents."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages",
  "agents/review-compression",
  "agents/intent-extractor",
  "agents/evidence-mapper",
  "agents/semantic-diff-explainer",
  "agents/concept-classifier",
  "agents/policy-gate",
  "agents/prompt-canary",
  "agents/contract-comparator",
  "agents/truth-report-synthesizer"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
