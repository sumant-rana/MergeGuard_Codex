[project]
name = "mergeguard-agent-pr-history-indexer"
version = "0.2.0"
description = "MergeGuard onboarding agent that indexes historical PRs into structured storage and semantic memory."
requires-python = ">=3.11"
dependencies = [
    "runner-shared[mongodb,tracing]",
    "magenta-sdklanggraph",
    "langchain-core>=0.3",
    "langgraph>=0.2",
    "pymongo>=4.7",
    "python-dotenv>=1.0.0",
]

[project.scripts]
pr-history-indexer = "pr_history_indexer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_history_indexer"]

[tool.uv.sources]
runner-shared = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/runner-shared" }
magenta-sdklanggraph = { git = "https://github.com/10gen/magenta-client-libraries", subdirectory = "packages/magenta-sdklanggraph" }

[tool.ruff]
line-length = 100
target-version = "py311"
