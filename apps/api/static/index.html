        themeToggleLabel.textContent = isLight ? "Arctic Lab light mode" : "Slate Citrus dark mode";
      }

      function initQueueRailControls() {
        queuePanelToggleEl.addEventListener("click", () => {
          setQueuePanelCollapsed(!state.queueCollapsed);
        });
        queuePanelResizerEl.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          event.preventDefault();
          const current = state.queueRailWidth || queuePanelEl.getBoundingClientRect().width;
          const next = event.key === "Home"
            ? 170
            : event.key === "End"
              ? 420
              : current + (event.key === "ArrowRight" ? 18 : -18);
          setQueueRailWidth(next);
        });
        queuePanelResizerEl.addEventListener("pointerdown", (event) => {
          if (state.queueCollapsed) setQueuePanelCollapsed(false);
          queuePanelResizerEl.classList.add("is-dragging");
          const startX = event.clientX;
          const startWidth = queuePanelEl.getBoundingClientRect().width;
          const onMove = (moveEvent) => {
            setQueueRailWidth(startWidth + moveEvent.clientX - startX);
          };
          const onUp = () => {
            queuePanelResizerEl.classList.remove("is-dragging");
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            window.removeEventListener("pointercancel", onUp);
          };
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
          window.addEventListener("pointercancel", onUp);
        });
      }

      function setQueueRailWidth(width) {
        const nextWidth = Math.round(Math.min(420, Math.max(170, width)));
        state.queueRailWidth = nextWidth;
        state.queueCollapsed = false;
        appShellEl.classList.remove("queue-collapsed");
        document.documentElement.style.setProperty("--queue-rail-width", `${nextWidth}px`);
        queuePanelToggleEl.textContent = "<";
        queuePanelToggleEl.setAttribute("aria-label", "Collapse PR rail");
        queuePanelToggleEl.title = "Collapse PR rail";
        window.requestAnimationFrame(() => renderPipelineLinks(state.currentRun));
      }

      function setQueuePanelCollapsed(collapsed) {
        state.queueCollapsed = collapsed;
        appShellEl.classList.toggle("queue-collapsed", collapsed);
        queuePanelToggleEl.textContent = collapsed ? ">" : "<";
        queuePanelToggleEl.setAttribute("aria-label", collapsed ? "Expand PR rail" : "Collapse PR rail");
        queuePanelToggleEl.title = collapsed ? "Expand PR rail" : "Collapse PR rail";
        window.requestAnimationFrame(() => renderPipelineLinks(state.currentRun));
      }

      function initAgentOutputDialog() {
        agentOutputCloseEl.addEventListener("click", closeAgentOutput);
        agentOutputDialogEl.addEventListener("click", (event) => {
          if (event.target === agentOutputDialogEl) closeAgentOutput();
        });
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !agentOutputDialogEl.classList.contains("hidden")) {
            closeAgentOutput();
          }
        });
      }

      function openAgentOutput() {
        renderAgentOutput(state.currentRun);
        agentOutputDialogEl.classList.remove("hidden");
        agentOutputCloseEl.focus();
      }

      function closeAgentOutput() {
        agentOutputDialogEl.classList.add("hidden");
      }

      function showAgentOutputError(error) {
        agentOutputHeadingEl.textContent = "Agent run error";
        agentOutputEl.innerHTML = `<div class="error">${esc(error.message || error)}</div>`;
        agentOutputDialogEl.classList.remove("hidden");
        agentOutputCloseEl.focus();
      }

      function initCodeDialog() {
        codeDialogCloseEl.addEventListener("click", closeCodeDialog);
        codeDialogEl.addEventListener("click", (event) => {
          if (event.target === codeDialogEl) closeCodeDialog();
        });
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !codeDialogEl.classList.contains("hidden")) {
            closeCodeDialog();
          }
        });
      }

      function openCodeDialog(path) {
        state.selectedCodePath = path;
        const file = findChangedFile(path);
        const context = reviewFileFocusItems(state.currentRun?.summary || {}).find((item) => item.path === path);
        const patch = file?.patch || file?.diff || "";
        codeDialogHeadingEl.textContent = path || "Changed file";
        codeDialogBodyEl.innerHTML = renderCodeDialogBody(path, file, context, patch);
        codeDialogEl.classList.remove("hidden");
        codeDialogCloseEl.focus();
      }

      function closeCodeDialog() {
        codeDialogEl.classList.add("hidden");
        state.selectedCodePath = null;
      }

      function bindCodeLinks() {
        for (const button of detailEl.querySelectorAll("[data-code-path]")) {
          button.addEventListener("click", () => openCodeDialog(button.dataset.codePath || ""));
        }
      }

      async function loadAgents() {
        const data = await fetchJson("/api/agents");
        state.agents = data.agents || [];
        state.enabledAgents = new Set(state.agents.map((agent) => agent.id));
        state.selectedAgentId = state.agents[0]?.id || null;
        renderAgentWorkflow();
      }

      async function runDemo() {
        const previous = runButton.textContent;
        runButton.disabled = true;
        runButton.textContent = "Running...";
        state.currentRun = null;
        workflowPanelEl.classList.remove("hidden");
        detailEl.classList.add("hidden");
        closeAgentOutput();
        updateWorkflowHeader("Analyzing demo PR", "Invoking enabled agents with visible execution gaps.");
        startFlowAnimation();
        try {
          const response = await fetch("/api/demo/analyze", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              enabled_agents: [...state.enabledAgents],
              agent_delay_ms: state.delayMs
            })
          });
          const data = await response.json();
          if (data.run) {
            state.selectedRunId = data.run.id;
            state.selectedPrId = data.run.pull_request_id;
            state.currentRun = data.run;
            updateWorkflowHeader("Agent run complete", "Use Show details in the PR list to open the dashboard.");
            renderAgentWorkflow(data.run);
          }
          await loadQueue({ preferredRunId: data.run?.id });
          if (!response.ok) {
            throw new Error(data.run?.summary?.next_action || data.error || "Demo analysis failed");
          }
        } catch (error) {
          showAgentOutputError(error);
        } finally {
          stopFlowAnimation();
          runButton.disabled = false;
          runButton.textContent = previous;
        }
      }

      async function loadQueue(options = {}) {
        const data = await fetchJson("/api/queue");
        state.rows = data.queue || [];
        renderMetrics(data.metrics || {});
        renderFilters();

        const selectedRow = chooseSelectedRow(options.preferredRunId);
        if (options.preferredRunId && selectedRow?.latest_run) {
          state.selectedRunId = selectedRow.latest_run.id;
          state.selectedPrId = selectedRow.pull_request.id;
        }

        renderQueue();
      }

      function chooseSelectedRow(preferredRunId) {
        if (preferredRunId) {
          const hit = state.rows.find((row) => row.latest_run?.id === preferredRunId);
          if (hit) return hit;
        }
        if (state.selectedRunId) {
          const hit = state.rows.find((row) => row.latest_run?.id === state.selectedRunId);
          if (hit) return hit;
        }
        if (state.selectedPrId) {
          const hit = state.rows.find((row) => row.pull_request?.id === state.selectedPrId);
          if (hit) return hit;
        }
        return state.rows[0];
      }

      function renderMetrics(metrics) {
        const total = state.rows.length || metrics.open_prs || 0;
        const reviewed = state.rows.filter((row) => hasFinishedAnalysis(row)).length || metrics.completed_runs || 0;
        const active = state.rows.filter((row) => isActivePr(row)).length;
        const needsAnalysisCount = state.rows.filter((row) => needsAnalysis(row)).length;
        metricsEl.innerHTML = [
          metric("Total PRs", total, "in queue"),
          metric("Reviewed", reviewed, "agent run complete"),
          metric("Active", active, "needs reviewer action"),
          metric("Need analysis", needsAnalysisCount, "waiting for agents")
        ].join("");
      }

      function renderFilters() {
        const repos = unique(state.rows.map((row) => row.pull_request?.repository?.full_name).filter(Boolean));
        const owners = unique(
          state.rows
            .flatMap((row) => {
              const summary = row.latest_run?.summary || {};
              return [
                row.pull_request?.author,
                ...(summary.owner_summary || []).map((owner) => owner.owner)
              ];
            })
            .filter(Boolean)
        );
        updateSelect(repoFilterEl, repos, "All repos", state.filters.repo);
        updateSelect(ownerFilterEl, owners, "All owners", state.filters.owner);
        stateFilterEl.value = state.filters.risk_state || "";
      }

      function renderQueue() {
        const rows = queueTabRows(filteredRows());
        const allFiltered = filteredRows();
        const activeCount = queueTabRows(allFiltered, "active").length;
        const reviewedCount = queueTabRows(allFiltered, "reviewed").length;
        queueCountEl.textContent = `${rows.length} PR${rows.length === 1 ? "" : "S"}`;
        for (const tabButton of queueTabButtons) {
          const tab = tabButton.dataset.queueTab || "active";
          const count = tab === "active" ? activeCount : reviewedCount;
          tabButton.classList.toggle("active", tab === state.queueTab);
          tabButton.setAttribute("aria-selected", String(tab === state.queueTab));
          tabButton.textContent = `${tab === "active" ? "Active" : "Reviewed"} (${count})`;
        }
        if (!rows.length) {
          queueListEl.innerHTML = `<div class="empty-state">No ${esc(state.queueTab)} pull requests match this scope.</div>`;
          return;
        }
        queueListEl.innerHTML = rows.map(queueCard).join("");
        for (const button of queueListEl.querySelectorAll("[data-action='analyze']")) {
          button.addEventListener("click", () => analyzePr(button.dataset.prId));
        }
        for (const button of queueListEl.querySelectorAll("[data-action='details']")) {
          button.addEventListener("click", () => showDetails(button.dataset.runId));
        }
      }

      async function analyzePr(prId) {
        const row = state.rows.find((item) => item.pull_request?.id === prId);
        if (!row) return;
        const pr = row.pull_request;
        state.activeAnalysisPrId = prId;
        state.selectedPrId = prId;
        state.selectedRunId = null;
        state.currentRun = null;
        workflowPanelEl.classList.remove("hidden");
        detailEl.classList.add("hidden");
        closeAgentOutput();
        updateWorkflowHeader(
          `Analyzing #${pr.number}`,
          `${pr.repository?.full_name || "repository"} / ${pr.title || "Untitled PR"}`
        );
        startFlowAnimation();
        renderQueue();
        try {
          const response = await fetch(`/api/prs/${encodeURIComponent(prId)}/analyze`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              enabled_agents: [...state.enabledAgents],
              agent_delay_ms: state.delayMs
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "PR analysis failed");
          state.selectedRunId = data.run.id;
          state.currentRun = data.run;
          updateWorkflowHeader("Agent run complete", "Show details is now available in the PR list.");
          renderAgentWorkflow(data.run);
          await loadQueue({ preferredRunId: data.run.id });
        } catch (error) {
          showAgentOutputError(error);
        } finally {
          state.activeAnalysisPrId = null;
          stopFlowAnimation();
          renderQueue();
        }
      }

      async function showDetails(runId) {
        if (!runId) return;
        const payload = await fetchJson(`/api/runs/${encodeURIComponent(runId)}`);
        state.selectedRunId = runId;
        state.selectedPrId = payload.run?.pull_request_id || null;
        state.selectedDetailTab = "overview";
        workflowPanelEl.classList.add("hidden");
        detailEl.classList.remove("hidden");
        closeAgentOutput();
        renderDetail(payload.run);
      }

      function renderAgentWorkflow(run = state.currentRun) {
        if (!state.agents.length) {
          agentFlowEl.innerHTML = `<div class="empty-state">Loading agents.</div>`;
          agentOutputEl.innerHTML = `<p class="muted">No agent selected.</p>`;
          return;
        }

        const stats = pipelineStats(run);
        agentFlowEl.innerHTML = `
          <div class="pipeline-header">
            <div>
              <p class="pipeline-eyebrow">Agents / live pipeline</p>
              <p class="pipeline-note">Downstream checks only light up after their upstream evidence is available.</p>
            </div>
            <div class="pipeline-stats" aria-label="Agent execution state">
              <span class="pipeline-stat running">${stats.running} running</span>
              <span class="pipeline-stat done">${stats.done} done</span>
              <span class="pipeline-stat failed">${stats.failed} failed</span>
              <span class="pipeline-stat">${stats.disabled} disabled</span>
            </div>
          </div>
          <div class="pipeline-board">
            <svg class="pipeline-link-layer" aria-hidden="true"></svg>
            <div class="pipeline-stages">
              ${agentPipelineLayers.map((layer) => pipelineStage(layer, run)).join("")}
            </div>
          </div>
        `;
        for (const button of agentFlowEl.querySelectorAll(".flow-node-main")) {
          button.addEventListener("click", () => {
            state.selectedAgentId = button.dataset.agentId;
            renderAgentWorkflow();
            openAgentOutput();
          });
        }
        for (const toggle of agentFlowEl.querySelectorAll(".agent-toggle")) {
          toggle.addEventListener("change", () => {
            if (toggle.checked) state.enabledAgents.add(toggle.dataset.agentId);
            else {
              state.enabledAgents.delete(toggle.dataset.agentId);
              state.flowCompletedAgentIds.delete(toggle.dataset.agentId);
            }
            renderAgentWorkflow();
          });
        }
        window.requestAnimationFrame(() => renderPipelineLinks(run));
        renderAgentOutput(run);
      }

      function updateWorkflowHeader(title, subtitle) {
        workflowTitleEl.textContent = title;
        workflowSubtitleEl.textContent = subtitle;
      }

      function pipelineStage(layer, run) {
        const agents = layer.agentIds
          .map((agentId) => state.agents.find((agent) => agent.id === agentId))
          .filter(Boolean);
        const completeCount = agents.filter((agent) => flowVisualState(agent, run) === "completed").length;
        return `<section class="pipeline-stage pipeline-stage-${escAttr(layer.id)}">
          <div class="pipeline-stage-head">
            <div>
              <span class="pipeline-stage-kicker">${esc(layer.kicker)}</span>
              <span class="pipeline-stage-title">${esc(layer.title)}</span>
            </div>
            <span class="pipeline-stage-count">${completeCount}/${agents.length}</span>
          </div>
          <div class="pipeline-stage-list">
            ${agents.map((agent) => pipelineAgentCard(agent, layer, run)).join("")}
          </div>
        </section>`;
      }

      function pipelineAgentCard(agent, layer, run) {
        const result = run?.agent_results?.[agent.id];
        const enabled = state.enabledAgents.has(agent.id);
        const selected = agent.id === state.selectedAgentId ? " selected" : "";
        const visualState = flowVisualState(agent, run);
        const status = result?.status || (visualState === "active" ? "running" : enabled ? "ready" : "disabled");
        const statusText = pipelineStatusLabel(status);
        const disabled = !enabled ? " disabled" : "";
        const visual = agentVisual(agent);
        return `<article class="pipeline-card ${escAttr(visualState)}${selected}${disabled}" data-pipeline-agent-id="${escAttr(agent.id)}">
          <button class="flow-node-main pipeline-card-main" type="button" data-agent-id="${escAttr(agent.id)}" title="${escAttr(agent.label)}">
            <span class="agent-icon ${escAttr(visual.tone)}">${esc(visual.icon)}</span>
            <span class="pipeline-card-copy">
              <span class="pipeline-card-stage">${esc(layer.title)} / ${esc(agent.stage)}</span>
              <span class="pipeline-card-title">${esc(agent.label)}</span>
            </span>
          </button>
          <div class="pipeline-progress" aria-hidden="true"><span></span></div>
          <div class="pipeline-card-footer">
            <div class="flow-status">${pill(statusText, status)}</div>
            <label class="switch" title="Enable ${escAttr(agent.label)}">
              <input class="agent-toggle" type="checkbox" data-agent-id="${escAttr(agent.id)}" ${enabled ? "checked" : ""} />
              <span aria-hidden="true"></span>
            </label>
          </div>
        </article>`;
      }

      function pipelineStatusLabel(status) {
        const normalized = String(status || "").toLowerCase();
        if (["completed", "success", "passed", "pass"].includes(normalized)) return "done";
        if (["failed", "failure", "analysis_failed", "block", "blocked"].includes(normalized)) return "fail";
        if (["running", "active", "in_progress"].includes(normalized)) return "run";
        if (["disabled", "skipped"].includes(normalized)) return "off";
        return "ready";
      }

      function renderPipelineLinks(run = state.currentRun) {
        const board = agentFlowEl.querySelector(".pipeline-board");
        const svg = agentFlowEl.querySelector(".pipeline-link-layer");
        if (!board || !svg) return;
        const boardRect = board.getBoundingClientRect();
        const width = Math.max(board.scrollWidth, Math.ceil(boardRect.width));
        const height = Math.max(board.scrollHeight, Math.ceil(boardRect.height));
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("width", String(width));
        svg.setAttribute("height", String(height));

        const paths = [];
        for (const [linkIndex, { sourceId, targetId }] of pipelineLinks().entries()) {
          const source = board.querySelector(`[data-pipeline-agent-id="${cssAttrSelectorValue(sourceId)}"]`);
          const target = board.querySelector(`[data-pipeline-agent-id="${cssAttrSelectorValue(targetId)}"]`);
          if (!source || !target) continue;
          const sourceRect = source.getBoundingClientRect();
          const targetRect = target.getBoundingClientRect();
          const x1 = sourceRect.right - boardRect.left;
          const y1 = sourceRect.top - boardRect.top + sourceRect.height / 2;
          const x2 = targetRect.left - boardRect.left;
          const y2 = targetRect.top - boardRect.top + targetRect.height / 2;
          const sourceLayer = agentLayerIndex(sourceId);
          const targetLayer = agentLayerIndex(targetId);
          const laneOffset = ((linkIndex % 5) - 2) * 12;
          const elbowX = x1 + Math.max(28, (x2 - x1) / 2) + laneOffset;
          const skipLane = skipLinkLane(sourceId, targetId, height);
          const exitX = x1 + skipLane.exitOffset + laneOffset / 3;
          const entryX = x2 - skipLane.entryOffset - laneOffset / 3;
          const stateName = pipelineLinkVisualState(sourceId, targetId, run);
          const path = targetLayer - sourceLayer > 1
            ? `M ${x1.toFixed(1)} ${y1.toFixed(1)} H ${exitX.toFixed(1)} V ${skipLane.y.toFixed(1)} H ${entryX.toFixed(1)} V ${y2.toFixed(1)} H ${x2.toFixed(1)}`
            : `M ${x1.toFixed(1)} ${y1.toFixed(1)} H ${elbowX.toFixed(1)} V ${y2.toFixed(1)} H ${x2.toFixed(1)}`;
          paths.push(`
            <path class="pipeline-link ${escAttr(stateName)}" d="${path}"></path>
            <circle class="pipeline-link-terminal ${escAttr(stateName)}" cx="${x1.toFixed(1)}" cy="${y1.toFixed(1)}" r="3.2"></circle>
            <circle class="pipeline-link-terminal ${escAttr(stateName)}" cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="3.6"></circle>
          `);
        }
        svg.innerHTML = paths.join("");
      }

      function skipLinkLane(sourceId, targetId, height) {
        const routeKey = `${sourceId}->${targetId}`;
        const topLanes = {
          "semantic-diff-explainer->test-coverage-validator": 78,
          "policy-gate->truth-report-synthesizer": 128,
          "semantic-evidence-agent->test-coverage-validator": 178,
          "semantic-evidence-agent->truth-report-synthesizer": 228,
          "slop-detector->truth-report-synthesizer": 278
        };
        if (topLanes[routeKey] != null) {
          return { y: topLanes[routeKey], exitOffset: 28, entryOffset: 30 };
        }
        if (routeKey === "intent-extractor->evidence-mapper") {
          return { y: Math.max(96, height - 52), exitOffset: 22, entryOffset: 26 };
        }
        return { y: Math.max(28, height - 58), exitOffset: 24, entryOffset: 24 };
      }

      function agentLayerIndex(agentId) {
        const index = agentPipelineLayers.findIndex((layer) => layer.agentIds.includes(agentId));
        return index < 0 ? 0 : index;
      }

      function pipelineLinks() {
        const known = new Set(state.agents.map((agent) => agent.id));
        return Object.entries(agentDependencies).flatMap(([targetId, sourceIds]) =>
          sourceIds
            .filter((sourceId) => known.has(sourceId) && known.has(targetId))
            .map((sourceId) => ({ sourceId, targetId }))
        );
      }

      function pipelineLinkVisualState(sourceId, targetId, run) {
        const source = state.agents.find((agent) => agent.id === sourceId);
        const target = state.agents.find((agent) => agent.id === targetId);
        if (!source || !target) return "disabled";
        if (!state.enabledAgents.has(sourceId) || !state.enabledAgents.has(targetId)) return "disabled";
        const sourceState = flowVisualState(source, run);
        const targetState = flowVisualState(target, run);
        if (sourceState === "failed" || targetState === "failed") return "failed";
        if (sourceState === "active" || targetState === "active") return "active";
        if (sourceState === "skipped" || targetState === "skipped") return "skipped";
        if (sourceState === "completed" || targetState === "completed") return "completed";
        return "ready";
      }

      function pipelineStats(run) {
        return state.agents.reduce((stats, agent) => {
          const visualState = flowVisualState(agent, run);
          if (visualState === "active") stats.running += 1;
          else if (visualState === "completed") stats.done += 1;
          else if (visualState === "failed") stats.failed += 1;
          else if (visualState === "disabled") stats.disabled += 1;
          else if (visualState === "skipped") stats.skipped += 1;
          else stats.ready += 1;
          return stats;
        }, { running: 0, done: 0, failed: 0, disabled: 0, skipped: 0, ready: 0 });
      }

      function cssAttrSelectorValue(value) {
        return String(value).replace(/\\/g, "\\\\").replace(/"/g, "\\\"");
      }

      function flowVisualState(agent, run) {
        const result = run?.agent_results?.[agent.id];
        if (!state.enabledAgents.has(agent.id)) return "disabled";
        const status = String(result?.status || "").toLowerCase();
        if (["failed", "failure", "error"].includes(status)) return "failed";
        if (status === "skipped") return "skipped";
        if (status) return "completed";
        if (agent.id === state.runningAgentId) return "active";
        if (state.flowCompletedAgentIds.has(agent.id)) return "completed";
        return "ready";
      }

      function agentVisual(agent) {
        return agentVisuals[agent.id] || { icon: agent.label.slice(0, 2).toUpperCase(), tone: "hotspots" };
      }

      function renderAgentOutput(run = state.currentRun) {
        const agent = state.agents.find((item) => item.id === state.selectedAgentId) || state.agents[0];
        if (!agent) {
          agentOutputHeadingEl.textContent = "Agent details";
          agentOutputEl.innerHTML = `<p class="muted">No agent selected.</p>`;
          return;
        }
        agentOutputHeadingEl.textContent = agent.label;
        const result = run?.agent_results?.[agent.id];
        const enabled = state.enabledAgents.has(agent.id);
        if (!result) {
          agentOutputEl.innerHTML = `<div class="agent-output-layout">
            <div class="agent-output-summary">
              <p class="section-kicker">${esc(agent.stage)}</p>
              <h4>${esc(agent.label)}</h4>
              <div class="chip-row">${pill(enabled ? "ready" : "disabled", enabled ? "info" : "disabled")}</div>
              <p>${esc(agent.description)}</p>
            </div>
            <div class="agent-output-json">
              <pre>${esc(JSON.stringify({ agent_id: agent.id, status: enabled ? "ready" : "disabled" }, null, 2))}</pre>
            </div>
          </div>`;
          return;
        }
        const payload = {
          agent_id: result.agent_id,
          status: result.status,
          confidence: result.confidence,
          messages: result.messages || [],
          output: result.output || {},
          trace: result.trace || []
        };
        agentOutputEl.innerHTML = `<div class="agent-output-layout">
          <div class="agent-output-summary">
            <p class="section-kicker">${esc(agent.stage)}</p>
            <h4>${esc(agent.label)}</h4>
            <div class="chip-row">
              ${pill(result.status || "completed")}
              ${result.confidence == null ? "" : pill(`${Math.round(result.confidence * 100)}% confidence`, "pass")}
            </div>
            <p>${esc((result.messages || [agent.description])[0] || agent.description)}</p>
          </div>
          <div class="agent-output-json">
            <pre>${esc(JSON.stringify(payload, null, 2))}</pre>
          </div>
        </div>`;
      }

      function startFlowAnimation() {
        stopFlowAnimation({ clearCompleted: true, rerender: false });
        const enabled = state.agents.filter((agent) => state.enabledAgents.has(agent.id));
        if (!enabled.length) return;
        let index = 0;
        state.flowCompletedAgentIds = new Set();
        state.runningAgentId = enabled[0].id;
        renderAgentWorkflow();
        state.flowTimer = window.setInterval(() => {
          const finishedAgent = enabled[index];
          if (finishedAgent) state.flowCompletedAgentIds.add(finishedAgent.id);
          index += 1;
          if (index >= enabled.length) {
            stopFlowAnimation();
            return;
          }
          state.runningAgentId = enabled[index].id;
          renderAgentWorkflow();
        }, Math.max(250, state.delayMs || 750));
      }

      function stopFlowAnimation(options = {}) {
        if (state.flowTimer) window.clearInterval(state.flowTimer);
        state.flowTimer = null;
        state.runningAgentId = null;
        if (options.clearCompleted) state.flowCompletedAgentIds = new Set();
        if (options.rerender !== false) renderAgentWorkflow();
      }

      function filteredRows() {
        return state.rows.filter((row) => {
          const pr = row.pull_request || {};
          const summary = row.latest_run?.summary || {};
          const repo = pr.repository?.full_name || "";
          if (state.filters.repo && repo !== state.filters.repo) return false;
          if (state.filters.owner) {
            const owners = [
              pr.author,
              ...(summary.owner_summary || []).map((owner) => owner.owner)
            ];
            if (!owners.includes(state.filters.owner)) return false;
          }
          if (state.filters.risk_state && summary.status !== state.filters.risk_state) return false;
          return true;
        });
      }

      function queueTabRows(rows, tab = state.queueTab) {
        return rows.filter((row) => (tab === "reviewed" ? isReviewedPr(row) : isActivePr(row)));
      }

      function hasFinishedAnalysis(row) {
        const runState = String(row.latest_run?.state || "").toLowerCase();
        return ["completed", "failed", "analysis_failed"].includes(runState);
      }

      function needsAnalysis(row) {
        return !hasFinishedAnalysis(row);
      }

      function isReviewedPr(row) {
        const status = String(row.latest_run?.summary?.status || "").toLowerCase();
        return ["pass", "passed", "approved", "merged"].includes(status);
      }

      function isActivePr(row) {
        return !isReviewedPr(row);
      }

      function queueCard(row) {
        const pr = row.pull_request || {};
        const run = row.latest_run || {};
        const summary = run.summary || {};
        const score = numericScore(summary.risk_score);
        const status = summary.status || run.state || "queued";
        const tone = score >= 70 ? "hot" : score >= 40 ? "mid" : "";
        const analyzing = state.activeAnalysisPrId === pr.id;
        const canShowDetails = run.id && ["completed", "failed"].includes(run.state);
        return `<article class="pr-row" data-pr-id="${escAttr(pr.id || "")}">
          <div class="pr-row-main">
            <div class="pr-title-line">
              <h3>#${esc(pr.number || "")} ${esc(pr.title || "Untitled PR")}</h3>
            </div>
            <div class="pr-meta">
              <span class="muted">${esc(pr.repository?.full_name || "")}</span>
              <span class="muted">${esc(pr.author || "unknown")}</span>
              ${pill(status)}
              ${pill(`${Object.keys(run.agent_results || {}).length} agents`, "info")}
            </div>
            <p class="queue-action">${esc(summary.next_action || "No analysis has run yet.")}</p>
          </div>
          <div class="score-stack">
            <div class="score-number">${scoreLabel(summary.risk_score)}</div>
            <div class="score-track"><div class="score-fill ${tone}" style="width:${score}%"></div></div>
          </div>
          <div class="pr-row-actions">
            <button class="small-button primary" type="button" data-action="analyze" data-pr-id="${escAttr(pr.id || "")}" ${analyzing ? "disabled" : ""}>
              ${analyzing ? "Analyzing" : "Analyze"}
            </button>
            ${canShowDetails ? `<button class="small-button success" type="button" data-action="details" data-run-id="${escAttr(run.id)}">Show details</button>` : ""}
          </div>
        </article>`;
      }

      function renderDetail(run) {
        if (!run) return;
        state.currentRun = run;
        const summary = run.summary || {};
        const pr = run.pull_request || {};
        const score = numericScore(summary.risk_score);
        const status = summary.status || run.state || "queued";
        const agentNames = Object.keys(run.agent_results || {});
        const tabs = detailTabs(run, summary, pr, agentNames);
        const selectedTab = tabs.find((tab) => tab.id === state.selectedDetailTab) || tabs[0];
        state.selectedDetailTab = selectedTab.id;

        detailEl.innerHTML = `
          <section class="panel detail-hero">
            <div>
              <p class="section-kicker">Truth report</p>
              <h2>#${esc(pr.number || "")} ${esc(pr.title || "Untitled pull request")}</h2>
              <div class="detail-meta">
                ${pill(status)}
                ${pill(`${agentNames.length} agents`, "info")}
                ${pill(run.state || "unknown", run.state || "unknown")}
                ${pr.url ? `<a class="chip" href="${escAttr(pr.url)}" target="_blank" rel="noreferrer">Open PR</a>` : ""}
              </div>
              <div class="summary-strip">
                ${summaryItem("Repository", pr.repository?.full_name || "unknown")}
                ${summaryItem("Top blocker", summary.top_blocker || "None")}
                ${summaryItem("Next action", summary.next_action || "Analysis pending")}
              </div>
            </div>
            ${riskDial(score)}
          </section>

          <section class="panel dashboard-tabs-panel" aria-label="PR analysis detail tabs">
            <div class="dashboard-tabs" role="tablist" aria-label="PR analysis sections">
              ${tabs.map((tab) => tabButton(tab, tab.id === selectedTab.id)).join("")}
            </div>
            ${tabPanel(selectedTab)}
          </section>
        `;

        for (const button of detailEl.querySelectorAll("[data-detail-tab]")) {
          button.addEventListener("click", () => {
            state.selectedDetailTab = button.dataset.detailTab;
            renderDetail(state.currentRun);
          });
        }
        bindCodeLinks();
      }

      function detailTabs(run, summary, pr, agentNames) {
        const coverage = summary.test_coverage || {};
        const memory = summary.semantic_memory || {};
        const slop = summary.slop || {};
        const coverageConfidence = coverage.confidence == null ? "n/a" : `${Math.round(coverage.confidence * 100)}%`;
        return [
          {
            id: "overview",
            label: "Overview",
            kicker: "Readiness",
            title: "Review posture",
            description: "The merge decision, required checks, and reviewer-facing next steps.",
            count: countItems(summary.checks),
            content: `
              <div class="tab-section">
                ${overviewChecks(summary.checks)}
              </div>
            `
          },
          {
            id: "agents",
            label: "Agents",
            kicker: "Execution mesh",
            title: "Independent agent outputs",
            description: "Status and confidence from each deployed MergeGuard agent.",
            count: agentNames.length,
            content: `<div class="agent-grid">${agentNames
              .map((name) => agentCard(name, run.agent_results[name]))
              .join("")}</div>`
          },
          {
            id: "review",
            label: "Reviewer Brief",
            kicker: "Review decision",
            title: "Reviewer Brief",
            description: "Merge posture, reviewer priorities, file focus, and suggested response in one place.",
            count: reviewBriefCount(summary),
            content: reviewBriefContent(run, summary, pr)
          },
          {
            id: "slop",
            label: "Slop",
            kicker: "Review hygiene",
            title: "Files to remove or rework",
            description: "Debug leftovers, placeholders, noisy churn, weak tests, and unrelated files surfaced for reviewer action.",
            count:
              countItems(summary.slop_findings)
              + countItems(summary.remove_candidates)
              + countItems(summary.rework_candidates),
            content: `
              <div class="summary-strip">
                ${summaryItem("Slop score", slop.slop_score == null ? "0" : `${slop.slop_score}/100`)}
                ${summaryItem("Remove", `${countItems(summary.remove_candidates)} candidates`)}
                ${summaryItem("Rework", `${countItems(summary.rework_candidates)} candidates`)}
              </div>
              <div class="tab-section">${cards(summary.remove_candidates, slopCard, "No remove candidates detected.")}</div>
              <div class="tab-section">${cards(summary.rework_candidates, slopCard, "No rework candidates detected.")}</div>
              <div class="tab-section">${cards(summary.slop_findings, slopCard, "No review slop detected.")}</div>
            `
          },
          {
            id: "evidence",
            label: "Evidence",
            kicker: "Verification evidence",
            title: "Requirement proof",
            description: "How PR requirements map to tests, changed files, and missing proof.",
            count: countItems(summary.evidence_links),
            content: cards(summary.evidence_links, evidenceCard, "No evidence gaps detected.")
          },
          {
            id: "memory",
            label: "Memory",
            kicker: "Vector recall",
            title: "Repository memory",
            description: "Related tests, docs, prior PRs, and policy context retrieved through Magenta memory.",
            count:
              countItems(summary.memory_evidence)
              + countItems(summary.related_tests)
              + countItems(summary.similar_prs)
              + countItems(summary.memory_matches),
            content: `
              <div class="summary-strip">
                ${summaryItem("Provider", memory.memory_provider || "not configured")}
                ${summaryItem("Indexed", memory.index?.records_stored == null ? "n/a" : `${memory.index.records_stored} records`)}
                ${summaryItem("Matches", countItems(summary.memory_matches))}
              </div>
              <div class="tab-section">${cards(summary.memory_evidence, memoryEvidenceCard, "No requirement memory evidence found.")}</div>
              <div class="tab-section">${cards(summary.related_tests, memoryHitCard, "No related repository tests found.")}</div>
              <div class="tab-section">${cards(summary.similar_prs, memoryHitCard, "No similar prior PRs found.")}</div>
              <div class="tab-section">${cards(summary.memory_matches, memoryHitCard, "No memory matches returned.")}</div>
            `
          },
          {
            id: "tests",
            label: "Tests",
            kicker: "Functional coverage",
            title: "Changed-test coverage",
            description: "How changed tests cover source changes, PR intent, and behavior deltas.",
            count: countItems(summary.test_coverage_findings) + countItems(summary.test_coverage_matrix),
            content: `
              <div class="summary-strip">
                ${summaryItem("Coverage score", coverage.coverage_score == null ? "n/a" : `${coverage.coverage_score}%`)}
                ${summaryItem("Coverage status", statusLabel(coverage.coverage_status || "unknown"))}
                ${summaryItem("Confidence", coverageConfidence)}
              </div>
              <div class="tab-section">${cards(summary.test_coverage_findings, testCoverageFindingCard, "No test coverage gaps detected.")}</div>
              <div class="tab-section">${cards(summary.test_coverage_matrix, testCoverageCard, "No changed source targets required tests.")}</div>
            `
          },
          {
            id: "behavior",
            label: "Behavior",
            kicker: "Runtime behavior",
            title: "Behavior impact and blast radius",
            description: "Detected behavior changes and downstream impact.",
            count: countItems(summary.behavioral_deltas) + countItems(summary.blast_radius),
            content: `
              <div class="tab-section">${cards(summary.behavioral_deltas, behaviorCard, "No behavior deltas detected.")}</div>
              <div class="tab-section">${cards(summary.blast_radius, blastCard, "No blast-radius items detected.")}</div>
            `
          },
          {
            id: "gates",
            label: "Gates",
            kicker: "Policy and prompt",
            title: "Policy guardrails and prompt drift checks",
            description: "Policy blocks, owner overrides, prompt drift, and model-output checks.",
            count: countItems(summary.policy_findings) + countItems(summary.prompt_canary_runs),
            content: `
              <div class="tab-section">${cards(summary.policy_findings, policyCard, "Policy guardrails pass.")}</div>
              <div class="tab-section">${cards(summary.prompt_canary_runs, promptCard, "No prompt drift checks required.")}</div>
            `
          },
          {
            id: "contracts",
            label: "Contracts",
            kicker: "Runtime assumptions",
            title: "Contracts and suggested tests",
            description: "Contract drift and generated test ideas for follow-up validation.",
            count: countItems(summary.contract_findings) + countItems(summary.suggested_tests),
            content: `
              <div class="tab-section">${cards(summary.contract_findings, contractCard, "No runtime contract drift.")}</div>
              <div class="tab-section">${cards(summary.suggested_tests, suggestedTestCard, "No generated test suggestions.")}</div>
            `
          },
          {
            id: "comment",
            label: "Comment",
            kicker: "Review comment",
            title: "Generated PR comment",
            description: "Ready-to-post reviewer summary synthesized from the agent run.",
            count: summary.comment ? 1 : 0,
            content: `<pre class="comment-box">${esc(summary.comment || "No comment generated.")}</pre>`
          }
        ];
      }

      function tabButton(tab, selected) {
        return `<button
          id="detail-tab-${escAttr(tab.id)}"
          class="dashboard-tab${selected ? " active" : ""}"
          type="button"
          role="tab"
          aria-selected="${selected ? "true" : "false"}"
          aria-controls="detail-panel-${escAttr(tab.id)}"
          data-detail-tab="${escAttr(tab.id)}">
          <span>${esc(tab.label)}</span>
          <small>${esc(tab.count || 0)}</small>
        </button>`;
      }

      function tabPanel(tab) {
        return `<div
          id="detail-panel-${escAttr(tab.id)}"
          class="dashboard-tab-body"
          role="tabpanel"
          aria-labelledby="detail-tab-${escAttr(tab.id)}">
          <div class="tab-panel-head">
            <div>
              <p class="section-kicker">${esc(tab.kicker)}</p>
              <h3>${esc(tab.title)}</h3>
              <p class="muted">${esc(tab.description)}</p>
            </div>
            ${pill(`${tab.count || 0} items`, "info")}
          </div>
          ${tab.content}
        </div>`;
      }

      function metric(label, value, hint) {
        return `<div class="metric"><span>${esc(label)}</span><strong>${esc(value)}</strong><small>${esc(hint || "")}</small></div>`;
      }

      function summaryItem(label, value) {
        return `<div class="summary-item"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
      }

      function agentCard(name, result) {
        const confidence = result?.confidence == null ? "" : `${Math.round(result.confidence * 100)}%`;
        const message = (result?.messages || [])[0] || result?.status || "completed";
        return `<div class="agent-card">
          <div class="agent-card-top">
            <code>${esc(name)}</code>
            ${pill(result?.status || "completed")}
          </div>
          <p>${esc(message)}</p>
          ${confidence ? `<div class="confidence">${esc(confidence)} confidence</div>` : ""}
        </div>`;
      }

      function countItems(items) {
        return Array.isArray(items) ? items.length : 0;
      }

      function reviewBriefCount(summary) {
        const checklist = reviewChecklist(summary || {});
        return checklist.must.length
          + checklist.verify.length
          + reviewFileFocusItems(summary || {}).length
          + (summary?.comment ? 1 : 0);
      }

      function reviewBriefContent(run, summary, pr) {
        const score = numericScore(summary.risk_score);
        const decision = reviewDecision(summary, score, run);
        const confidence = reviewConfidence(summary, run);
        const intent = primaryReviewIntent(summary, pr);
        const checklist = reviewChecklist(summary);
        const files = reviewFileFocusItems(summary);
        return `<div class="review-brief">
          <section class="review-decision" style="--review-tone:${decision.color};--review-score:${score}">
            <div>
              <div class="chip-row">
                ${pill(decision.status, decision.status)}
                ${pill(`${confidence}% confidence`, "info")}
              </div>
              <h4>${esc(decision.title)}</h4>
              <p>${esc(decision.reason)}</p>
            </div>
            <div class="review-decision-meter">
              <div class="review-decision-score">${esc(scoreLabel(summary.risk_score))}</div>
              <span class="review-list-label">risk</span>
            </div>
          </section>
          <div class="review-signal-grid">
            ${reviewSignal("PR intent", intent)}
            ${reviewSignal("Top blocker", summary.top_blocker || "No merge blocker detected.")}
            ${reviewSignal("Next action", summary.next_action || "No reviewer action generated.")}
            ${reviewSignal("File focus", `${files.length || countItems(summary.hotspots)} priority files`)}
          </div>
          <div class="review-brief-grid">
            ${reviewChecklistPanel(checklist)}
            ${reviewFileFocusPanel(files)}
          </div>
          ${reviewCommentPanel(summary.comment)}
        </div>`;
      }

      function reviewDecision(summary, score, run) {
        const status = String(summary.status || run?.state || "").toLowerCase();
        if (status.includes("block") || score >= 70) {
          return {
            status: "blocked",
            title: "Blocked until reviewer action is resolved",
            reason: summary.top_blocker || summary.next_action || "High-risk findings require review before merge.",
            color: "var(--red)"
          };
        }
        if (status.includes("review") || score >= 40) {
          return {
            status: "review",
            title: "Needs focused reviewer inspection",
            reason: summary.next_action || summary.top_blocker || "Inspect the highlighted files and evidence gaps before approval.",
            color: "var(--amber)"
          };
        }
        return {
          status: "pass",
          title: "Ready after final reviewer scan",
          reason: summary.next_action || "No blocking findings were detected by the agent run.",
          color: "var(--green)"
        };
      }

      function reviewConfidence(summary, run) {
        const checks = summary.checks || [];
        if (checks.length) {
          const decisive = checks.filter((item) => ["success", "failure"].includes(checkTone(item.conclusion || item.status))).length;
          return Math.max(35, Math.min(98, Math.round((decisive / checks.length) * 100)));
        }
        const results = Object.values(run?.agent_results || {});
        if (!results.length) return 50;
        const confidences = results.map((item) => Number(item.confidence)).filter(Number.isFinite);
        if (!confidences.length) return 65;
        return Math.round((confidences.reduce((sum, value) => sum + value, 0) / confidences.length) * 100);
      }

      function primaryReviewIntent(summary, pr) {
        const primary = (summary.intent_items || [])[0]?.text || pr.title || "Untitled PR";
        const secondary = (summary.intent_items || []).slice(1, 3).map((item) => item.text).filter(Boolean);
        return secondary.length ? `${primary}; ${secondary.join("; ")}` : primary;
      }

      function reviewSignal(label, value) {
        return `<div class="review-signal"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
      }

      function reviewChecklist(summary) {
        const must = uniqueReviewItems([
          summary.top_blocker,
          ...severityItems(summary.policy_findings, ["block", "blocked", "failure", "critical"]).map((item) => item.message || item.suggested_action),
          ...severityItems(summary.test_coverage_findings, ["block", "blocked"]).map((item) => item.suggested_action || item.message),
          ...severityItems(summary.prompt_canary_runs, ["failed", "failure", "block"]).map((item) => item.drift_summary || `Prompt drift check failed for ${item.prompt_path || item.suite || "prompt"}`),
          ...severityItems(summary.contract_findings, ["block", "review_required"]).map((item) => item.violated_assumption || item.suggested_test?.intent)
        ], 4);
        const verify = uniqueReviewItems([
          ...severityItems(summary.behavioral_deltas, ["review_required", "warn"]).map((item) => `${item.path}: ${item.divergent_input || item.new_behavior || "behavior changed"}`),
          ...severityItems(summary.evidence_links, ["missing", "partial", "review_required"]).map((item) => item.suggested_action || item.intent_text),
          ...severityItems(summary.slop_findings, ["review_required", "warn"]).map((item) => item.suggested_action || item.message),
          ...severityItems(summary.test_coverage_findings, ["review_required", "warn"]).map((item) => item.suggested_action || item.message)
        ], 4);
        const low = uniqueReviewItems([
          countItems(summary.memory_evidence) ? "Repository memory found related tests, docs, or prior PR context." : "",
          countItems(summary.owner_summary) ? "Review routing is available for changed ownership areas." : "",
          countItems(summary.hotspots) ? "Inspect non-hotspot files after the blocker path is resolved." : "No high-risk hotspots were identified."
        ], 3);
        return { must, verify, low };
      }

      function severityItems(items, states) {
        const wanted = new Set(states);
        return (items || []).filter((item) => {
          const state = String(item.severity || item.status || item.conclusion || item.evidence_status || "").toLowerCase();
          return [...wanted].some((value) => state.includes(value));
        });
      }

      function uniqueReviewItems(items, limit) {
        const seen = new Set();
        return (items || [])
          .map((item) => String(item || "").trim())
          .filter((item) => {
            const key = item.toLowerCase();
            if (!item || seen.has(key)) return false;
            seen.add(key);
            return true;
          })
          .slice(0, limit);
      }

      function reviewChecklistPanel(checklist) {
        return `<section class="review-list-card">
          ${reviewListGroup("Must inspect", checklist.must, "No blocking inspection items.")}
          ${reviewListGroup("Should verify", checklist.verify, "No additional verification items.")}
          ${reviewListGroup("Can skim", checklist.low, "No low-risk areas identified yet.")}
        </section>`;
      }

      function reviewListGroup(label, items, emptyText) {
        const tone = label.startsWith("Must") ? "must" : label.startsWith("Should") ? "verify" : "low";
        const rows = items.length ? items : [emptyText];
        return `<div class="review-list-group ${tone}">
          <span class="review-list-label">${esc(label)}</span>
          <ul>${rows.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>
        </div>`;
      }

      function reviewFileFocusItems(summary) {
        const byPath = new Map();
        const ensure = (path) => {
          const key = String(path || "").trim();
          if (!key) return null;
          if (!byPath.has(key)) {
            byPath.set(key, { path: key, risk: 0, reasons: [], owners: [], actions: [] });
          }
          return byPath.get(key);
        };
        for (const item of summary.hotspots || []) {
          const row = ensure(item.path);
          if (!row) continue;
          row.risk = Math.max(row.risk, numericScore(item.risk_score));
          row.reasons.push(item.reason);
          row.actions.push(item.required_action);
          row.owners.push(...(item.owners || []));
        }
        for (const item of summary.test_coverage_findings || []) {
          const row = ensure(item.path);
          if (!row) continue;
          row.risk = Math.max(row.risk, item.severity === "block" ? 88 : 62);
          row.reasons.push(item.message);
          row.actions.push(item.suggested_action);
        }
        for (const item of summary.policy_findings || []) {
          const row = ensure(item.path);
          if (!row) continue;
          row.risk = Math.max(row.risk, 90);
          row.reasons.push(item.message || item.rule_id);
          row.actions.push(item.suggested_action || item.owner);
        }
        for (const item of summary.contract_findings || []) {
          const row = ensure(item.path);
          if (!row) continue;
          row.risk = Math.max(row.risk, 72);
          row.reasons.push(item.violated_assumption);
          row.actions.push(item.suggested_test?.intent || item.suggested_test?.path);
        }
        for (const item of [...(summary.remove_candidates || []), ...(summary.rework_candidates || []), ...(summary.slop_findings || [])]) {
          const row = ensure(item.path);
          if (!row) continue;
          row.risk = Math.max(row.risk, Math.min(58, numericScore(item.score) || 48));
          row.reasons.push(item.message || item.category);
          row.actions.push(item.suggested_action || item.disposition);
        }
        return [...byPath.values()]
          .map((item) => ({
            ...item,
            reasons: uniqueReviewItems(item.reasons, 2),
            actions: uniqueReviewItems(item.actions, 2),
            owners: uniqueReviewItems(item.owners, 2)
          }))
          .sort((a, b) => b.risk - a.risk)
          .slice(0, 6);
      }

      function reviewFileFocusPanel(files) {
        if (!files.length) {
          return `<section class="review-file-focus"><span class="review-list-label">File focus</span><p class="muted">No priority files were flagged.</p></section>`;
        }
        return `<section class="review-file-focus">
          <span class="review-list-label">File focus</span>
          ${files.map((item) => `<article class="review-file-row">
            <div>
              <h4>
                <button class="code-link" type="button" data-code-path="${escAttr(item.path)}" aria-label="Open ${escAttr(item.path)} changed code">
                  <code>${esc(item.path)}</code>
                </button>
              </h4>
              <p>${esc(item.reasons.join(" "))}</p>
              <p>${esc(item.actions.join(" ") || "Inspect this file before approval.")}</p>
            </div>
            <div class="chip-row">
              ${scoreChip(item.risk)}
              ${item.owners.length ? pill(item.owners[0], "info") : ""}
            </div>
          </article>`).join("")}
        </section>`;
      }

      function findChangedFile(path) {
        const run = state.currentRun || {};
        const candidates = [
          ...(run.changed_files || []),
          ...(run.input_payload?.changed_files || []),
          ...(run.input_payload?.files || [])
        ];
        return candidates.find((file) => {
          const filePath = file.path || file.filename || file.file || "";
          return filePath === path;
        });
      }

      function renderCodeDialogBody(path, file, context, patch) {
        const additions = file?.additions == null ? null : `+${file.additions}`;
        const deletions = file?.deletions == null ? null : `-${file.deletions}`;
        const changes = [file?.status, additions, deletions].filter(Boolean).join("  ");
        const reasons = context?.reasons?.length ? context.reasons : ["No file-specific risk reason was captured for this path."];
        const actions = context?.actions?.length ? context.actions : ["Inspect the diff before approval."];
        const owners = context?.owners || [];
        const fallback = [
          "No patch was stored for this run.",
          "",
          "Reviewer context:",
          ...reasons.map((item) => `* ${item}`),
          ...actions.map((item) => `* ${item}`)
        ].join("\n");
        return `
          <aside class="code-context-card">
            <div>
              <span class="review-list-label">File</span>
              <h4><code>${esc(path || "unknown")}</code></h4>
            </div>
            <div class="chip-row">
              ${scoreChip(context?.risk ?? 0)}
              ${owners[0] ? pill(owners[0], "info") : ""}
            </div>
            ${changes ? `<p>${esc(changes)}</p>` : ""}
            <div>
              <span class="review-list-label">Why inspect</span>
              <ul class="code-context-list">${reasons.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>
            </div>
            <div>
              <span class="review-list-label">Reviewer action</span>
              <ul class="code-context-list">${actions.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>
            </div>
          </aside>
          ${renderPatchViewer(patch || fallback)}
        `;
      }

      function renderPatchViewer(patch) {
        const lines = String(patch || "").split("\n");
        return `<pre class="code-viewer" aria-label="Changed code diff">${lines.map((line) => {
          const klass = patchLineClass(line);
          return `<span class="code-line ${klass}">${esc(line || " ")}</span>`;
        }).join("")}</pre>`;
      }

      function patchLineClass(line) {
        if (line.startsWith("@@")) return "hunk";
        if (line.startsWith("diff ") || line.startsWith("index ") || line.startsWith("+++ ") || line.startsWith("--- ")) return "meta";
        if (line.startsWith("+")) return "add";
        if (line.startsWith("-")) return "del";
        return "";
      }

      function reviewCommentPanel(comment) {
        if (!comment) return "";
        return `<section class="review-comment-card">
          <span class="review-list-label">Suggested review comment</span>
          <pre>${esc(comment)}</pre>
        </section>`;
      }

      function cards(items, renderer, emptyText) {
        const list = items || [];
        if (!list.length) return `<p class="muted">${esc(emptyText)}</p>`;
        return `<div class="review-grid">${list.slice(0, 8).map((item) => `<article class="review-card">${renderer(item)}</article>`).join("")}</div>`;
      }

      function overviewChecks(items) {
        const list = items || [];
        if (!list.length) return `<p class="muted">No checks generated for this run.</p>`;
        return `<div class="overview-check-grid">${list.slice(0, 8).map(overviewCheckCard).join("")}</div>`;
      }

      function overviewCheckCard(item) {
        const state = item.conclusion || item.status || "unknown";
        const tone = checkTone(state);
        const label = tone === "success" ? "success" : tone === "failure" ? "failure" : "neutral";
        const score = tone === "neutral" ? 72 : 100;
        return `<article class="overview-check-card ${escAttr(tone)}">
          <div class="overview-status-dial" style="--status-score:${score}">
            <div class="overview-status-inner">
              <div>
                <div class="overview-status-label">${esc(label)}</div>
                <div class="overview-status-caption">state</div>
              </div>
            </div>
          </div>
          <h4>${esc(displayCheckName(item.name || "MergeGuard check"))}</h4>
          <p>${esc(item.summary || item.details || "No additional check details.")}</p>
        </article>`;
      }

      function displayCheckName(name) {
        return String(name || "")
          .replace("MergeGuard / Review Brief", "MergeGuard / Change Triage")
          .replace("MergeGuard / Intent Match", "MergeGuard / Requirement Match")
          .replace("MergeGuard / Evidence Coverage", "MergeGuard / Verification Evidence")
          .replace("MergeGuard / Behavioral Diff", "MergeGuard / Behavior Impact")
          .replace("MergeGuard / Concept Policy", "MergeGuard / Policy Guardrails")
          .replace("MergeGuard / Prompt Canary", "MergeGuard / Prompt Drift Check");
      }

      function checkTone(value) {
        const key = String(value || "neutral").toLowerCase().replace(/[^a-z0-9_]+/g, "_");
        if (["success", "pass", "passed", "completed", "ok"].includes(key)) return "success";
        if (key.includes("fail") || key.includes("block") || key.includes("error") || key.includes("critical")) return "failure";
        return "neutral";
      }

      function ownerCard(item) {
        const fileCount = item.file_count ?? item.count ?? (item.files || []).length;
        return `<div class="review-card-top"><h4>${esc(item.owner || "unassigned")}</h4>${pill(`${fileCount} files`, "info")}</div>
          <p>${esc((item.files || []).join(", ") || "Review ownership inferred from changed paths.")}</p>`;
      }

      function hotspotCard(item) {
        return `<div class="review-card-top"><h4><code>${esc(item.path)}</code></h4>${scoreChip(item.risk_score)}</div>
          <p>${esc(item.reason || "")}</p>
          <div class="muted">${esc((item.owners || []).join(", ") || "unassigned")}</div>`;
      }

      function slopCard(item) {
        const signals = (item.signals || []).join(", ");
        return `<div class="review-card-top"><h4><code>${esc(item.path || "changed file")}</code></h4>${pill(item.disposition || item.severity || "review")}</div>
          <p>${esc(item.message || item.suggested_action || "Review hygiene finding.")}</p>
          <div class="chip-row">
            ${pill(item.category || "slop", item.severity || "neutral")}
            ${item.score == null ? "" : scoreChip(item.score)}
          </div>
          <div class="muted">${esc(signals || item.suggested_action || "Inspect this change before merge.")}</div>`;
      }

      function evidenceCard(item) {
        return `<div class="review-card-top"><h4>${esc(item.intent_text || item.message || "Evidence")}</h4>${pill(item.evidence_status || item.severity || "info")}</div>
          <p>${esc(item.suggested_action || "")}</p>
          <div class="muted">${esc((item.mapped_paths || item.evidence_paths || []).join(", ") || "no mapped paths")}</div>`;
      }

      function memoryEvidenceCard(item) {
        const candidates = [
          ...(item.test_candidates || []),
          ...(item.doc_candidates || [])
        ].map((candidate) => candidate.path || candidate.title).filter(Boolean);
        return `<div class="review-card-top"><h4>${esc(item.intent_text || "Requirement memory")}</h4>${pill(item.status || "unknown")}</div>
          <p>${esc(item.suggested_action || "Review retrieved repository memory.")}</p>
          <div class="muted">${esc(candidates.join(", ") || "no candidate paths")}</div>`;
      }

      function memoryHitCard(item) {
        const score = item.score == null ? "" : ` ${Math.round(Number(item.score) * 100)}%`;
        return `<div class="review-card-top"><h4>${item.path ? `<code>${esc(item.path)}</code>` : esc(item.title || item.label || "Memory")}</h4>${pill(`${item.kind || "memory"}${score}`, "info")}</div>
          <p>${esc(item.text || item.title || "")}</p>
          <div class="muted">${esc(item.source || item.label || "repository memory")}</div>`;
      }

      function testCoverageFindingCard(item) {
        return `<div class="review-card-top"><h4>${esc(item.message || "Coverage gap")}</h4>${pill(item.severity || "review")}</div>
          <p>${esc(item.suggested_action || "Add or link changed-test evidence.")}</p>
          <div class="muted">${esc(item.path || "changed behavior")}</div>`;
      }

      function testCoverageCard(item) {
        const tests = (item.matched_tests || []).map((test) => test.path).join(", ");
        return `<div class="review-card-top"><h4><code>${esc(item.path)}</code></h4>${pill(item.status || "unknown")}</div>
          <p>${esc(item.reason || "")}</p>
          <div class="muted">coverage ${esc(Math.round(Number(item.coverage || 0) * 100))}% / confidence ${esc(Math.round(Number(item.confidence || 0) * 100))}%</div>
          <div class="muted">${esc(tests || "no matched changed tests")}</div>`;
      }

      function behaviorCard(item) {
        return `<div class="review-card-top"><h4><code>${esc(item.path)}</code></h4>${pill(item.severity || "review")}</div>
          <p>${esc(item.new_behavior || item.summary || "")}</p>
          <div class="muted">${esc(item.divergent_input || item.symbol || "")}</div>`;
      }

      function blastCard(item) {
        return `<h4><code>${esc(item.path)}</code></h4>
          <p>${esc((item.downstream_services || []).join(", ") || "No downstream service listed.")}</p>
          <div class="muted">Callers: ${esc((item.direct_callers || []).join(", ") || "none")}</div>`;
      }

      function policyCard(item) {
        return `<div class="review-card-top"><h4>${esc(item.rule_id || item.concept)}</h4>${pill(item.severity || "warn")}</div>
          <p>${esc(item.message || "")}</p>
          <div class="muted">${esc(item.owner || "unassigned")} / ${esc(item.path || "")}</div>`;
      }

      function promptCard(item) {
        return `<div class="review-card-top"><h4>${esc(displayPromptSuiteName(item.suite || "prompt drift check"))}</h4>${pill(item.status || "unknown")}</div>
          <p>${esc(item.drift_summary || item.prompt_path || "")}</p>
          <div class="muted">correctness ${esc(item.correctness)} / format ${esc(item.format)} / cost ${esc(item.cost_delta_pct)}%</div>`;
      }

      function displayPromptSuiteName(name) {
        return String(name || "")
          .replaceAll("prompt-canary", "prompt-drift")
          .replaceAll("prompt canary", "prompt drift check");
      }

      function contractCard(item) {
        return `<div class="review-card-top"><h4><code>${esc(item.path)}</code></h4>${pill(item.severity || "review")}</div>
          <p>${esc(item.violated_assumption || "")}</p>
          <div class="muted">${esc(item.suggested_test?.path || "")}</div>`;
      }

      function suggestedTestCard(item) {
        return `<h4><code>${esc(item.path)}</code></h4>
          <p>${esc(item.intent || "")}</p>
          <div class="muted">${esc(item.framework || "repo-default")}</div>`;
      }

      function barList(items, labelKey, valueKey) {
        const list = items || [];
        if (!list.length) return "";
        const max = Math.max(...list.map((item) => Number(item[valueKey] || 0)), 1);
        return `<div class="bar-list">${list.slice(0, 8).map((item) => {
          const value = Number(item[valueKey] || 0);
          const pct = Math.round((value / max) * 100);
          return `<div class="bar-row">
            <span>${esc(item[labelKey])}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
            <strong>${esc(value)}</strong>
          </div>`;
        }).join("")}</div>`;
      }

      function riskDial(score) {
        const color = score >= 70 ? "var(--red)" : score >= 40 ? "var(--amber)" : "var(--green)";
        return `<div class="risk-dial" style="--score:${score};--risk-color:${color}">
          <div class="risk-dial-inner">
            <div>
              <div class="risk-number">${score}</div>
              <div class="risk-caption">risk</div>
            </div>
          </div>
        </div>`;
      }

      function scoreChip(score) {
        return `<span class="chip">risk ${scoreLabel(score)}</span>`;
      }

      function pill(value, tone) {
        const label = statusLabel(value);
        const key = String(tone || value || "unknown").toLowerCase().replace(/[^a-z0-9_]+/g, "_");
        return `<span class="pill pill-${escAttr(key)}">${esc(label)}</span>`;
      }

      function statusLabel(value) {
        return String(value || "unknown").replaceAll("_", " ").toUpperCase();
      }

      function scoreLabel(score) {
        return score == null ? "n/a" : String(score);
      }

      function numericScore(score) {
        return Math.max(0, Math.min(100, Number(score || 0)));
      }

      function updateSelect(select, values, fallback, selected) {
        const current = selected || select.value;
        select.innerHTML = `<option value="">${esc(fallback)}</option>${values
          .map((value) => `<option value="${escAttr(value)}">${esc(value)}</option>`)
          .join("")}`;
        select.value = values.includes(current) ? current : "";
      }

      function unique(values) {
        return [...new Set(values)].sort((a, b) => a.localeCompare(b));
      }

      async function fetchJson(path, options) {
        const response = await fetch(path, options);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || `${response.status} ${response.statusText}`);
        }
        return data;
      }

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function escAttr(value) {
        return esc(value).replaceAll("`", "&#96;");
      }
    </script>
  </body>
</html>
