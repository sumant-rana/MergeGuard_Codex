<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MergeGuard Agentic Command Center</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("mergeguard-theme");
          document.documentElement.dataset.theme = stored === "light" ? "light" : "dark";
        } catch {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        /* Tungsten Forge — iron base, hot-orange primary, sapphire success.
           Only color values changed; variable names + structure preserved. */
        --bg: #0e1014;
        --bg-soft: #11141b;
        --surface: rgba(26, 30, 37, 0.94);
        --surface-strong: #1a1e25;
        --surface-soft: #14181f;
        --surface-muted: rgba(20, 24, 31, 0.88);
        --surface-raised: rgba(35, 41, 52, 0.96);
        --surface-inset: #0a0d11;
        --border: rgba(186, 196, 214, 0.22);
        --border-strong: rgba(255, 133, 52, 0.34);
        --text: #e5e9f0;
        --text-soft: #c4cbd6;
        --muted: #7b8595;
        --primary: #ff8534;
        --primary-fg: #1a0f08;
        --blue: #6bc4ff;
        --indigo: #a8a0ff;
        --green: #4fd1ff;
        --amber: #f5d547;
        --red: #e03e5c;
        --violet: #b891ff;
        --grid: rgba(255, 133, 52, 0.045);
        --brand-mark: #ff8534;
        --brand-mark-fg: #1a0f08;
        --app-bg:
          linear-gradient(135deg, rgba(255, 133, 52, 0.10), transparent 28%),
          linear-gradient(315deg, rgba(79, 209, 255, 0.07), transparent 24%),
          linear-gradient(180deg, #0e1014 0%, #131720 48%, #0a0d11 100%);
        --topbar-bg: rgba(14, 16, 20, 0.84);
        --button-bg: rgba(26, 30, 37, 0.92);
        --button-hover-bg: rgba(35, 41, 52, 0.96);
        --primary-button-bg: linear-gradient(135deg, #ff8534, #ffb47a);
        --primary-button-shadow: 0 12px 30px rgba(255, 133, 52, 0.18);
        --card-bg: rgba(20, 24, 31, 0.86);
        --tab-bg: rgba(12, 14, 18, 0.76);
        --code-bg: #07090c;
        --ring-inner-bg: #0a0d11;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.42);
        --shadow-soft: 0 1px 0 rgba(255, 255, 255, 0.04) inset;
        --radius: 8px;
        --topbar-height: 46px;
        --queue-rail-width: clamp(170px, 21vw, 300px);
        /* Pipeline-specific tokens so cards visibly elevate over the canvas. */
        --mg-pipeline-canvas-bg: #11141b;
        --mg-pipeline-card-bg: #232934;
        --mg-pipeline-card-border: rgba(186, 196, 214, 0.22);
        --mg-pipeline-card-border-left: #ff8534;
        --mg-pipeline-card-shadow:
          0 1px 0 rgba(255, 255, 255, 0.05) inset,
          0 1px 3px rgba(0, 0, 0, 0.55),
          0 8px 22px rgba(0, 0, 0, 0.32);
        --mg-pipeline-dot: rgba(186, 196, 214, 0.08);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f4f2ee;
        --bg-soft: #faf8f4;
        --surface: rgba(255, 255, 255, 0.94);
        --surface-strong: #ffffff;
        --surface-soft: #faf8f4;
        --surface-muted: rgba(250, 248, 244, 0.92);
        --surface-raised: rgba(255, 255, 255, 0.98);
        --surface-inset: #f2eee7;
        --border: rgba(122, 111, 94, 0.22);
        --border-strong: rgba(45, 63, 181, 0.34);
        --text: #1a1f2e;
        --text-soft: #3e4657;
        --muted: #6b7280;
        --primary: #2d3fb5;
        --primary-fg: #ffffff;
        --blue: #2d3fb5;
        --indigo: #5360c8;
        --green: #1b8754;
        --amber: #b8742a;
        --red: #c13838;
        --violet: #7957c8;
        --grid: rgba(45, 63, 181, 0.045);
        --brand-mark: #1a1f2e;
        --brand-mark-fg: #f4f2ee;
        --app-bg:
          linear-gradient(135deg, rgba(45, 63, 181, 0.08), transparent 28%),
          linear-gradient(315deg, rgba(27, 135, 84, 0.07), transparent 24%),
          linear-gradient(180deg, #f4f2ee 0%, #faf8f4 52%, #ebe6dc 100%);
        --topbar-bg: rgba(244, 242, 238, 0.86);
        --button-bg: rgba(255, 255, 255, 0.9);
        --button-hover-bg: rgba(250, 248, 244, 0.98);
        --primary-button-bg: linear-gradient(135deg, #2d3fb5, #1b8754);
        --primary-button-shadow: 0 12px 28px rgba(45, 63, 181, 0.16);
        --card-bg: rgba(255, 255, 255, 0.88);
        --tab-bg: rgba(250, 248, 244, 0.82);
        --code-bg: #f7f5ef;
        --ring-inner-bg: #ffffff;
        --shadow: 0 18px 54px rgba(71, 64, 51, 0.12);
        --shadow-soft: 0 1px 0 rgba(255, 255, 255, 0.72) inset;
        /* Pipeline tokens for light mode: cream canvas, pure-white cards. */
        --mg-pipeline-canvas-bg: #ece4d2;
        --mg-pipeline-card-bg: #ffffff;
        --mg-pipeline-card-border: #6a4528;
        --mg-pipeline-card-border-left: #1a1f2e;
        --mg-pipeline-card-shadow:
          0 1px 2px rgba(33, 39, 60, 0.06),
          0 4px 12px rgba(33, 39, 60, 0.1),
          0 14px 30px rgba(33, 39, 60, 0.08);
        --mg-pipeline-dot: rgba(60, 53, 40, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        min-width: 320px;
        background: var(--app-bg);
        color: var(--text);
        font: 11.2px/1.42 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        letter-spacing: 0;
        transition: background 0.2s ease, color 0.2s ease;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, black, transparent 82%);
      }

      button,
      select {
        font: inherit;
      }

      button {
        color: inherit;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      a {
        color: var(--blue);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        min-height: var(--topbar-height);
        padding: 7px 14px;
        border-bottom: 1px solid var(--border);
        background: var(--topbar-bg);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        flex: 1 1 auto;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .brand-mark {
        width: 22px;
        height: 22px;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--brand-mark), var(--green));
        box-shadow: 0 0 24px color-mix(in oklab, var(--brand-mark) 22%, transparent);
      }

      .brand h1 {
        margin: 0;
        font-size: 13px;
        line-height: 1.1;
      }

      .brand p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 8.8px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .topbar-actions {
        display: flex;
        flex: 0 0 auto;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        margin-left: auto;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 27px;
        padding: 0 10px;
        border: 1px solid var(--border-strong);
        border-radius: 7px;
        background: var(--button-bg);
        color: var(--text);
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        border-color: color-mix(in oklab, var(--primary) 58%, transparent);
        background: var(--button-hover-bg);
      }

      .button:disabled {
        cursor: wait;
        opacity: 0.64;
        transform: none;
      }

      .button-primary {
        border-color: color-mix(in oklab, var(--primary) 46%, var(--border));
        background: var(--primary-button-bg);
        color: var(--primary-fg);
        box-shadow: var(--primary-button-shadow);
      }

      .theme-toggle {
        position: relative;
        flex: 0 0 auto;
        width: 60px;
        min-width: 60px;
        min-height: 27px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: transparent;
        box-shadow: none;
      }

      .theme-toggle:hover {
        border-color: transparent;
        background: transparent;
      }

      .theme-toggle:focus-visible {
        outline: 3px solid color-mix(in oklab, var(--primary) 58%, transparent);
        outline-offset: 4px;
      }

      .theme-toggle-track {
        position: absolute;
        inset: 2px;
        border: 2px solid transparent;
        border-radius: 999px;
        background:
          linear-gradient(var(--surface-inset), var(--surface-inset)) padding-box,
          linear-gradient(135deg, var(--blue), var(--primary)) border-box;
        box-shadow:
          inset 0 0 0 1px color-mix(in oklab, var(--text) 6%, transparent),
          0 10px 28px color-mix(in oklab, var(--primary) 14%, transparent);
      }

      .theme-toggle-thumb {
        position: absolute;
        top: 50%;
        left: 4px;
        display: grid;
        place-items: center;
        width: 22px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--blue));
        box-shadow:
          0 8px 18px color-mix(in oklab, var(--blue) 28%, transparent),
          inset 0 1px 0 color-mix(in oklab, white 34%, transparent);
        transform: translate(30px, -50%);
        transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
      }

      .theme-toggle-icon {
        position: absolute;
        display: block;
        transition: opacity 0.16s ease, transform 0.16s ease;
      }

      .theme-toggle-icon-moon {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--primary-fg);
      }

      .theme-toggle-icon-moon::before {
        position: absolute;
        top: -2px;
        left: 6px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: color-mix(in oklab, var(--blue) 76%, var(--primary));
        content: "";
      }

      .theme-toggle-icon-moon::after {
        position: absolute;
        top: 2px;
        right: -8px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--primary-fg);
        box-shadow:
          6px 4px 0 -1px var(--primary-fg),
          1px 8px 0 -1px var(--primary-fg);
        content: "";
      }

      .theme-toggle-icon-sun {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--primary-fg);
        opacity: 0;
        transform: rotate(-20deg) scale(0.72);
      }

      .theme-toggle-icon-sun::after {
        position: absolute;
        top: -7px;
        left: 5px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--primary-fg);
        box-shadow:
          0 24px 0 var(--primary-fg),
          12px 12px 0 var(--primary-fg),
          -12px 12px 0 var(--primary-fg),
          9px 3px 0 -1px var(--primary-fg),
          -9px 3px 0 -1px var(--primary-fg),
          9px 21px 0 -1px var(--primary-fg),
          -9px 21px 0 -1px var(--primary-fg);
        content: "";
      }

      :root[data-theme="light"] .theme-toggle-track {
        background:
          linear-gradient(var(--surface-inset), var(--surface-inset)) padding-box,
          linear-gradient(135deg, var(--amber), var(--red), var(--primary)) border-box;
        box-shadow:
          inset 0 0 0 1px color-mix(in oklab, var(--text) 7%, transparent),
          0 10px 24px color-mix(in oklab, var(--amber) 18%, transparent);
      }

      :root[data-theme="light"] .theme-toggle-thumb {
        background: linear-gradient(135deg, var(--amber), var(--red));
        box-shadow:
          0 8px 18px color-mix(in oklab, var(--amber) 22%, transparent),
          inset 0 1px 0 color-mix(in oklab, white 38%, transparent);
        transform: translate(0, -50%);
      }

      :root[data-theme="light"] .theme-toggle-icon-moon {
        opacity: 0;
        transform: rotate(18deg) scale(0.72);
      }

      :root[data-theme="light"] .theme-toggle-icon-sun {
        opacity: 1;
        transform: rotate(0) scale(1);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .shell {
        display: grid;
        grid-template-columns: var(--queue-rail-width) minmax(0, 1fr);
        gap: 8px;
        width: 100%;
        height: calc(100vh - var(--topbar-height));
        margin: 0 auto;
        padding: 8px;
        overflow: hidden;
        align-items: stretch;
      }

      .app-shell.queue-collapsed {
        grid-template-columns: 38px minmax(0, 1fr);
      }

      .workbench {
        display: grid;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
        gap: 16px;
        align-items: stretch;
      }

      .hero-panel,
      .risk-panel,
      .panel,
      .metric,
      .queue-card,
      .review-card,
      .agent-card,
      .empty-state,
      .error {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-soft), var(--shadow);
      }

      .hero-panel {
        position: relative;
        overflow: hidden;
        min-height: 214px;
        padding: 24px;
      }

      .hero-panel::after {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 58%;
        height: 1px;
        content: "";
        background: linear-gradient(90deg, transparent, var(--primary), var(--green));
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--primary);
        font-size: 12px;
        font-weight: 850;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .hero-title {
        max-width: 780px;
        margin: 0;
        font-size: clamp(28px, 5vw, 54px);
        line-height: 1;
        letter-spacing: 0;
      }

      .hero-copy {
        max-width: 780px;
        margin: 14px 0 0;
        color: var(--text-soft);
        font-size: 15px;
      }

      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }

      .risk-panel {
        display: grid;
        grid-template-columns: 136px minmax(0, 1fr);
        gap: 18px;
        align-items: center;
        padding: 20px;
      }

      .risk-dial {
        --score: 0;
        width: 132px;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background:
          conic-gradient(var(--risk-color, var(--primary)) calc(var(--score) * 1%), color-mix(in oklab, var(--muted) 18%, transparent) 0),
          radial-gradient(circle at center, var(--surface-inset) 0 58%, transparent 59%);
        box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--text) 6%, transparent);
      }

      .risk-dial-inner {
        display: grid;
        place-items: center;
        width: 92px;
        aspect-ratio: 1;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--ring-inner-bg);
      }

      .risk-number {
        font-size: 30px;
        font-weight: 900;
        line-height: 1;
      }

      .risk-caption {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .risk-panel h2 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      .risk-panel p {
        margin: 0;
        color: var(--text-soft);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }

      .compact-metrics {
        width: 100%;
      }

      .metric {
        min-height: 56px;
        padding: 8px 9px;
      }

      .compact-metrics .metric {
        min-height: 50px;
        padding: 7px 8px;
      }

      .compact-metrics .metric strong {
        font-size: 18px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 8.8px;
        font-weight: 850;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .metric strong {
        display: block;
        margin-top: 5px;
        font-size: 22px;
        line-height: 1;
      }

      .metric small {
        display: block;
        margin-top: 5px;
        color: var(--text-soft);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(360px, 0.78fr) minmax(0, 1.22fr);
        gap: 16px;
        align-items: start;
      }

      .queue-pane {
        position: sticky;
        top: 86px;
        display: grid;
        gap: 12px;
        min-width: 0;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 14px 0;
      }

      .panel-title {
        margin: 0;
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
        padding: 0;
      }

      .filters label {
        display: grid;
        gap: 3px;
        color: var(--muted);
        font-size: 8.8px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .filters select {
        width: 100%;
        min-height: 26px;
        padding: 0 7px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface-raised);
        color: var(--text);
        outline: none;
      }

      .queue-list {
        display: grid;
        align-content: start;
        gap: 6px;
        max-height: none;
        min-height: 0;
        overflow: auto;
        padding: 0 2px 2px 0;
      }

      .pr-list-panel {
        position: relative;
        display: grid;
        grid-template-rows: auto auto auto auto minmax(0, 1fr);
        gap: 8px;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        padding: 9px;
      }

      .rail-toggle {
        position: absolute;
        top: 7px;
        right: 7px;
        z-index: 4;
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--button-bg);
        color: var(--text);
        font-size: 12px;
        font-weight: 950;
        cursor: pointer;
      }

      .rail-toggle:hover {
        border-color: color-mix(in oklab, var(--primary) 54%, transparent);
      }

      .rail-resizer {
        position: absolute;
        top: 0;
        right: -6px;
        bottom: 0;
        z-index: 5;
        width: 12px;
        cursor: col-resize;
      }

      .rail-resizer::after {
        position: absolute;
        top: 12px;
        right: 5px;
        bottom: 12px;
        width: 2px;
        border-radius: 999px;
        background: color-mix(in oklab, var(--primary) 28%, transparent);
        opacity: 0;
        content: "";
        transition: opacity 0.14s ease;
      }

      .rail-resizer:hover::after,
      .rail-resizer.is-dragging::after {
        opacity: 1;
      }

      .rail-collapsed-label {
        display: none;
        align-self: start;
        justify-self: center;
        margin-top: 32px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 950;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        writing-mode: vertical-rl;
        transform: rotate(180deg);
      }

      .app-shell.queue-collapsed .pr-list-panel {
        display: grid;
        place-items: start center;
        gap: 0;
        padding: 7px;
      }

      .app-shell.queue-collapsed .pr-list-panel > :not(.rail-toggle):not(.rail-resizer):not(.rail-collapsed-label) {
        display: none;
      }

      .app-shell.queue-collapsed .rail-toggle {
        right: 7px;
      }

      .app-shell.queue-collapsed .rail-collapsed-label {
        display: block;
      }

      .page-heading,
      .pr-list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }

      .page-heading {
        display: grid;
        align-items: start;
      }

      .page-heading h2 {
        margin: 0;
        font-size: 17px;
        line-height: 1.08;
      }

      .page-heading .muted {
        max-width: none;
        margin: 4px 0 0;
        font-size: 10px;
        line-height: 1.35;
      }

      .pr-list {
        max-height: none;
        min-height: 0;
        overflow: auto;
        padding: 0;
      }

      .queue-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }

      .queue-tab {
        min-height: 24px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: color-mix(in oklab, var(--muted) 10%, transparent);
        color: var(--text-soft);
        font-size: 9px;
        font-weight: 900;
        cursor: pointer;
      }

      .queue-tab.active {
        border-color: color-mix(in oklab, var(--primary) 50%, transparent);
        background: color-mix(in oklab, var(--primary) 13%, transparent);
        color: var(--text);
      }

      .pr-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 40px;
        grid-template-areas:
          "main score"
          "actions actions";
        gap: 4px 5px;
        align-items: start;
        padding: 5px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--card-bg);
        box-shadow: var(--shadow-soft);
      }

      .pr-row-main {
        grid-area: main;
        min-width: 0;
      }

      .pr-row-actions {
        grid-area: actions;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 4px;
        flex-wrap: wrap;
      }

      .pr-title-line {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .pr-title-line h3 {
        margin: 0;
        display: -webkit-box;
        overflow: hidden;
        overflow-wrap: anywhere;
        font-size: 9.5px;
        line-height: 1.18;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .pr-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-top: 4px;
        max-height: 34px;
        overflow: hidden;
      }

      .small-button {
        flex: 0 1 auto;
        min-height: 17px;
        padding: 0 5px;
        border: 1px solid var(--border-strong);
        border-radius: 7px;
        background: var(--button-bg);
        color: var(--text);
        font-size: 7.5px;
        font-weight: 850;
        cursor: pointer;
      }

      .small-button:hover {
        border-color: color-mix(in oklab, var(--primary) 58%, transparent);
      }

      .small-button.primary {
        border-color: color-mix(in oklab, var(--primary) 48%, var(--border));
        background: var(--primary-button-bg);
        color: var(--primary-fg);
      }

      .small-button.success {
        border-color: color-mix(in oklab, var(--green) 46%, var(--border));
        background: color-mix(in oklab, var(--green) 24%, var(--surface));
        color: var(--text);
      }

      .small-button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      .queue-card {
        width: 100%;
        padding: 10px;
        text-align: left;
        cursor: pointer;
        transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      }

      .queue-card:hover,
      .queue-card.selected {
        transform: translateY(-1px);
        border-color: color-mix(in oklab, var(--primary) 48%, transparent);
        background: var(--surface-raised);
      }

      .queue-card.selected {
        box-shadow: 0 0 0 1px color-mix(in oklab, var(--primary) 34%, transparent), var(--shadow);
      }

      .queue-card-top,
      .review-card-top,
      .agent-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 10px;
      }

      .queue-title {
        margin: 0;
        color: var(--text);
        font-size: 11px;
        font-weight: 850;
      }

      .queue-subtitle,
      .muted {
        color: var(--muted);
        font-size: 10px;
      }

      .queue-action {
        display: none;
        margin: 4px 0 0;
        overflow: hidden;
        color: var(--text-soft);
        font-size: 9.5px;
        line-height: 1.3;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 1;
      }

      .score-stack {
        grid-area: score;
        display: grid;
        grid-template-columns: 1fr;
        gap: 4px;
        align-items: start;
        min-width: 40px;
      }

      .score-number {
        font-size: 14px;
        font-weight: 950;
        line-height: 1;
        text-align: right;
      }

      .score-track {
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in oklab, var(--muted) 18%, transparent);
      }

      .score-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--primary), var(--green));
      }

      .score-fill.hot {
        background: linear-gradient(90deg, var(--amber), var(--red));
      }

      .score-fill.mid {
        background: linear-gradient(90deg, var(--primary), var(--amber));
      }

      .detail-pane {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 9px;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
      }

      .detail-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 9px;
        padding: 9px;
      }

      .detail-hero h2 {
        margin: 0;
        font-size: clamp(13px, 1.7vw, 19px);
        line-height: 1.08;
      }

      .detail-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 9px;
      }

      .summary-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin-top: 8px;
      }

      .summary-item {
        min-height: 46px;
        padding: 7px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-muted);
      }

      .summary-item span {
        display: block;
        color: var(--muted);
        font-size: 8.8px;
        font-weight: 850;
        text-transform: uppercase;
      }

      .summary-item strong {
        display: block;
        margin-top: 6px;
        color: var(--text);
        font-size: 11px;
      }

      .agent-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .dashboard-tabs-panel {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        padding: 0;
        overflow: hidden;
        min-height: 0;
      }

      .dashboard-tabs {
        display: flex;
        gap: 5px;
        overflow-x: auto;
        padding: 6px;
        border-bottom: 1px solid var(--border);
        background: var(--tab-bg);
      }

      .dashboard-tab {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 6px;
        min-height: 24px;
        padding: 0 8px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: color-mix(in oklab, var(--muted) 10%, transparent);
        color: var(--text-soft);
        font-size: 9px;
        font-weight: 850;
        cursor: pointer;
      }

      .dashboard-tab:hover {
        border-color: color-mix(in oklab, var(--primary) 36%, transparent);
        color: var(--text);
      }

      .dashboard-tab.active {
        border-color: color-mix(in oklab, var(--primary) 58%, transparent);
        background: color-mix(in oklab, var(--primary) 13%, transparent);
        color: var(--text);
      }

      .dashboard-tab small {
        min-width: 18px;
        padding: 1px 5px;
        border-radius: 999px;
        background: color-mix(in oklab, var(--primary) 16%, transparent);
        color: var(--primary);
        text-align: center;
      }

      .dashboard-tab-body {
        max-height: none;
        min-height: 0;
        height: auto;
        overflow: auto;
        padding: 9px;
      }

      .tab-panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 14px;
      }

      .tab-panel-head h3 {
        margin-bottom: 4px;
      }

      .tab-panel-head p {
        max-width: 760px;
        margin: 0;
      }

      .tab-section {
        display: grid;
        gap: 12px;
      }

      .tab-section + .tab-section {
        margin-top: 16px;
      }

      .overview-check-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .overview-check-card {
        --overview-color: var(--blue);
        --overview-glow: color-mix(in oklab, var(--blue) 14%, transparent);
        --overview-border: color-mix(in oklab, var(--blue) 30%, transparent);
        display: grid;
        justify-items: center;
        align-content: start;
        min-height: 154px;
        padding: 11px 8px;
        border: 1px solid var(--overview-border);
        border-radius: 8px;
        background:
          radial-gradient(circle at 50% -12%, var(--overview-glow), transparent 62%),
          var(--surface-muted);
        text-align: center;
        box-shadow: var(--shadow-soft);
      }

      .overview-check-card.success {
        --overview-color: var(--green);
        --overview-glow: color-mix(in oklab, var(--green) 18%, transparent);
        --overview-border: color-mix(in oklab, var(--green) 38%, transparent);
      }

      .overview-check-card.neutral {
        --overview-color: var(--amber);
        --overview-glow: color-mix(in oklab, var(--amber) 18%, transparent);
        --overview-border: color-mix(in oklab, var(--amber) 38%, transparent);
      }

      .overview-check-card.failure {
        --overview-color: var(--red);
        --overview-glow: color-mix(in oklab, var(--red) 20%, transparent);
        --overview-border: color-mix(in oklab, var(--red) 42%, transparent);
      }

      .overview-status-dial {
        --status-score: 100;
        width: 76px;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background:
          conic-gradient(var(--overview-color) calc(var(--status-score) * 1%), color-mix(in oklab, var(--muted) 18%, transparent) 0),
          radial-gradient(circle at center, var(--surface-inset) 0 58%, transparent 59%);
        box-shadow:
          0 0 28px var(--overview-glow),
          inset 0 0 0 1px color-mix(in oklab, var(--text) 6%, transparent);
      }

      .overview-status-inner {
        display: grid;
        place-items: center;
        width: 52px;
        aspect-ratio: 1;
        border: 1px solid color-mix(in oklab, var(--text) 8%, transparent);
        border-radius: 50%;
        background: var(--ring-inner-bg);
      }

      .overview-status-label {
        color: var(--text);
        font-size: 12px;
        font-weight: 950;
        line-height: 1;
        text-transform: uppercase;
      }

      .overview-status-caption {
        margin-top: 4px;
        color: var(--muted);
        font-size: 9px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .overview-check-card h4 {
        width: 100%;
        margin: 8px 0 0;
        overflow-wrap: anywhere;
        color: var(--text);
        font-size: 11px;
        line-height: 1.24;
      }

      .overview-check-card p {
        display: -webkit-box;
        width: 100%;
        margin: 6px 0 0;
        overflow: hidden;
        color: var(--text-soft);
        font-size: 10px;
        line-height: 1.36;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
      }

      .agent-workflow-panel {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 7px;
        min-width: 0;
        min-height: 0;
        height: 100%;
        overflow: hidden;
        padding: 9px;
      }

      .workflow-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 9px;
        flex-wrap: wrap;
      }

      .delay-control {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: min(272px, 100%);
        color: var(--text-soft);
        font-size: 9.5px;
        font-weight: 800;
      }

      .delay-control input {
        width: min(176px, 32vw);
        accent-color: var(--primary);
      }

      .agent-flow-shell {
        display: grid;
        grid-template-rows: minmax(0, 1fr);
        gap: 0;
        min-height: 0;
        overflow: hidden;
      }

      .agent-flow-canvas {
        position: relative;
        min-height: 0;
        overflow: auto;
        padding: 8px;
        border: 1px dashed color-mix(in oklab, var(--muted) 28%, transparent);
        border-radius: 8px;
        background:
          radial-gradient(circle, var(--mg-pipeline-dot) 1px, transparent 1px),
          var(--mg-pipeline-canvas-bg);
        background-size: 19px 19px, 100% 100%;
      }

      .pipeline-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 7px;
      }

      .pipeline-eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 9.5px;
        font-weight: 950;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .pipeline-note {
        margin: 4px 0 0;
        color: var(--text-soft);
        font-size: 9.5px;
        line-height: 1.32;
      }

      .pipeline-stats {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }

      .pipeline-stat {
        display: inline-flex;
        align-items: center;
        min-height: 19px;
        padding: 1px 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in oklab, var(--muted) 10%, transparent);
        color: var(--text-soft);
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .pipeline-stat.running {
        border-color: color-mix(in oklab, var(--primary) 42%, transparent);
        background: color-mix(in oklab, var(--primary) 12%, transparent);
        color: var(--primary);
      }

      .pipeline-stat.done {
        border-color: color-mix(in oklab, var(--green) 40%, transparent);
        background: color-mix(in oklab, var(--green) 12%, transparent);
        color: var(--green);
      }

      .pipeline-stat.failed {
        border-color: color-mix(in oklab, var(--red) 42%, transparent);
        background: color-mix(in oklab, var(--red) 13%, transparent);
        color: var(--red);
      }

      .pipeline-board {
        position: relative;
        isolation: isolate;
        width: 100%;
        min-width: 0;
        padding: 22px 12px 12px;
      }

      .pipeline-link-layer {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .pipeline-link {
        fill: none;
        stroke: color-mix(in oklab, var(--muted) 58%, transparent);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 7 9;
        opacity: 0.74;
        vector-effect: non-scaling-stroke;
      }

      .pipeline-link.completed {
        stroke: color-mix(in oklab, var(--green) 86%, transparent);
        stroke-dasharray: 0;
      }

      .pipeline-link.failed {
        stroke: color-mix(in oklab, var(--red) 88%, transparent);
        stroke-dasharray: 0;
      }

      .pipeline-link.active {
        stroke: color-mix(in oklab, var(--primary) 92%, transparent);
        animation: flowDash 0.9s linear infinite;
      }

      .pipeline-link.disabled,
      .pipeline-link.skipped {
        stroke: color-mix(in oklab, var(--muted) 20%, transparent);
        opacity: 0.52;
      }

      .pipeline-link-terminal {
        fill: color-mix(in oklab, var(--muted) 56%, transparent);
      }

      .pipeline-link-terminal.completed {
        fill: color-mix(in oklab, var(--green) 82%, transparent);
      }

      .pipeline-link-terminal.failed {
        fill: color-mix(in oklab, var(--red) 88%, transparent);
      }

      .pipeline-link-terminal.active {
        fill: color-mix(in oklab, var(--primary) 95%, transparent);
      }

      .pipeline-link-terminal.disabled,
      .pipeline-link-terminal.skipped {
        fill: color-mix(in oklab, var(--muted) 24%, transparent);
      }

      @keyframes flowDash {
        to {
          stroke-dashoffset: -32;
        }
      }

      .pipeline-stages {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: minmax(58px, 0.78fr) minmax(82px, 1fr) minmax(64px, 0.82fr) minmax(82px, 0.96fr) minmax(58px, 0.74fr) minmax(62px, 0.8fr);
        gap: clamp(24px, 3vw, 86px);
        align-items: center;
        min-height: 320px;
      }

      .pipeline-stage {
        position: relative;
        z-index: 5;
        isolation: isolate;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 6px;
        min-width: 0;
      }

      .pipeline-stage-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 6px;
        width: min(100%, clamp(70px, 6vw, 126px));
        padding-inline: 3px;
      }

      .pipeline-stage-kicker {
        display: block;
        color: var(--muted);
        font-size: 7px;
        font-weight: 950;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .pipeline-stage-title {
        display: block;
        margin-top: 2px;
        color: var(--text);
        font-size: 9.5px;
        font-weight: 950;
      }

      .pipeline-stage-count {
        color: var(--text-soft);
        font-size: 8px;
        font-weight: 850;
        white-space: nowrap;
      }

      .pipeline-stage-list {
        display: grid;
        gap: 22px;
        width: min(100%, clamp(70px, 6vw, 122px));
      }

      .pipeline-stage-intake .pipeline-stage-head,
      .pipeline-stage-intake .pipeline-stage-list {
        width: min(100%, clamp(60px, 4.6vw, 92px));
      }

      .pipeline-stage-intake .pipeline-stage-list,
      .pipeline-stage-guardrails .pipeline-stage-list {
        gap: 24px;
      }

      .pipeline-stage-impact .pipeline-stage-list {
        gap: 22px;
      }

      .pipeline-stage-coverage .pipeline-stage-head,
      .pipeline-stage-coverage .pipeline-stage-list,
      .pipeline-stage-memory .pipeline-stage-head,
      .pipeline-stage-memory .pipeline-stage-list,
      .pipeline-stage-decision .pipeline-stage-head,
      .pipeline-stage-decision .pipeline-stage-list {
        width: min(100%, clamp(66px, 5.2vw, 108px));
      }

      .pipeline-card {
        position: relative;
        z-index: 5;
        isolation: isolate;
        --card-fill: color-mix(in oklab, var(--thread-color, var(--primary)) 42%, var(--mg-pipeline-card-bg));
        display: grid;
        gap: 4px;
        min-width: 0;
        min-height: 42px;
        padding: 4px;
        border: 1.5px solid var(--mg-pipeline-card-border);
        border-left: 4px solid var(--mg-pipeline-card-border-left);
        border-radius: 7px;
        background:
          radial-gradient(circle at 18% 10%, color-mix(in oklab, var(--thread-color, var(--primary)) 42%, transparent), transparent 52%),
          linear-gradient(135deg, color-mix(in oklab, #ffffff 12%, var(--card-fill)), color-mix(in oklab, #02070d 4%, var(--card-fill))),
          var(--mg-pipeline-card-bg);
        box-shadow:
          inset 0 0 0 1px color-mix(in oklab, #ffffff 11%, transparent),
          0 0 0 1px color-mix(in oklab, var(--mg-pipeline-card-border) 28%, transparent),
          var(--mg-pipeline-card-shadow);
        transition: border-color 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease, opacity 0.16s ease;
      }

      .pipeline-card::before {
        position: absolute;
        inset: -5px;
        z-index: -1;
        border-radius: 10px;
        background: var(--surface-inset);
        content: "";
      }

      .pipeline-card::after {
        position: absolute;
        inset: 0;
        z-index: 4;
        border: 2px solid var(--mg-pipeline-card-border);
        border-left-width: 5px;
        border-left-color: var(--mg-pipeline-card-border-left);
        border-radius: inherit;
        box-shadow:
          inset 0 0 0 1px color-mix(in oklab, var(--mg-pipeline-card-border) 22%, transparent),
          0 0 0 1px color-mix(in oklab, var(--mg-pipeline-card-border-left) 28%, transparent);
        content: "";
        pointer-events: none;
      }

      .pipeline-card.completed {
        --card-fill: color-mix(in oklab, var(--green) 42%, var(--mg-pipeline-card-bg));
        border-color: var(--mg-pipeline-card-border);
        border-left-color: var(--mg-pipeline-card-border-left);
        background:
          radial-gradient(circle at 18% 10%, color-mix(in oklab, var(--green) 38%, transparent), transparent 52%),
          linear-gradient(135deg, color-mix(in oklab, #ffffff 10%, var(--card-fill)), color-mix(in oklab, var(--green) 12%, var(--card-fill))),
          var(--mg-pipeline-card-bg);
        box-shadow:
          inset 0 0 0 1px color-mix(in oklab, #ffffff 7%, transparent),
          0 0 0 1px color-mix(in oklab, var(--mg-pipeline-card-border) 30%, transparent),
          var(--mg-pipeline-card-shadow);
      }

      .pipeline-card.failed {
        --card-fill: color-mix(in oklab, var(--red) 42%, var(--mg-pipeline-card-bg));
        border-color: var(--mg-pipeline-card-border);
        border-left-color: var(--mg-pipeline-card-border-left);
        background:
          radial-gradient(circle at 18% 10%, color-mix(in oklab, var(--red) 38%, transparent), transparent 52%),
          linear-gradient(135deg, color-mix(in oklab, #ffffff 10%, var(--card-fill)), color-mix(in oklab, var(--red) 12%, var(--card-fill))),
          var(--mg-pipeline-card-bg);
        box-shadow:
          inset 0 0 0 1px color-mix(in oklab, #ffffff 7%, transparent),
          0 0 0 1px color-mix(in oklab, var(--mg-pipeline-card-border) 30%, transparent),
          var(--mg-pipeline-card-shadow);
      }

      .pipeline-card.active {
        border-color: var(--mg-pipeline-card-border);
        border-left-color: var(--mg-pipeline-card-border-left);
        box-shadow:
          0 0 0 2px color-mix(in oklab, var(--mg-pipeline-card-border-left) 18%, transparent),
          var(--mg-pipeline-card-shadow);
        transform: translateY(-1px);
      }

      .pipeline-card.selected {
        outline: 1px solid color-mix(in oklab, var(--primary) 56%, transparent);
        outline-offset: 2px;
      }

      .pipeline-card.disabled,
      .pipeline-card.skipped {
        opacity: 0.56;
      }

      .pipeline-card-main {
        position: relative;
        z-index: 5;
        display: grid;
        grid-template-columns: 17px minmax(0, 1fr);
        gap: 4px;
        align-items: center;
        width: 100%;
        min-width: 0;
        padding: 0;
        border: 0;
        background: transparent;
        color: inherit;
        cursor: pointer;
        text-align: left;
      }

      .pipeline-card-main:focus-visible {
        outline: 2px solid color-mix(in oklab, var(--primary) 76%, transparent);
        outline-offset: 4px;
      }

      .pipeline-card-copy {
        display: grid;
        min-width: 0;
        gap: 1px;
      }

      .pipeline-card-stage {
        display: none;
        color: var(--muted);
        font-size: 6.4px;
        font-weight: 950;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .pipeline-card-title {
        overflow-wrap: normal;
        word-break: normal;
        color: var(--text);
        font-size: 7px;
        font-weight: 950;
        line-height: 1.12;
      }

      .pipeline-progress {
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in oklab, var(--muted) 18%, transparent);
      }

      .pipeline-progress span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: color-mix(in oklab, var(--muted) 46%, transparent);
        transform: translateX(-110%);
      }

      .pipeline-card.completed .pipeline-progress span {
        width: 100%;
        background: color-mix(in oklab, var(--green) 78%, transparent);
        transform: translateX(0);
      }

      .pipeline-card.failed .pipeline-progress span {
        width: 100%;
        background: color-mix(in oklab, var(--red) 82%, transparent);
        transform: translateX(0);
      }

      .pipeline-card.active .pipeline-progress span {
        background: color-mix(in oklab, var(--primary) 90%, transparent);
        animation: pipelinePulse 1.2s ease-in-out infinite;
      }

      @keyframes pipelinePulse {
        0% {
          transform: translateX(-105%);
        }

        100% {
          transform: translateX(245%);
        }
      }

      .pipeline-card-footer {
        position: relative;
        z-index: 5;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 2px;
        min-width: 0;
      }

      .pipeline-card .pill {
        min-height: 13px;
        padding: 1px 3px;
        font-size: 6px;
      }

      .agent-icon {
        display: grid;
        place-items: center;
        width: 17px;
        height: 17px;
        border-radius: 5px;
        background: color-mix(in oklab, var(--primary) 13%, transparent);
        color: var(--primary);
        font-size: 6px;
        font-weight: 950;
      }

      .agent-icon.intent {
        background: color-mix(in oklab, var(--indigo) 16%, transparent);
        color: var(--indigo);
      }

      .agent-icon.behavior {
        background: color-mix(in oklab, var(--amber) 16%, transparent);
        color: var(--amber);
      }

      .agent-icon.concepts {
        background: color-mix(in oklab, var(--violet) 17%, transparent);
        color: var(--violet);
      }

      .agent-icon.slop {
        background: color-mix(in oklab, var(--amber) 18%, transparent);
        color: var(--amber);
      }

      .agent-icon.policy {
        background: color-mix(in oklab, var(--red) 16%, transparent);
        color: var(--red);
      }

      .agent-icon.prompt {
        background: color-mix(in oklab, var(--blue) 16%, transparent);
        color: var(--blue);
      }

      .agent-icon.contracts {
        background: color-mix(in oklab, var(--green) 15%, transparent);
        color: var(--green);
      }

      .agent-icon.evidence {
        background: color-mix(in oklab, var(--green) 16%, transparent);
        color: var(--green);
      }

      .agent-icon.memory {
        background: color-mix(in oklab, var(--green) 18%, transparent);
        color: var(--green);
      }

      .agent-icon.tests {
        background: color-mix(in oklab, var(--green) 18%, transparent);
        color: var(--green);
      }

      .agent-icon.report {
        background: color-mix(in oklab, var(--red) 16%, transparent);
        color: var(--red);
      }

      .flow-caption {
        display: grid;
        justify-items: center;
        gap: 3px;
        min-width: 0;
        text-align: center;
      }

      .flow-stage {
        color: var(--muted);
        font-size: 8px;
        font-weight: 900;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .flow-label {
        min-height: 0;
        color: var(--text);
        font-size: 9.5px;
        font-weight: 900;
        line-height: 1.15;
      }

      .flow-description {
        display: none;
      }

      .flow-status {
        display: flex;
        justify-content: center;
      }

      .flow-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-top: 1px;
      }

      /* ---------- Cinematic + Subway pipeline upgrades ---------- */

      .pipeline-scoreboard {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        margin: 6px 0 10px;
        padding: 7px 10px;
        border: 1px solid color-mix(in oklab, var(--muted) 22%, transparent);
        border-radius: 8px;
        background:
          linear-gradient(180deg, color-mix(in oklab, var(--surface-strong) 96%, transparent), color-mix(in oklab, var(--surface-inset) 96%, transparent));
      }

      .pipeline-scoreboard-track {
        position: relative;
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 1fr;
        gap: 4px;
        min-width: 0;
        height: 22px;
      }

      .pipeline-score-segment {
        position: relative;
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 2px;
        min-width: 0;
      }

      .pipeline-score-bar {
        position: relative;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in oklab, var(--muted) 16%, transparent);
      }

      .pipeline-score-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: linear-gradient(90deg,
          color-mix(in oklab, var(--primary) 92%, transparent),
          color-mix(in oklab, var(--green) 86%, transparent));
        transform-origin: left center;
        transform: scaleX(var(--score, 0));
        transition: transform 0.4s ease;
      }

      .pipeline-score-segment.active .pipeline-score-bar::after {
        background: linear-gradient(90deg,
          color-mix(in oklab, var(--primary) 92%, transparent),
          color-mix(in oklab, var(--primary) 60%, var(--blue) 40%));
        animation: scoreShimmer 1.4s ease-in-out infinite;
      }

      .pipeline-score-segment.failed .pipeline-score-bar::after {
        background: linear-gradient(90deg,
          color-mix(in oklab, var(--red) 88%, transparent),
          color-mix(in oklab, var(--red) 70%, var(--amber) 30%));
      }

      @keyframes scoreShimmer {
        0%, 100% { opacity: 0.78; }
        50% { opacity: 1; }
      }

      .pipeline-score-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        color: var(--text-soft);
        font-size: 8.5px;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .pipeline-score-segment.active .pipeline-score-label {
        color: var(--primary);
      }

      .pipeline-score-segment.done .pipeline-score-label {
        color: var(--green);
      }

      .pipeline-score-count {
        color: var(--muted);
        font-size: 8.5px;
        font-weight: 950;
        letter-spacing: 0.02em;
      }

      .pipeline-scoreboard-meta {
        display: grid;
        justify-items: end;
        gap: 2px;
        white-space: nowrap;
      }

      .pipeline-scoreboard-headline {
        color: var(--text);
        font-size: 12px;
        font-weight: 950;
        letter-spacing: 0.02em;
      }

      .pipeline-scoreboard-sub {
        color: var(--muted);
        font-size: 9px;
        font-weight: 850;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .pipeline-replay-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: 8px;
        padding: 4px 9px;
        border: 1px solid color-mix(in oklab, var(--primary) 46%, transparent);
        border-radius: 999px;
        background: color-mix(in oklab, var(--primary) 14%, transparent);
        color: var(--primary);
        font-size: 9px;
        font-weight: 950;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.16s ease, border-color 0.16s ease, transform 0.12s ease;
      }

      .pipeline-replay-button:hover:not([disabled]) {
        background: color-mix(in oklab, var(--primary) 24%, transparent);
        transform: translateY(-1px);
      }

      .pipeline-replay-button[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .pipeline-replay-button::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: currentColor;
        box-shadow: 0 0 8px currentColor;
      }

      .pipeline-thread-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin: 0 0 8px;
        padding: 6px 8px;
        border: 1px dashed color-mix(in oklab, var(--muted) 24%, transparent);
        border-radius: 8px;
        background: color-mix(in oklab, var(--surface-inset) 60%, transparent);
      }

      .pipeline-thread-legend-label {
        color: var(--muted);
        font-size: 8.5px;
        font-weight: 950;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        margin-right: 2px;
      }

      .pipeline-thread-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        min-height: 18px;
        padding: 2px 7px 2px 5px;
        border: 1px solid color-mix(in oklab, var(--muted) 28%, transparent);
        border-radius: 999px;
        background: color-mix(in oklab, var(--surface-strong) 80%, transparent);
        color: var(--text-soft);
        font-size: 8.5px;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
        transition: border-color 0.16s ease, background 0.16s ease, color 0.16s ease, transform 0.12s ease;
      }

      .pipeline-thread-chip:hover {
        transform: translateY(-1px);
        color: var(--text);
      }

      .pipeline-thread-chip[aria-pressed="true"] {
        border-color: color-mix(in oklab, var(--thread-color, var(--primary)) 72%, transparent);
        background: color-mix(in oklab, var(--thread-color, var(--primary)) 18%, var(--surface-strong));
        color: var(--text);
        box-shadow: 0 0 0 1px color-mix(in oklab, var(--thread-color, var(--primary)) 30%, transparent);
      }

      .pipeline-thread-swatch {
        position: relative;
        width: 18px;
        height: 4px;
        border-radius: 999px;
        background: var(--thread-color, var(--primary));
        box-shadow: 0 0 8px color-mix(in oklab, var(--thread-color, var(--primary)) 55%, transparent);
      }

      .pipeline-thread-swatch::after {
        content: "";
        position: absolute;
        top: 50%;
        right: -2px;
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: var(--thread-color, var(--primary));
        transform: translateY(-50%);
        box-shadow: 0 0 6px color-mix(in oklab, var(--thread-color, var(--primary)) 65%, transparent);
      }

      .pipeline-thread-clear {
        margin-left: auto;
        padding: 2px 7px;
        border: 1px solid color-mix(in oklab, var(--muted) 32%, transparent);
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 8.5px;
        font-weight: 900;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .pipeline-thread-clear:hover {
        color: var(--text);
        border-color: color-mix(in oklab, var(--muted) 50%, transparent);
      }

      /* Link recoloring per source tone (Subway threads) */
      .pipeline-link {
        stroke: var(--thread-color, color-mix(in oklab, var(--muted) 58%, transparent));
        opacity: 0.55;
      }

      .pipeline-link.ready {
        stroke-dasharray: 5 7;
        opacity: 0.42;
      }

      .pipeline-link.completed,
      .pipeline-link.active {
        stroke: var(--thread-color, color-mix(in oklab, var(--primary) 90%, transparent));
        opacity: 0.95;
        stroke-dasharray: 0;
        filter: drop-shadow(0 0 4px color-mix(in oklab, var(--thread-color, var(--primary)) 55%, transparent));
      }

      .pipeline-link.active {
        animation: flowDash 0.9s linear infinite;
        stroke-dasharray: 10 6;
      }

      .pipeline-link.failed {
        stroke: color-mix(in oklab, var(--red) 92%, transparent);
        filter: drop-shadow(0 0 6px color-mix(in oklab, var(--red) 60%, transparent));
      }

      .pipeline-link-terminal {
        fill: var(--thread-color, color-mix(in oklab, var(--muted) 56%, transparent));
      }

      .pipeline-link-terminal.completed,
      .pipeline-link-terminal.active {
        fill: var(--thread-color, color-mix(in oklab, var(--primary) 90%, transparent));
        filter: drop-shadow(0 0 4px color-mix(in oklab, var(--thread-color, var(--primary)) 60%, transparent));
      }

      .pipeline-link-terminal.failed {
        fill: color-mix(in oklab, var(--red) 92%, transparent);
      }

      /* Animated data packets traveling along links */
      .pipeline-link-packet {
        fill: var(--thread-color, var(--primary));
        filter: drop-shadow(0 0 6px color-mix(in oklab, var(--thread-color, var(--primary)) 75%, transparent));
        opacity: 0.95;
      }

      .pipeline-link-packet-halo {
        fill: var(--thread-color, var(--primary));
        opacity: 0.2;
      }

      /* Spotlight + isolation dimming */
      .pipeline-stages.is-spotlit .pipeline-card:not(.lit) {
        opacity: 0.32;
        filter: saturate(0.4);
      }

      .pipeline-stages.is-spotlit .pipeline-card.lit {
        border-color: color-mix(in oklab, var(--thread-color, var(--primary)) 62%, transparent);
        box-shadow:
          0 0 0 1px color-mix(in oklab, var(--thread-color, var(--primary)) 30%, transparent),
          0 6px 18px color-mix(in oklab, var(--thread-color, var(--primary)) 22%, transparent);
      }

      .pipeline-link.dim,
      .pipeline-link-terminal.dim,
      .pipeline-link-packet.dim,
      .pipeline-link-packet-halo.dim {
        opacity: 0.08 !important;
        filter: none !important;
        animation: none !important;
      }

      .pipeline-card.lit .pipeline-card-title {
        color: var(--text);
      }

      .pipeline-card.active {
        animation: cardPulse 1.6s ease-in-out infinite;
      }

      /* Light-mode wire + packet readability:
         drop-shadow glows are mostly invisible on cream backgrounds, so we
         swap to higher opacity strokes and a white-bordered packet that pops
         on any background like a subway train. */
      [data-theme="light"] .pipeline-link {
        opacity: 0.78;
        stroke-width: 2.4;
      }

      [data-theme="light"] .pipeline-link.ready {
        opacity: 0.6;
      }

      [data-theme="light"] .pipeline-link.completed,
      [data-theme="light"] .pipeline-link.active {
        opacity: 1;
        stroke-width: 2.6;
        filter: none;
      }

      [data-theme="light"] .pipeline-link.failed {
        filter: none;
      }

      [data-theme="light"] .pipeline-link-terminal,
      [data-theme="light"] .pipeline-link-terminal.completed,
      [data-theme="light"] .pipeline-link-terminal.active,
      [data-theme="light"] .pipeline-link-terminal.failed {
        filter: none;
        stroke: rgba(255, 255, 255, 0.85);
        stroke-width: 1;
      }

      [data-theme="light"] .pipeline-link-packet {
        stroke: #ffffff;
        stroke-width: 1.4;
        paint-order: stroke fill;
        filter: drop-shadow(0 1px 2px rgba(33, 39, 60, 0.35));
      }

      [data-theme="light"] .pipeline-link-packet-halo {
        opacity: 0.42;
        filter: none;
      }

      /* Spotlight ring tweaks per theme so the lit card actually stands out. */
      [data-theme="light"] .pipeline-stages.is-spotlit .pipeline-card:not(.lit) {
        opacity: 0.42;
      }

      @keyframes cardPulse {
        0%, 100% {
          box-shadow:
            inset 0 0 0 1px color-mix(in oklab, #ffffff 11%, transparent),
            0 0 0 1px color-mix(in oklab, var(--mg-pipeline-card-border) 28%, transparent),
            0 0 0 2px color-mix(in oklab, var(--mg-pipeline-card-border-left) 14%, transparent),
            var(--mg-pipeline-card-shadow);
        }
        50% {
          box-shadow:
            inset 0 0 0 1px color-mix(in oklab, #ffffff 12%, transparent),
            0 0 0 1px color-mix(in oklab, var(--mg-pipeline-card-border) 38%, transparent),
            0 0 0 3px color-mix(in oklab, var(--mg-pipeline-card-border-left) 28%, transparent),
            0 0 18px color-mix(in oklab, var(--mg-pipeline-card-border-left) 24%, transparent),
            var(--mg-pipeline-card-shadow);
        }
      }

      .agent-output {
        min-height: 0;
        max-height: none;
        overflow: auto;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface-muted);
      }

      .agent-output-dialog,
      .code-dialog {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: grid;
        place-items: center;
        padding: 18px;
        background: color-mix(in oklab, var(--bg) 76%, transparent);
        backdrop-filter: blur(14px);
      }

      .agent-output-popover,
      .code-popover {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr);
        gap: 8px;
        width: min(760px, calc(100vw - 32px));
        max-height: min(76vh, 680px);
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
        box-shadow: 0 28px 80px color-mix(in oklab, #000 48%, transparent);
      }

      .code-popover {
        width: min(980px, calc(100vw - 32px));
        max-height: min(82vh, 760px);
      }

      .agent-output-popover .agent-output {
        max-height: min(64vh, 600px);
      }

      .agent-output-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 2px 0 4px;
      }

      .agent-output-close {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--button-bg);
        color: var(--text);
        font-size: 11px;
        font-weight: 950;
        cursor: pointer;
      }

      .agent-output-close:hover {
        border-color: color-mix(in oklab, var(--red) 54%, transparent);
        color: var(--red);
      }

      .code-dialog-body {
        display: grid;
        grid-template-columns: minmax(190px, 0.36fr) minmax(0, 1fr);
        gap: 10px;
        min-height: 0;
      }

      .code-context-card,
      .code-viewer {
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface-muted);
      }

      .code-context-card {
        display: grid;
        align-content: start;
        gap: 9px;
        min-width: 0;
        padding: 10px;
      }

      .code-context-card h4 {
        margin: 0;
        overflow-wrap: anywhere;
        font-size: 12px;
        line-height: 1.2;
      }

      .code-context-card p {
        margin: 0;
        color: var(--text-soft);
        font-size: 9.5px;
        line-height: 1.35;
      }

      .code-context-list {
        display: grid;
        gap: 5px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .code-context-list li {
        color: var(--text-soft);
        font-size: 9px;
        line-height: 1.3;
      }

      .code-viewer {
        min-height: 360px;
        max-height: min(68vh, 640px);
        margin: 0;
        overflow: auto;
        padding: 9px 0;
        background: var(--code-bg);
        color: var(--text-soft);
        font-size: 10px;
        line-height: 1.45;
        white-space: pre;
      }

      .code-line {
        display: block;
        min-height: 1.45em;
        padding: 0 12px;
        border-left: 3px solid transparent;
      }

      .code-line.add {
        border-color: var(--green);
        background: color-mix(in oklab, var(--green) 14%, transparent);
        color: color-mix(in oklab, var(--green) 78%, var(--text));
      }

      .code-line.del {
        border-color: var(--red);
        background: color-mix(in oklab, var(--red) 14%, transparent);
        color: color-mix(in oklab, var(--red) 78%, var(--text));
      }

      .code-line.hunk,
      .code-line.meta {
        color: var(--primary);
        font-weight: 900;
      }

      .agent-output-layout {
        display: grid;
        grid-template-columns: minmax(152px, 0.32fr) minmax(0, 1fr);
        gap: 8px;
      }

      .agent-output-summary {
        display: grid;
        align-content: start;
        gap: 6px;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: var(--surface-raised);
      }

      .agent-output-summary h4 {
        margin: 0;
        font-size: 12px;
      }

      .agent-output-summary p {
        margin: 0;
        color: var(--text-soft);
        font-size: 9.5px;
      }

      .agent-output-json {
        min-width: 0;
      }

      .switch {
        position: relative;
        display: inline-flex;
        align-items: center;
        width: 27px;
        height: 15px;
      }

      .switch input {
        position: absolute;
        opacity: 0;
      }

      .switch span {
        width: 27px;
        height: 15px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in oklab, var(--muted) 16%, transparent);
        cursor: pointer;
        transition: background 0.16s ease, border-color 0.16s ease;
      }

      .switch span::after {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        content: "";
        background: var(--muted);
        transition: transform 0.16s ease, background 0.16s ease;
      }

      .switch input:checked + span {
        border-color: color-mix(in oklab, var(--green) 42%, transparent);
        background: color-mix(in oklab, var(--green) 18%, transparent);
      }

      .switch input:checked + span::after {
        transform: translateX(12px);
        background: var(--green);
      }

      .agent-output h4 {
        margin: 0 0 6px;
        font-size: 13px;
      }

      .agent-output pre {
        margin: 0;
        padding: 8px;
        border: 1px solid color-mix(in oklab, var(--muted) 18%, transparent);
        border-radius: 7px;
        background: var(--code-bg);
        color: var(--text);
        font-size: 8.8px;
        white-space: pre-wrap;
