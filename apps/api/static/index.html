        gap: 7px;
        padding: 9px;
        border: 1px dashed color-mix(in oklab, var(--primary) 34%, var(--border));
        border-radius: 8px;
        background: color-mix(in oklab, var(--primary) 8%, var(--surface-muted));
      }

      .coverage-sun-view {
        display: grid;
        gap: 10px;
      }

      .coverage-sun-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
      }

      .coverage-sun-head h4,
      .behavior-radar-head h4 {
        margin: 0;
        color: var(--text);
        font-size: 18px;
        line-height: 1.08;
      }

      .coverage-sun-head p,
      .behavior-radar-head p {
        max-width: 920px;
        margin: 6px 0 0;
        color: var(--text-soft);
        font-size: 10px;
        line-height: 1.35;
      }

      .coverage-sun-badges,
      .behavior-radar-badges {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
      }

      .coverage-sun-layout {
        display: grid;
        grid-template-columns: minmax(360px, 0.66fr) minmax(260px, 0.34fr);
        gap: 14px;
        min-height: 420px;
      }

      .coverage-sun-card,
      .coverage-req-list,
      .behavior-radar-stage,
      .behavior-delta-stack {
        border: 1px solid var(--border);
        border-radius: 8px;
        background:
          linear-gradient(135deg, color-mix(in oklab, var(--primary) 5%, transparent), transparent 54%),
          var(--surface-muted);
      }

      .coverage-sun-card {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 410px;
        padding: 12px;
      }

      .coverage-sun {
        position: relative;
        display: grid;
        place-items: center;
        width: min(390px, 90%);
        aspect-ratio: 1;
        border-radius: 50%;
        background:
          radial-gradient(circle at center, var(--surface-inset) 0 34%, transparent 35%),
          var(--coverage-sun);
        box-shadow: 0 0 0 1px color-mix(in oklab, var(--muted) 20%, transparent), inset 0 0 0 10px color-mix(in oklab, var(--surface-inset) 52%, transparent);
      }

      .coverage-sun-center {
        display: grid;
        place-items: center;
        width: 30%;
        aspect-ratio: 1;
        border-radius: 50%;
        background: var(--surface-inset);
        box-shadow: 0 0 0 1px color-mix(in oklab, var(--muted) 26%, transparent);
        text-align: center;
      }

      .coverage-sun-center strong {
        display: block;
        color: var(--text);
        font-size: 25px;
        line-height: 1;
      }

      .coverage-sun-center span {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 7px;
        font-weight: 950;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .coverage-sun-label {
        position: absolute;
        left: calc(50% + var(--lx));
        top: calc(50% + var(--ly));
        display: grid;
        gap: 1px;
        transform: translate(-50%, -50%);
        color: var(--label-color, var(--text-soft));
        font-size: 8px;
        font-weight: 950;
        line-height: 1.1;
        text-align: center;
        text-shadow: 0 1px 8px var(--surface-inset);
      }

      .coverage-sun-label small {
        color: var(--text-soft);
        font-size: 7px;
      }

      .coverage-req-list {
        display: grid;
        align-content: start;
        gap: 6px;
        padding: 8px;
      }

      .coverage-req-row {
        --req-color: var(--amber);
        display: grid;
        gap: 5px;
        padding: 7px;
        border: 1px solid color-mix(in oklab, var(--req-color) 32%, var(--border));
        border-left: 3px solid var(--req-color);
        border-radius: 8px;
        background: color-mix(in oklab, var(--req-color) 7%, var(--surface-raised));
      }

      .coverage-req-row.missing,
      .coverage-req-row.block {
        --req-color: var(--red);
      }

      .coverage-req-row.covered,
      .coverage-req-row.success {
        --req-color: var(--green);
      }

      .coverage-req-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .coverage-req-row h5 {
        margin: 0;
        overflow-wrap: anywhere;
        color: var(--text);
        font-size: 8.7px;
        line-height: 1.2;
      }

      .coverage-req-bar {
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in oklab, var(--muted) 16%, transparent);
      }

      .coverage-req-bar span {
        display: block;
        width: calc(var(--coverage, 0) * 1%);
        height: 100%;
        border-radius: inherit;
        background: var(--req-color);
      }

      .coverage-req-row p {
        margin: 0;
        color: var(--text-soft);
        font-size: 7.8px;
        line-height: 1.3;
      }

      .coverage-critical {
        padding: 9px;
        border: 1px solid color-mix(in oklab, var(--red) 30%, var(--border));
        border-radius: 8px;
        background: color-mix(in oklab, var(--red) 8%, var(--surface-muted));
      }

      .coverage-critical span {
        display: block;
        color: var(--red);
        font-size: 8px;
        font-weight: 950;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .coverage-critical strong {
        display: block;
        margin-top: 4px;
        color: var(--text);
        font-size: 10px;
        line-height: 1.25;
      }

      .behavior-radar {
        display: grid;
        gap: 10px;
      }

      .behavior-radar-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: start;
      }

      .behavior-radar-layout {
        display: grid;
        grid-template-columns: minmax(440px, 0.68fr) minmax(240px, 0.32fr);
        gap: 14px;
        min-height: 520px;
      }

      .behavior-radar-stage {
        position: relative;
        min-height: 520px;
        overflow: hidden;
      }

      .behavior-radar-ring {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        border: 1px dashed color-mix(in oklab, var(--ring-color, var(--primary)) 32%, transparent);
        border-radius: 50%;
        pointer-events: none;
      }

      .behavior-radar-ring.one {
        --ring-color: var(--red);
        width: min(42%, 268px);
        aspect-ratio: 1;
      }

      .behavior-radar-ring.two {
        --ring-color: var(--amber);
        width: min(66%, 420px);
        aspect-ratio: 1;
      }

      .behavior-radar-ring.three {
        --ring-color: var(--primary);
        width: min(88%, 540px);
        aspect-ratio: 1;
      }

      .behavior-epicenter {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 138px;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 2px solid color-mix(in oklab, var(--red) 70%, transparent);
        border-radius: 50%;
        background: var(--surface-inset);
        color: var(--text);
        text-align: center;
        box-shadow: 0 0 30px color-mix(in oklab, var(--red) 18%, transparent);
      }

      .behavior-epicenter span {
        display: block;
        color: var(--red);
        font-size: 7px;
        font-weight: 950;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .behavior-epicenter strong {
        display: block;
        margin-top: 4px;
        max-width: 96px;
        overflow-wrap: anywhere;
        font-size: 9px;
        line-height: 1.15;
      }

      .behavior-radar-node {
        --node-color: var(--amber);
        position: absolute;
        left: calc(50% + var(--x));
        top: calc(50% + var(--y));
        z-index: 4;
        display: grid;
        place-items: center;
        width: var(--size, 46px);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 2px solid var(--node-color);
        border-radius: 50%;
        background:
          radial-gradient(circle at center, var(--surface-inset) 0 60%, transparent 61%),
          conic-gradient(var(--node-color) calc(var(--magnitude, 0) * 1%), color-mix(in oklab, var(--muted) 18%, transparent) 0);
        color: var(--text);
        font-size: 8px;
        font-weight: 950;
        box-shadow: 0 0 20px color-mix(in oklab, var(--node-color) 16%, transparent);
      }

      .behavior-radar-node.high {
        --node-color: var(--red);
      }

      .behavior-radar-node.low {
        --node-color: var(--green);
      }

      .behavior-radar-label {
        position: absolute;
        top: calc(100% + 4px);
        left: 50%;
        width: 108px;
        transform: translateX(-50%);
        color: var(--text-soft);
        font-size: 7.6px;
        line-height: 1.12;
        text-align: center;
      }

      .behavior-delta-stack {
        display: grid;
        align-content: start;
        gap: 6px;
        padding: 8px;
      }

      .behavior-delta-card {
        --delta-color: var(--amber);
        display: grid;
        gap: 4px;
        padding: 7px;
        border: 1px solid color-mix(in oklab, var(--delta-color) 30%, var(--border));
        border-left: 3px solid var(--delta-color);
        border-radius: 8px;
        background: color-mix(in oklab, var(--delta-color) 6%, var(--surface-raised));
      }

      .behavior-delta-card.high {
        --delta-color: var(--red);
      }

      .behavior-delta-card.low {
        --delta-color: var(--green);
      }

      .behavior-delta-card span {
        color: var(--delta-color);
      }

      .behavior-delta-card h5 {
        margin: 0;
        color: var(--text);
        font-size: 8.8px;
        line-height: 1.2;
      }

      .behavior-delta-card p {
        margin: 0;
        color: var(--text-soft);
        font-size: 7.8px;
        line-height: 1.3;
      }

      .behavior-stage {
        display: grid;
        gap: 8px;
        min-height: 280px;
        padding: 12px;
      }

      .behavior-lanes {
        display: grid;
        grid-template-columns: minmax(0, 0.9fr) 42px minmax(0, 0.95fr) 42px minmax(0, 1.05fr);
        gap: 7px;
        align-items: stretch;
      }

      .behavior-row {
        display: contents;
      }

      .behavior-cell {
        --cell-color: var(--primary);
        display: grid;
        align-content: start;
        gap: 6px;
        min-height: 90px;
        padding: 9px;
        border: 1px solid color-mix(in oklab, var(--cell-color) 30%, var(--border));
        border-radius: 8px;
        background:
          linear-gradient(135deg, color-mix(in oklab, var(--cell-color) 9%, transparent), transparent 62%),
          var(--surface-raised);
      }

      .behavior-cell.before {
        --cell-color: var(--muted);
      }

      .behavior-cell.trigger {
        --cell-color: var(--amber);
      }

      .behavior-cell.after {
        --cell-color: var(--red);
      }

      .behavior-cell.review_required,
      .behavior-cell.block {
        --cell-color: var(--red);
      }

      .behavior-cell.review,
      .behavior-cell.partial,
      .behavior-cell.neutral {
        --cell-color: var(--amber);
      }

      .behavior-cell.pass,
      .behavior-cell.success {
        --cell-color: var(--green);
      }

      .behavior-arrow {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 90px;
      }

      .behavior-arrow::before {
        width: 100%;
        height: 2px;
        border-radius: 999px;
        background: color-mix(in oklab, var(--primary) 58%, var(--muted));
        content: "";
      }

      .behavior-arrow::after {
        position: absolute;
        right: 0;
        width: 8px;
        height: 8px;
        border-top: 2px solid color-mix(in oklab, var(--primary) 72%, var(--muted));
        border-right: 2px solid color-mix(in oklab, var(--primary) 72%, var(--muted));
        transform: rotate(45deg);
        content: "";
      }

      .behavior-impact-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .gate-stage {
        --stage-accent: var(--red);
        display: grid;
        grid-template-columns: minmax(170px, 0.3fr) minmax(0, 1fr);
        min-height: 300px;
      }

      .gate-packet {
        display: grid;
        align-content: center;
        gap: 9px;
        padding: 12px;
        border-right: 1px solid var(--border);
      }

      .gate-packet-icon {
        display: grid;
        place-items: center;
        width: 86px;
        aspect-ratio: 1;
        border: 2px solid color-mix(in oklab, var(--primary) 44%, transparent);
        border-radius: 24px;
        background:
          linear-gradient(135deg, color-mix(in oklab, var(--primary) 16%, transparent), color-mix(in oklab, var(--green) 12%, transparent)),
          var(--surface-inset);
        color: var(--primary);
        font-size: 24px;
        font-weight: 950;
      }

      .gate-wall {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        align-content: start;
        padding: 12px;
      }

      .gate-card {
        --gate-color: var(--green);
        display: grid;
        align-content: start;
        gap: 7px;
        min-height: 126px;
        padding: 9px;
        border: 1px solid color-mix(in oklab, var(--gate-color) 38%, var(--border));
        border-top: 3px solid var(--gate-color);
        border-radius: 8px;
        background:
          radial-gradient(circle at 0 0, color-mix(in oklab, var(--gate-color) 14%, transparent), transparent 48%),
          var(--surface-raised);
      }

      .gate-card.block,
      .gate-card.fail,
      .gate-card.failed,
      .gate-card.failure {
        --gate-color: var(--red);
      }

      .gate-card.warn,
      .gate-card.review,
      .gate-card.review_required,
      .gate-card.neutral {
        --gate-color: var(--amber);
      }

      .prompt-metrics {
        display: grid;
        gap: 5px;
      }

      .prompt-bar {
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr) 30px;
        gap: 6px;
        align-items: center;
        color: var(--text-soft);
        font-size: 7.8px;
        font-weight: 850;
      }

      .prompt-bar span:nth-child(2) {
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in oklab, var(--muted) 16%, transparent);
      }

      .prompt-bar span:nth-child(2)::before {
        display: block;
        width: calc(var(--bar-value, 0) * 1%);
        height: 100%;
        border-radius: inherit;
        background: var(--gate-color);
        content: "";
      }

      .gate-check-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .gate-check-dot {
        --check-color: var(--green);
        display: inline-flex;
        align-items: center;
        gap: 4px;
        max-width: 100%;
        padding: 2px 5px;
        border: 1px solid color-mix(in oklab, var(--check-color) 38%, transparent);
        border-radius: 999px;
        color: var(--text-soft);
        font-size: 7.4px;
        font-weight: 850;
      }

      .gate-check-dot::before {
        flex: 0 0 auto;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--check-color);
        content: "";
      }

      .gate-check-dot.fail,
      .gate-check-dot.failure,
      .gate-check-dot.blocked,
      .gate-check-dot.block {
        --check-color: var(--red);
      }

      .gate-check-dot.neutral,
      .gate-check-dot.review,
      .gate-check-dot.review_required,
      .gate-check-dot.warn {
        --check-color: var(--amber);
      }

      .contract-stage {
        --stage-accent: var(--violet);
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(210px, 0.34fr);
        min-height: 300px;
      }

      .contract-finding-list {
        display: grid;
        gap: 9px;
        padding: 12px;
        border-right: 1px solid var(--border);
      }

      .contract-finding {
        display: grid;
        gap: 8px;
        padding: 9px;
        border: 1px solid color-mix(in oklab, var(--red) 26%, var(--border));
        border-radius: 8px;
        background:
          linear-gradient(135deg, color-mix(in oklab, var(--red) 10%, transparent), transparent 58%),
          var(--surface-raised);
      }

      .contract-xray-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr);
        gap: 6px;
        align-items: stretch;
      }

      .contract-shape {
        display: grid;
        align-content: start;
        gap: 5px;
        min-height: 116px;
        padding: 8px;
        border: 1px solid color-mix(in oklab, var(--muted) 18%, transparent);
        border-radius: 7px;
        background: color-mix(in oklab, var(--surface-inset) 74%, transparent);
      }

      .contract-shape h6 {
        margin: 0 0 2px;
        color: var(--muted);
        font-size: 7.5px;
        font-weight: 950;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .contract-field {
        --field-color: var(--green);
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 6px;
        align-items: center;
        padding: 4px 5px;
        border: 1px solid color-mix(in oklab, var(--field-color) 30%, transparent);
        border-radius: 6px;
        color: var(--text-soft);
        font-size: 8px;
        line-height: 1.15;
      }

      .contract-field.removed {
        --field-color: var(--red);
        color: var(--red);
      }

      .contract-field.added {
        --field-color: var(--primary);
        color: var(--primary);
      }

      .contract-field.changed {
        --field-color: var(--amber);
        color: var(--amber);
      }

      .contract-arrow {
        position: relative;
        display: grid;
        place-items: center;
      }

      .contract-arrow::before {
        width: 100%;
        height: 2px;
        background: color-mix(in oklab, var(--violet) 58%, var(--muted));
        content: "";
      }

      .contract-arrow::after {
        position: absolute;
        right: 0;
        width: 8px;
        height: 8px;
        border-top: 2px solid color-mix(in oklab, var(--violet) 68%, var(--muted));
        border-right: 2px solid color-mix(in oklab, var(--violet) 68%, var(--muted));
        transform: rotate(45deg);
        content: "";
      }

      .contract-rail {
        display: grid;
        align-content: start;
        gap: 8px;
        padding: 12px;
      }

      .contract-test-card {
        display: grid;
        gap: 6px;
        padding: 8px;
        border: 1px dashed color-mix(in oklab, var(--green) 34%, var(--border));
        border-radius: 8px;
        background: color-mix(in oklab, var(--green) 8%, var(--surface-raised));
      }

      .contract-test-card h5 {
        margin: 0;
        color: var(--text);
        font-size: 9.5px;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      .contract-test-card p {
        margin: 0;
        color: var(--text-soft);
        font-size: 8.4px;
        line-height: 1.28;
      }

      .review-card h4 {
        margin: 0;
        overflow-wrap: anywhere;
        font-size: 10.5px;
      }

      .review-card p {
        margin: 6px 0 0;
        color: var(--text-soft);
        font-size: 9.5px;
      }

      .review-card .muted {
        margin-top: 6px;
      }

      .panel {
        padding: 13px;
      }

      .panel h3 {
        margin: 0 0 9px;
        font-size: 13px;
      }

      .section-kicker {
        margin: 0 0 3px;
        color: var(--muted);
        font-size: 8.8px;
        font-weight: 850;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip,
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 19px;
        padding: 1px 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: color-mix(in oklab, var(--muted) 12%, transparent);
        color: var(--text-soft);
        font-size: 8.8px;
        font-weight: 850;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .pill-blocked,
      .pill-block,
      .pill-remove,
      .pill-missing,
      .pill-failure,
      .pill-fail,
      .pill-analysis_failed,
      .pill-failed {
        border-color: color-mix(in oklab, var(--red) 42%, transparent);
        background: color-mix(in oklab, var(--red) 13%, transparent);
        color: var(--red);
      }

      .pill-review,
      .pill-review_required,
      .pill-warn,
      .pill-rework,
      .pill-partial,
      .pill-neutral {
        border-color: color-mix(in oklab, var(--amber) 42%, transparent);
        background: color-mix(in oklab, var(--amber) 13%, transparent);
        color: var(--amber);
      }

      .pill-pass,
      .pill-completed,
      .pill-skim,
      .pill-verified,
      .pill-covered,
      .pill-found,
      .pill-success {
        border-color: color-mix(in oklab, var(--green) 40%, transparent);
        background: color-mix(in oklab, var(--green) 12%, transparent);
        color: var(--green);
      }

      .pill-running,
      .pill-info {
        border-color: color-mix(in oklab, var(--primary) 42%, transparent);
        background: color-mix(in oklab, var(--primary) 12%, transparent);
        color: var(--primary);
      }

      .pill-queued,
      .pill-unknown {
        border-color: color-mix(in oklab, var(--violet) 42%, transparent);
        background: color-mix(in oklab, var(--violet) 12%, transparent);
        color: var(--violet);
      }

      .empty-state,
      .error {
        min-height: 160px;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text-soft);
        text-align: center;
      }

      .queue-list .empty-state {
        min-height: 116px;
        padding: 12px;
      }

      .error {
        min-height: auto;
        border-color: color-mix(in oklab, var(--red) 42%, transparent);
        color: var(--red);
      }

      .comment-box {
        max-height: 360px;
        overflow: auto;
        padding: 14px;
        border: 1px solid var(--border);

      .bar-list {

      .bar-row {
        display: grid;

      .bar-track {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in oklab, var(--muted) 16%, transparent);

      .bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--indigo), var(--primary), var(--green));

      .hidden {

      }

      @media (max-width: 1180px) {
        .hero,
        .workspace {

        .review-heat-row {

        }

        .coverage-sun-card {

        }

        .coverage-sun {

        }

        .agent-stage-chain {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .agent-command-grid {

        .test-score-panel,

        .contract-finding-list {

      @media (max-width: 640px) {

        .topbar-actions .theme-toggle {

        .slop-lanes,

        .coverage-sun-card,

        }

        .coverage-sun {

        }

        .behavior-arrow,

        .memory-stage {

        }

        .memory-radar-stats,
        .memory-detail-panel,
        .proof-graph-detail {

          min-width: 0;
          margin: 10px;
        }

        .memory-radar-stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .memory-center,
        .memory-orbit,
        .memory-node,
        .memory-empty {
          top: 340px;
        }

        .proof-graph-stage {
          min-height: 760px;
          overflow: auto;
        }

        .proof-graph-labels {
          left: 10px;
          right: 10px;

        }

        .proof-graph-node {
          top: calc(var(--mobile-y, 260px) + var(--row-y, 0px));
        }

        .shell {
          grid-template-columns: 1fr;

          min-height: calc(100vh - var(--topbar-height));

    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>MergeGuard</h1>
          <p>Agentic command center</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button id="theme-toggle" class="button theme-toggle" type="button" aria-pressed="false">
          <span class="theme-toggle-track" aria-hidden="true">
            <span class="theme-toggle-thumb">
              <span class="theme-toggle-icon theme-toggle-icon-sun"></span>
              <span class="theme-toggle-icon theme-toggle-icon-moon"></span>
            </span>
          </span>
          <span id="theme-toggle-label" class="sr-only">Slate Citrus dark mode</span>
        </button>
        <button id="refresh-button" class="button" type="button">Refresh</button>
        <button id="run-demo" class="button button-primary" type="button">Run Demo PR</button>
      </div>
    </header>

    <main id="app-shell" class="shell app-shell">
      <section id="queue-panel" class="panel pr-list-panel" aria-label="Pull request list">
        <button id="queue-panel-toggle" class="rail-toggle" type="button" aria-label="Collapse PR rail" title="Collapse PR rail">&lt;</button>
        <div id="queue-panel-resizer" class="rail-resizer" role="separator" aria-orientation="vertical" aria-label="Resize PR rail" tabindex="0"></div>
        <div class="rail-collapsed-label" aria-hidden="true">PR queue</div>
        <div class="page-heading">
          <div>
            <p class="eyebrow">Live PR intake</p>
            <h2>Pull requests</h2>
            <p class="muted">Choose a PR, run agents, then open the dashboard.</p>
          </div>
          <section id="metrics" class="metrics compact-metrics" aria-label="Metrics"></section>
        </div>
        <form id="filters" class="filters">
          <label>
            Repo
            <select name="repo" id="repo-filter">
              <option value="">All repos</option>
            </select>
          </label>
          <label>
            Owner
            <select name="owner" id="owner-filter">
              <option value="">All owners</option>
            </select>
          </label>
          <label>
            State
            <select name="risk_state" id="state-filter">
              <option value="">All states</option>
              <option value="pass">Pass</option>
              <option value="review">Review</option>
              <option value="blocked">Blocked</option>
              <option value="analysis_failed">Analysis failed</option>
            </select>
          </label>
        </form>
        <div class="pr-list-header">
          <h3 class="panel-title">PR queue</h3>
          <span id="queue-count" class="pill pill-info">0 PRS</span>
        </div>
        <div class="queue-tabs" role="tablist" aria-label="Pull request queue view">
          <button id="active-pr-tab" class="queue-tab active" type="button" data-queue-tab="active" role="tab" aria-selected="true">Active</button>
          <button id="reviewed-pr-tab" class="queue-tab" type="button" data-queue-tab="reviewed" role="tab" aria-selected="false">Reviewed</button>
        </div>
        <div id="queue-list" class="queue-list pr-list"></div>
      </section>

      <section class="workbench" aria-label="PR analysis workspace">
        <section id="agent-workflow-panel" class="panel agent-workflow-panel" aria-label="Agent workflow">
          <div class="workflow-toolbar">
            <div>
              <p class="section-kicker">Agent workflow</p>
              <h3 id="workflow-title" class="panel-title">Available agents</h3>
              <p id="workflow-subtitle" class="muted">Toggle agents, then analyze a PR to watch the flow.</p>
            </div>
            <label class="delay-control">
              Execution gap
              <input id="agent-delay" type="range" min="0" max="2000" step="250" value="750" />
              <span id="agent-delay-value">750ms</span>
            </label>
          </div>
          <div class="agent-flow-shell">
            <div id="agent-flow" class="agent-flow-canvas"></div>
          </div>
        </section>

        <section id="detail-pane" class="detail-pane hidden" aria-label="Pull request dashboard"></section>
      </section>
    </main>

    <div id="agent-output-dialog" class="agent-output-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="agent-output-heading">
      <div class="agent-output-popover">
        <div class="agent-output-header">
          <div>
            <p class="section-kicker">Agent output</p>
            <h3 id="agent-output-heading" class="panel-title">Agent details</h3>
          </div>
          <button id="agent-output-close" class="agent-output-close" type="button" aria-label="Close agent output">X</button>
        </div>
        <aside id="agent-output" class="agent-output"></aside>
      </div>
    </div>

    <div id="code-dialog" class="code-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="code-dialog-heading">
      <div class="code-popover">
        <div class="agent-output-header">
          <div>
            <p class="section-kicker">File inspection</p>
            <h3 id="code-dialog-heading" class="panel-title">Changed file</h3>
          </div>
          <button id="code-dialog-close" class="agent-output-close" type="button" aria-label="Close file inspection">X</button>
        </div>
        <div id="code-dialog-body" class="code-dialog-body"></div>
      </div>
    </div>

    <script type="module">
      const state = {
        rows: [],
        selectedRunId: null,
        selectedPrId: null,
        selectedDetailTab: "overview",
        activeAnalysisPrId: null,
        currentRun: null,
        agents: [],
        enabledAgents: new Set(),
        selectedAgentId: null,
        selectedCodePath: null,
        runningAgentId: null,
        flowCompletedAgentIds: new Set(),
        flowTimer: null,
        delayMs: 750,
        isolatedThread: null,
        runStartedAt: null,
        lastRunElapsedMs: null,
        replayInFlight: false,
        queueTab: "active",
        queueCollapsed: false,
        queueRailWidth: null,
        filters: { repo: "", owner: "", risk_state: "" }
      };

      const agentPipelineLayers = [
        {
          id: "intake",
          kicker: "Stage 1",
          title: "Intake",
          agentIds: ["review-compression", "intent-extractor"]
        },
        {
          id: "impact",
          kicker: "Stage 2",
          title: "Impact",
          agentIds: [
            "semantic-diff-explainer",
            "concept-classifier",
            "slop-detector",
            "prompt-canary",
            "contract-comparator"
          ]
        },
        {
          id: "memory",
          kicker: "Stage 3",
          title: "Memory",
          agentIds: ["semantic-evidence-agent"]
        },
        {
          id: "guardrails",
          kicker: "Stage 4",
          title: "Guardrails",
          agentIds: ["policy-gate", "evidence-mapper"]
        },
        {
          id: "coverage",
          kicker: "Stage 5",
          title: "Coverage",
          agentIds: ["test-coverage-validator"]
        },
        {
          id: "decision",
          kicker: "Stage 6",
          title: "Decision",
          agentIds: ["truth-report-synthesizer"]
        }
      ];

      const agentDependencies = {
        "semantic-diff-explainer": ["review-compression"],
        "concept-classifier": ["review-compression"],
        "slop-detector": ["review-compression"],
        "prompt-canary": ["review-compression"],
        "contract-comparator": ["review-compression"],
        "semantic-evidence-agent": ["review-compression", "intent-extractor"],
        "policy-gate": ["concept-classifier", "prompt-canary", "contract-comparator"],
        "evidence-mapper": ["intent-extractor", "semantic-evidence-agent"],
        "test-coverage-validator": ["semantic-diff-explainer", "evidence-mapper", "semantic-evidence-agent"],
        "truth-report-synthesizer": ["policy-gate", "test-coverage-validator", "semantic-evidence-agent", "slop-detector"]
      };

      const agentVisuals = {
        "review-compression": { icon: "CT", tone: "hotspots" },
        "intent-extractor": { icon: "IN", tone: "intent" },
        "semantic-diff-explainer": { icon: "BI", tone: "behavior" },
        "concept-classifier": { icon: "CC", tone: "concepts" },
        "slop-detector": { icon: "SD", tone: "slop" },
        "policy-gate": { icon: "GR", tone: "policy" },
        "prompt-canary": { icon: "PD", tone: "prompt" },
        "contract-comparator": { icon: "RC", tone: "contracts" },
        "semantic-evidence-agent": { icon: "RM", tone: "memory" },
        "evidence-mapper": { icon: "VE", tone: "evidence" },
        "test-coverage-validator": { icon: "TC", tone: "tests" },
        "truth-report-synthesizer": { icon: "TR", tone: "report" }
      };

      // Subway-thread color per tone. Reuses theme vars so light/dark both work.
      // Threads that would collide on plain palette (multiple greens, etc.) are
      // mixed to distinct hues so each stream reads as its own line on the map.
      const toneColor = {
        hotspots: "var(--primary)",
        intent: "var(--indigo)",
        behavior: "var(--amber)",
        concepts: "var(--violet)",
        slop: "color-mix(in oklab, var(--amber) 65%, var(--primary) 35%)",
        policy: "var(--red)",
        prompt: "var(--blue)",
        contracts: "var(--green)",
        memory: "color-mix(in oklab, var(--green) 55%, var(--blue) 45%)",
        evidence: "color-mix(in oklab, var(--green) 70%, var(--primary) 30%)",
        tests: "color-mix(in oklab, var(--green) 50%, var(--amber) 50%)",
        report: "color-mix(in oklab, var(--red) 75%, var(--violet) 25%)"
      };

      function toneOf(agentId) {
        return (agentVisuals[agentId] && agentVisuals[agentId].tone) || "hotspots";
      }

      function toneColorFor(agentId) {
        return toneColor[toneOf(agentId)] || "var(--primary)";
      }

      const metricsEl = document.querySelector("#metrics");
      const appShellEl = document.querySelector("#app-shell");
      const queuePanelEl = document.querySelector("#queue-panel");
      const queuePanelToggleEl = document.querySelector("#queue-panel-toggle");
      const queuePanelResizerEl = document.querySelector("#queue-panel-resizer");
      const queueListEl = document.querySelector("#queue-list");
      const detailEl = document.querySelector("#detail-pane");
      const repoFilterEl = document.querySelector("#repo-filter");
      const ownerFilterEl = document.querySelector("#owner-filter");
      const stateFilterEl = document.querySelector("#state-filter");
      const runButton = document.querySelector("#run-demo");
      const refreshButton = document.querySelector("#refresh-button");
      const themeToggleButton = document.querySelector("#theme-toggle");
      const themeToggleLabel = document.querySelector("#theme-toggle-label");
      const queueCountEl = document.querySelector("#queue-count");
      const queueTabButtons = [...document.querySelectorAll("[data-queue-tab]")];
      const workflowPanelEl = document.querySelector("#agent-workflow-panel");
      const workflowTitleEl = document.querySelector("#workflow-title");
      const workflowSubtitleEl = document.querySelector("#workflow-subtitle");
      const agentFlowEl = document.querySelector("#agent-flow");
      const agentOutputEl = document.querySelector("#agent-output");
      const agentOutputDialogEl = document.querySelector("#agent-output-dialog");
      const agentOutputHeadingEl = document.querySelector("#agent-output-heading");
      const agentOutputCloseEl = document.querySelector("#agent-output-close");
      const codeDialogEl = document.querySelector("#code-dialog");
      const codeDialogHeadingEl = document.querySelector("#code-dialog-heading");
      const codeDialogBodyEl = document.querySelector("#code-dialog-body");
      const codeDialogCloseEl = document.querySelector("#code-dialog-close");
      const agentDelayEl = document.querySelector("#agent-delay");
      const agentDelayValueEl = document.querySelector("#agent-delay-value");

      initThemeToggle();
      initQueueRailControls();
      initAgentOutputDialog();
      initCodeDialog();
      runButton.addEventListener("click", runDemo);
      refreshButton.addEventListener("click", () => loadQueue());
      agentDelayEl.addEventListener("input", () => {
        state.delayMs = Number(agentDelayEl.value);
        agentDelayValueEl.textContent = `${state.delayMs}ms`;
      });
      document.querySelector("#filters").addEventListener("change", (event) => {
        state.filters[event.target.name] = event.target.value;
        loadQueue();
      });
      for (const tabButton of queueTabButtons) {
        tabButton.addEventListener("click", () => {
          state.queueTab = tabButton.dataset.queueTab || "active";
          renderQueue();
        });
      }

      await loadAgents();
      await loadQueue();
      window.setInterval(() => loadQueue({ preserveView: true }), 3000);
      window.addEventListener("resize", () => {
        if (!workflowPanelEl.classList.contains("hidden")) {
          window.requestAnimationFrame(() => renderPipelineLinks(state.currentRun));
        }
      });

      function initThemeToggle() {
        const activeTheme = document.documentElement.dataset.theme === "light" ? "light" : "dark";
        applyTheme(activeTheme);
        themeToggleButton.addEventListener("click", () => {
          const nextTheme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
          applyTheme(nextTheme);
          try {
            localStorage.setItem("mergeguard-theme", nextTheme);
          } catch {
            // Local storage is optional; the visual theme still changes for the session.
          }
        });
      }

      function applyTheme(theme) {
        const normalized = theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = normalized;
        const isLight = normalized === "light";
        themeToggleButton.setAttribute("aria-pressed", String(isLight));
        themeToggleButton.setAttribute(
          "aria-label",
          isLight ? "Switch to Slate Citrus dark mode" : "Switch to Arctic Lab light mode"
        );
        themeToggleButton.title = isLight ? "Switch to Slate Citrus dark mode" : "Switch to Arctic Lab light mode";
        themeToggleLabel.textContent = isLight ? "Arctic Lab light mode" : "Slate Citrus dark mode";
      }

      function initQueueRailControls() {
        queuePanelToggleEl.addEventListener("click", () => {
          setQueuePanelCollapsed(!state.queueCollapsed);
        });
        queuePanelResizerEl.addEventListener("keydown", (event) => {
          if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
          event.preventDefault();
          const current = state.queueRailWidth || queuePanelEl.getBoundingClientRect().width;
          const next = event.key === "Home"
            ? 170
            : event.key === "End"
              ? 420
              : current + (event.key === "ArrowRight" ? 18 : -18);
          setQueueRailWidth(next);
        });
        queuePanelResizerEl.addEventListener("pointerdown", (event) => {
          if (state.queueCollapsed) setQueuePanelCollapsed(false);
          queuePanelResizerEl.classList.add("is-dragging");
          const startX = event.clientX;
          const startWidth = queuePanelEl.getBoundingClientRect().width;
          const onMove = (moveEvent) => {
            setQueueRailWidth(startWidth + moveEvent.clientX - startX);
          };
          const onUp = () => {
            queuePanelResizerEl.classList.remove("is-dragging");
            window.removeEventListener("pointermove", onMove);
            window.removeEventListener("pointerup", onUp);
            window.removeEventListener("pointercancel", onUp);
          };
          window.addEventListener("pointermove", onMove);
          window.addEventListener("pointerup", onUp);
          window.addEventListener("pointercancel", onUp);
        });
      }

      function setQueueRailWidth(width) {
        const nextWidth = Math.round(Math.min(420, Math.max(170, width)));
        state.queueRailWidth = nextWidth;
        state.queueCollapsed = false;
        appShellEl.classList.remove("queue-collapsed");
        document.documentElement.style.setProperty("--queue-rail-width", `${nextWidth}px`);
        queuePanelToggleEl.textContent = "<";
        queuePanelToggleEl.setAttribute("aria-label", "Collapse PR rail");
        queuePanelToggleEl.title = "Collapse PR rail";
        window.requestAnimationFrame(() => renderPipelineLinks(state.currentRun));
      }

      function setQueuePanelCollapsed(collapsed) {
        state.queueCollapsed = collapsed;
        appShellEl.classList.toggle("queue-collapsed", collapsed);
        queuePanelToggleEl.textContent = collapsed ? ">" : "<";
        queuePanelToggleEl.setAttribute("aria-label", collapsed ? "Expand PR rail" : "Collapse PR rail");
        queuePanelToggleEl.title = collapsed ? "Expand PR rail" : "Collapse PR rail";
        window.requestAnimationFrame(() => renderPipelineLinks(state.currentRun));
      }

      function initAgentOutputDialog() {
        agentOutputCloseEl.addEventListener("click", closeAgentOutput);
        agentOutputDialogEl.addEventListener("click", (event) => {
          if (event.target === agentOutputDialogEl) closeAgentOutput();
        });
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !agentOutputDialogEl.classList.contains("hidden")) {
            closeAgentOutput();
          }
        });
      }

      function openAgentOutput() {
        renderAgentOutput(state.currentRun);
        agentOutputDialogEl.classList.remove("hidden");
        agentOutputCloseEl.focus();
      }

      function closeAgentOutput() {
        agentOutputDialogEl.classList.add("hidden");
      }

      function showAgentOutputError(error) {
        agentOutputHeadingEl.textContent = "Agent run error";
        agentOutputEl.innerHTML = `<div class="error">${esc(error.message || error)}</div>`;
        agentOutputDialogEl.classList.remove("hidden");
        agentOutputCloseEl.focus();
      }

      function initCodeDialog() {
        codeDialogCloseEl.addEventListener("click", closeCodeDialog);
        codeDialogEl.addEventListener("click", (event) => {
          if (event.target === codeDialogEl) closeCodeDialog();
        });
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !codeDialogEl.classList.contains("hidden")) {
            closeCodeDialog();
          }
        });
      }

      function openCodeDialog(path) {
        state.selectedCodePath = path;
        const file = findChangedFile(path);
        const context = fileInspectionContext(path);
        const patch = file?.patch || file?.diff || "";
        codeDialogHeadingEl.textContent = path || "Changed file";
        codeDialogBodyEl.innerHTML = renderCodeDialogBody(path, file, context, patch);
        codeDialogEl.classList.remove("hidden");
        codeDialogCloseEl.focus();
      }

      function closeCodeDialog() {
        codeDialogEl.classList.add("hidden");
        state.selectedCodePath = null;
      }

      function bindCodeLinks(root = detailEl) {
        for (const button of root.querySelectorAll("[data-code-path]")) {
          if (button.dataset.codeBound === "true") continue;
          button.dataset.codeBound = "true";
          button.addEventListener("click", () => openCodeDialog(button.dataset.codePath || ""));
        }
      }

      function bindMemoryNodes() {
        const detailBody = detailEl.querySelector("#memory-node-detail");
        if (!detailBody) return;
        for (const button of detailEl.querySelectorAll("[data-memory-node]")) {
          button.addEventListener("click", () => {
            for (const node of detailEl.querySelectorAll("[data-memory-node]")) {
              node.classList.toggle("active", node === button);
            }
            const payload = decodeMemoryNode(button.dataset.memoryPayload || "");
            detailBody.innerHTML = memoryNodeDetail(payload);
            bindCodeLinks(detailBody);
          });
        }
      }

      function bindEvidenceGraph() {
        const detailBody = detailEl.querySelector("#evidence-graph-detail");
        if (!detailBody) return;
        for (const button of detailEl.querySelectorAll("[data-evidence-node]")) {
          button.addEventListener("click", () => {
            for (const node of detailEl.querySelectorAll("[data-evidence-node]")) {
              node.classList.toggle("active", node.dataset.evidenceNode === button.dataset.evidenceNode);
            }
            const payload = decodeEvidenceNode(button.dataset.evidencePayload || "");
            detailBody.innerHTML = evidenceGraphDetail(payload);
            bindCodeLinks(detailBody);
          });
        }
      }

      function bindAgentDecisionMesh() {
        for (const button of detailEl.querySelectorAll("[data-agent-detail-id]")) {
          button.addEventListener("click", () => {
            state.selectedAgentId = button.dataset.agentDetailId;
            renderAgentOutput(state.currentRun);
            openAgentOutput();
          });
        }
      }

      async function loadAgents() {
        const data = await fetchJson("/api/agents");
        state.agents = data.agents || [];
        state.enabledAgents = new Set(state.agents.map((agent) => agent.id));
        state.selectedAgentId = state.agents[0]?.id || null;
        renderAgentWorkflow();
      }

      async function runDemo() {
        const previous = runButton.textContent;
        runButton.disabled = true;
        runButton.textContent = "Running...";
        state.currentRun = null;
        workflowPanelEl.classList.remove("hidden");
        detailEl.classList.add("hidden");
        closeAgentOutput();
        updateWorkflowHeader("Analyzing demo PR", "Invoking enabled agents with visible execution gaps.");
        startFlowAnimation();
        try {
          const response = await fetch("/api/demo/analyze", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              enabled_agents: [...state.enabledAgents],
              agent_delay_ms: state.delayMs
            })
          });
          const data = await response.json();
          if (data.run) {
            state.selectedRunId = data.run.id;
            state.selectedPrId = data.run.pull_request_id;
            state.currentRun = data.run;
            updateWorkflowHeader("Agent run complete", "Use Show details in the PR list to open the dashboard.");
            renderAgentWorkflow(data.run);
          }
          await loadQueue({ preferredRunId: data.run?.id });
          if (!response.ok) {
            throw new Error(data.run?.summary?.next_action || data.error || "Demo analysis failed");
          }
        } catch (error) {
          showAgentOutputError(error);
        } finally {
          stopFlowAnimation();
          runButton.disabled = false;
          runButton.textContent = previous;
        }
      }

      async function loadQueue(options = {}) {
        const data = await fetchJson("/api/queue");
        state.rows = data.queue || [];
        renderMetrics(data.metrics || {});
        renderFilters();

        const selectedRow = chooseSelectedRow(options.preferredRunId);
        if (options.preferredRunId && selectedRow?.latest_run) {
          state.selectedRunId = selectedRow.latest_run.id;
          state.selectedPrId = selectedRow.pull_request.id;
        }

        renderQueue();
      }

      function chooseSelectedRow(preferredRunId) {
        if (preferredRunId) {
          const hit = state.rows.find((row) => row.latest_run?.id === preferredRunId);
          if (hit) return hit;
        }
        if (state.selectedRunId) {
          const hit = state.rows.find((row) => row.latest_run?.id === state.selectedRunId);
          if (hit) return hit;
        }
        if (state.selectedPrId) {
          const hit = state.rows.find((row) => row.pull_request?.id === state.selectedPrId);
          if (hit) return hit;
        }
        return state.rows[0];
      }

      function renderMetrics(metrics) {
        const total = state.rows.length || metrics.open_prs || 0;
        const reviewed = state.rows.filter((row) => hasFinishedAnalysis(row)).length || metrics.completed_runs || 0;
        const active = state.rows.filter((row) => isActivePr(row)).length;
        const needsAnalysisCount = state.rows.filter((row) => needsAnalysis(row)).length;
        metricsEl.innerHTML = [
          metric("Total PRs", total, "in queue"),
          metric("Reviewed", reviewed, "agent run complete"),
          metric("Active", active, "needs reviewer action"),
          metric("Need analysis", needsAnalysisCount, "waiting for agents")
        ].join("");
      }

      function renderFilters() {
        const repos = unique(state.rows.map((row) => row.pull_request?.repository?.full_name).filter(Boolean));
        const owners = unique(
          state.rows
            .flatMap((row) => {
              const summary = row.latest_run?.summary || {};
              return [
                row.pull_request?.author,
                ...(summary.owner_summary || []).map((owner) => owner.owner)
              ];
            })
            .filter(Boolean)
        );
        updateSelect(repoFilterEl, repos, "All repos", state.filters.repo);
        updateSelect(ownerFilterEl, owners, "All owners", state.filters.owner);
        stateFilterEl.value = state.filters.risk_state || "";
      }

      function renderQueue() {
        const rows = queueTabRows(filteredRows());
        const allFiltered = filteredRows();
        const activeCount = queueTabRows(allFiltered, "active").length;
        const reviewedCount = queueTabRows(allFiltered, "reviewed").length;
        queueCountEl.textContent = `${rows.length} PR${rows.length === 1 ? "" : "S"}`;
        for (const tabButton of queueTabButtons) {
          const tab = tabButton.dataset.queueTab || "active";
          const count = tab === "active" ? activeCount : reviewedCount;
          tabButton.classList.toggle("active", tab === state.queueTab);
          tabButton.setAttribute("aria-selected", String(tab === state.queueTab));
          tabButton.textContent = `${tab === "active" ? "Active" : "Reviewed"} (${count})`;
        }
        if (!rows.length) {
          queueListEl.innerHTML = `<div class="empty-state">No ${esc(state.queueTab)} pull requests match this scope.</div>`;
          return;
        }
        queueListEl.innerHTML = rows.map(queueCard).join("");
        for (const button of queueListEl.querySelectorAll("[data-action='analyze']")) {
          button.addEventListener("click", () => analyzePr(button.dataset.prId));
        }
        for (const button of queueListEl.querySelectorAll("[data-action='details']")) {
          button.addEventListener("click", () => showDetails(button.dataset.runId));
        }
      }

      async function analyzePr(prId) {
        const row = state.rows.find((item) => item.pull_request?.id === prId);
        if (!row) return;
        const pr = row.pull_request;
        state.activeAnalysisPrId = prId;
        state.selectedPrId = prId;
        state.selectedRunId = null;
        state.currentRun = null;
        workflowPanelEl.classList.remove("hidden");
        detailEl.classList.add("hidden");
        closeAgentOutput();
        updateWorkflowHeader(
          `Analyzing #${pr.number}`,
          `${pr.repository?.full_name || "repository"} / ${pr.title || "Untitled PR"}`
        );
        startFlowAnimation();
        renderQueue();
        try {
          const response = await fetch(`/api/prs/${encodeURIComponent(prId)}/analyze`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              enabled_agents: [...state.enabledAgents],
              agent_delay_ms: state.delayMs
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "PR analysis failed");
          state.selectedRunId = data.run.id;
          state.currentRun = data.run;
          updateWorkflowHeader("Agent run complete", "Show details is now available in the PR list.");
          renderAgentWorkflow(data.run);
          await loadQueue({ preferredRunId: data.run.id });
        } catch (error) {
          showAgentOutputError(error);
        } finally {
          state.activeAnalysisPrId = null;
          stopFlowAnimation();
          renderQueue();
        }
      }

      async function showDetails(runId) {
        if (!runId) return;
        const payload = await fetchJson(`/api/runs/${encodeURIComponent(runId)}`);
        state.selectedRunId = runId;
        state.selectedPrId = payload.run?.pull_request_id || null;
        state.selectedDetailTab = "overview";
        workflowPanelEl.classList.add("hidden");
        detailEl.classList.remove("hidden");
        closeAgentOutput();
        renderDetail(payload.run);
      }

      function renderAgentWorkflow(run = state.currentRun) {
        if (!state.agents.length) {
          agentFlowEl.innerHTML = `<div class="empty-state">Loading agents.</div>`;
          agentOutputEl.innerHTML = `<p class="muted">No agent selected.</p>`;
          return;
        }

        const stats = pipelineStats(run);
        const spotlightSet = pipelineSpotlightSet(run);
        const isSpotlit = Boolean(spotlightSet);
        agentFlowEl.innerHTML = `
          <div class="pipeline-header">
            <div>
              <p class="pipeline-eyebrow">Agents / live pipeline</p>
              <p class="pipeline-note">Each stream is a color thread. Click a thread to isolate it, or click an agent to spotlight its lineage.</p>
            </div>
            <div class="pipeline-stats" aria-label="Agent execution state">
              <span class="pipeline-stat running">${stats.running} running</span>
              <span class="pipeline-stat done">${stats.done} done</span>
              <span class="pipeline-stat failed">${stats.failed} failed</span>
              <span class="pipeline-stat">${stats.disabled} disabled</span>
            </div>
          </div>
          ${pipelineScoreboard(run, stats)}
          ${pipelineThreadLegend(run)}
          <div class="pipeline-board">
            <svg class="pipeline-link-layer" aria-hidden="true"></svg>
            <div class="pipeline-stages${isSpotlit ? " is-spotlit" : ""}">
              ${agentPipelineLayers.map((layer) => pipelineStage(layer, run, spotlightSet)).join("")}
            </div>
          </div>
        `;
        for (const button of agentFlowEl.querySelectorAll(".flow-node-main")) {
          button.addEventListener("click", () => {
            state.selectedAgentId = button.dataset.agentId;
            renderAgentWorkflow();
            openAgentOutput();
          });
        }
        for (const toggle of agentFlowEl.querySelectorAll(".agent-toggle")) {
          toggle.addEventListener("change", () => {
            if (toggle.checked) state.enabledAgents.add(toggle.dataset.agentId);
            else {
              state.enabledAgents.delete(toggle.dataset.agentId);
              state.flowCompletedAgentIds.delete(toggle.dataset.agentId);
            }
            renderAgentWorkflow();
          });
        }
        for (const chip of agentFlowEl.querySelectorAll("[data-thread-source]")) {
          chip.addEventListener("click", () => {
            const sourceId = chip.dataset.threadSource;
            state.isolatedThread = state.isolatedThread === sourceId ? null : sourceId;
            renderAgentWorkflow();
          });
        }
        const clearBtn = agentFlowEl.querySelector("[data-thread-clear]");
        if (clearBtn) {
          clearBtn.addEventListener("click", () => {
            state.isolatedThread = null;
            state.selectedAgentId = null;
            renderAgentWorkflow();
          });
        }
        const replayBtn = agentFlowEl.querySelector("[data-pipeline-replay]");
        if (replayBtn) {
          replayBtn.addEventListener("click", () => replayPipeline());
        }
        window.requestAnimationFrame(() => renderPipelineLinks(run));
        renderAgentOutput(run);
      }

      function pipelineScoreboard(run, stats) {
        const totalEnabled = state.agents.filter((agent) => state.enabledAgents.has(agent.id)).length;
        const done = stats.done;
        const failed = stats.failed;
        const segments = agentPipelineLayers.map((layer) => {
          const agents = layer.agentIds
            .map((id) => state.agents.find((a) => a.id === id))
            .filter(Boolean)
            .filter((agent) => state.enabledAgents.has(agent.id));
          const total = agents.length || 1;
          const states = agents.map((agent) => flowVisualState(agent, run));
          const completeCount = states.filter((s) => s === "completed").length;
          const hasFailed = states.includes("failed");
          const hasActive = states.includes("active");
          const score = agents.length ? completeCount / total : 0;
          const cls = hasFailed ? "failed" : hasActive ? "active" : score >= 1 ? "done" : "";
          return `<div class="pipeline-score-segment ${cls}">
            <div class="pipeline-score-bar" style="--score: ${score.toFixed(3)};"></div>
            <div class="pipeline-score-label">
              <span>${esc(layer.title)}</span>
              <span class="pipeline-score-count">${completeCount}/${agents.length || 0}</span>
            </div>
          </div>`;
        }).join("");
        const elapsed = pipelineElapsedLabel(run);
        const headline = totalEnabled
          ? `${done}/${totalEnabled} agents${failed ? ` · ${failed} failed` : ""}`
          : "No agents enabled";
        const canReplay = run && Object.keys(run.agent_results || {}).length > 0;
        return `<div class="pipeline-scoreboard">
          <div class="pipeline-scoreboard-track" role="progressbar" aria-label="Pipeline progress">${segments}</div>
          <div class="pipeline-scoreboard-meta">
            <span class="pipeline-scoreboard-headline">${esc(headline)}</span>
            <span class="pipeline-scoreboard-sub">${esc(elapsed)}</span>
          </div>
          ${canReplay ? `<button class="pipeline-replay-button" type="button" data-pipeline-replay${state.replayInFlight ? " disabled" : ""}>${state.replayInFlight ? "Replaying" : "Replay"}</button>` : ""}
        </div>`;
      }

      function pipelineElapsedLabel(run) {
        if (state.runStartedAt) {
          const ms = Date.now() - state.runStartedAt;
          return `Elapsed ${(ms / 1000).toFixed(1)}s`;
        }
        if (state.lastRunElapsedMs != null) {
          return `Last run ${(state.lastRunElapsedMs / 1000).toFixed(1)}s`;
        }
        if (run?.completed_at && run?.started_at) {
          const ms = new Date(run.completed_at).getTime() - new Date(run.started_at).getTime();
          if (Number.isFinite(ms) && ms >= 0) return `Run took ${(ms / 1000).toFixed(1)}s`;
        }
        return "Awaiting run";
      }

      function pipelineThreadLegend(run) {
        const threads = pipelineThreadDescriptors();
        if (!threads.length) return "";
        const chips = threads.map((thread) => {
          const pressed = state.isolatedThread === thread.sourceId;
          return `<button type="button"
              class="pipeline-thread-chip"
              data-thread-source="${escAttr(thread.sourceId)}"
              style="--thread-color: ${thread.color};"
              aria-pressed="${pressed ? "true" : "false"}"
              title="Isolate ${escAttr(thread.label)} thread">
            <span class="pipeline-thread-swatch" aria-hidden="true"></span>
            <span>${esc(thread.label)}</span>
          </button>`;
        }).join("");
        const clear = state.isolatedThread || state.selectedAgentId
          ? `<button type="button" class="pipeline-thread-clear" data-thread-clear>Clear focus</button>`
          : "";
        return `<div class="pipeline-thread-legend" aria-label="Evidence threads">
          <span class="pipeline-thread-legend-label">Threads</span>
          ${chips}
          ${clear}
        </div>`;
      }

      function pipelineThreadDescriptors() {
        const sources = new Set(
          pipelineLinks().map(({ sourceId }) => sourceId)
        );
        return [...sources]
          .map((sourceId) => {
            const agent = state.agents.find((a) => a.id === sourceId);
            if (!agent) return null;
            return {
              sourceId,
              label: agent.label,
              color: toneColorFor(sourceId),
              tone: toneOf(sourceId)
            };
          })
          .filter(Boolean)
          .sort((a, b) => agentLayerIndex(a.sourceId) - agentLayerIndex(b.sourceId));
      }

      function pipelineSpotlightSet(run) {
        if (state.isolatedThread) return downstreamLineage(state.isolatedThread);
        if (state.selectedAgentId) return agentLineage(state.selectedAgentId);
        return null;
      }

      function agentDescendants(agentId, acc = new Set()) {
        for (const [targetId, sources] of Object.entries(agentDependencies)) {
          if (sources.includes(agentId) && !acc.has(targetId)) {
            acc.add(targetId);
            agentDescendants(targetId, acc);
          }
        }
        return acc;
      }

      function agentAncestors(agentId, acc = new Set()) {
        const sources = agentDependencies[agentId] || [];
        for (const sourceId of sources) {
          if (!acc.has(sourceId)) {
            acc.add(sourceId);
            agentAncestors(sourceId, acc);
          }
        }
        return acc;
      }

      function agentLineage(agentId) {
        const set = new Set([agentId]);
        for (const id of agentAncestors(agentId)) set.add(id);
        for (const id of agentDescendants(agentId)) set.add(id);
        return set;
      }

      function downstreamLineage(sourceId) {
        const set = new Set([sourceId]);
        for (const id of agentDescendants(sourceId)) set.add(id);
        return set;
      }

      function updateWorkflowHeader(title, subtitle) {
        workflowTitleEl.textContent = title;
        workflowSubtitleEl.textContent = subtitle;
      }

      function pipelineStage(layer, run, spotlightSet) {
        const agents = layer.agentIds
          .map((agentId) => state.agents.find((agent) => agent.id === agentId))
          .filter(Boolean);
        const completeCount = agents.filter((agent) => flowVisualState(agent, run) === "completed").length;
        return `<section class="pipeline-stage pipeline-stage-${escAttr(layer.id)}">
          <div class="pipeline-stage-head">
            <div>
              <span class="pipeline-stage-kicker">${esc(layer.kicker)}</span>
              <span class="pipeline-stage-title">${esc(layer.title)}</span>
            </div>
            <span class="pipeline-stage-count">${completeCount}/${agents.length}</span>
          </div>
          <div class="pipeline-stage-list">
            ${agents.map((agent) => pipelineAgentCard(agent, layer, run, spotlightSet)).join("")}
          </div>
        </section>`;
      }

      function pipelineAgentCard(agent, layer, run, spotlightSet) {
        const result = run?.agent_results?.[agent.id];
        const enabled = state.enabledAgents.has(agent.id);
        const selected = agent.id === state.selectedAgentId ? " selected" : "";
        const visualState = flowVisualState(agent, run);
        const status = result?.status || (visualState === "active" ? "running" : enabled ? "ready" : "disabled");
        const statusText = pipelineStatusLabel(status);
        const disabled = !enabled ? " disabled" : "";
        const lit = spotlightSet && spotlightSet.has(agent.id) ? " lit" : "";
        const visual = agentVisual(agent);
        const threadColor = toneColorFor(agent.id);
        return `<article class="pipeline-card ${escAttr(visualState)}${selected}${disabled}${lit}"
            data-pipeline-agent-id="${escAttr(agent.id)}"
            data-tone="${escAttr(visual.tone)}"
            style="--thread-color: ${threadColor};">
          <button class="flow-node-main pipeline-card-main" type="button" data-agent-id="${escAttr(agent.id)}" title="${escAttr(agent.label)}">
            <span class="agent-icon ${escAttr(visual.tone)}">${esc(visual.icon)}</span>
            <span class="pipeline-card-copy">
              <span class="pipeline-card-stage">${esc(layer.title)} / ${esc(agent.stage)}</span>
              <span class="pipeline-card-title">${esc(agent.label)}</span>
            </span>
          </button>
          <div class="pipeline-progress" aria-hidden="true"><span></span></div>
          <div class="pipeline-card-footer">
            <div class="flow-status">${pill(statusText, status)}</div>
            <label class="switch" title="Enable ${escAttr(agent.label)}">
              <input class="agent-toggle" type="checkbox" data-agent-id="${escAttr(agent.id)}" ${enabled ? "checked" : ""} />
              <span aria-hidden="true"></span>
            </label>
          </div>
        </article>`;
      }

      function pipelineStatusLabel(status) {
        const normalized = String(status || "").toLowerCase();
        if (["completed", "success", "passed", "pass"].includes(normalized)) return "done";
        if (["failed", "failure", "analysis_failed", "block", "blocked"].includes(normalized)) return "fail";
        if (["running", "active", "in_progress"].includes(normalized)) return "run";
        if (["disabled", "skipped"].includes(normalized)) return "off";
        return "ready";
      }

      function renderPipelineLinks(run = state.currentRun) {
        const board = agentFlowEl.querySelector(".pipeline-board");
        const svg = agentFlowEl.querySelector(".pipeline-link-layer");
        if (!board || !svg) return;
        const boardRect = board.getBoundingClientRect();
        const width = Math.max(board.scrollWidth, Math.ceil(boardRect.width));
        const height = Math.max(board.scrollHeight, Math.ceil(boardRect.height));
        svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
        svg.setAttribute("width", String(width));
        svg.setAttribute("height", String(height));

        const spotlightSet = pipelineSpotlightSet(run);
        const fragments = [];
        for (const [linkIndex, { sourceId, targetId }] of pipelineLinks().entries()) {
          const source = board.querySelector(`[data-pipeline-agent-id="${cssAttrSelectorValue(sourceId)}"]`);
          const target = board.querySelector(`[data-pipeline-agent-id="${cssAttrSelectorValue(targetId)}"]`);
          if (!source || !target) continue;
          const sourceRect = source.getBoundingClientRect();
          const targetRect = target.getBoundingClientRect();
          const x1 = sourceRect.right - boardRect.left;
          const y1 = sourceRect.top - boardRect.top + sourceRect.height / 2;
          const x2 = targetRect.left - boardRect.left;
          const y2 = targetRect.top - boardRect.top + targetRect.height / 2;
          const sourceLayer = agentLayerIndex(sourceId);
          const targetLayer = agentLayerIndex(targetId);
          const laneOffset = ((linkIndex % 7) - 3) * 7;
          const gap = Math.max(22, x2 - x1);
          const elbowX = x1 + Math.max(18, gap / 2) + laneOffset;
          const skipLane = skipLinkLane(sourceId, targetId, height);
          const exitX = x1 + skipLane.exitOffset + laneOffset / 4;
          const entryX = x2 - skipLane.entryOffset - laneOffset / 4;
          const stateName = pipelineLinkVisualState(sourceId, targetId, run);
          const pathD = targetLayer - sourceLayer > 1
            ? `M ${x1.toFixed(1)} ${y1.toFixed(1)} H ${exitX.toFixed(1)} V ${skipLane.y.toFixed(1)} H ${entryX.toFixed(1)} V ${y2.toFixed(1)} H ${x2.toFixed(1)}`
            : `M ${x1.toFixed(1)} ${y1.toFixed(1)} H ${elbowX.toFixed(1)} V ${y2.toFixed(1)} H ${x2.toFixed(1)}`;
          const threadColor = toneColorFor(sourceId);
          const pathId = `mg-link-${linkIndex}`;
          const dimCls = spotlightSet && !(spotlightSet.has(sourceId) && spotlightSet.has(targetId)) ? " dim" : "";
          const style = `style="--thread-color: ${threadColor};"`;
          fragments.push(`
            <path id="${pathId}" class="pipeline-link ${escAttr(stateName)}${dimCls}" d="${pathD}" ${style}></path>
            <circle class="pipeline-link-terminal ${escAttr(stateName)}${dimCls}" cx="${x1.toFixed(1)}" cy="${y1.toFixed(1)}" r="3.2" ${style}></circle>
            <circle class="pipeline-link-terminal ${escAttr(stateName)}${dimCls}" cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="3.6" ${style}></circle>
            ${pipelinePacketMarkup(pathId, stateName, dimCls, threadColor, linkIndex)}
          `);
        }
        svg.innerHTML = fragments.join("");
      }

      function pipelinePacketMarkup(pathId, stateName, dimCls, threadColor, linkIndex) {
        // Packets only animate while the run is in flight. They stop once the
        // pipeline finishes so the diagram reads as "at rest" when complete.
        if (stateName !== "active") return "";
        const dur = 1.05;
        const haloRadius = 7.5;
        const coreRadius = 3.2;
        const begin = `${((linkIndex % 5) * 0.18).toFixed(2)}s`;
        const style = `style="--thread-color: ${threadColor};"`;
        return `
          <circle class="pipeline-link-packet-halo${dimCls}" r="${haloRadius}" ${style}>
            <animateMotion dur="${dur}s" repeatCount="indefinite" begin="${begin}" rotate="auto">
              <mpath href="#${pathId}"></mpath>
            </animateMotion>
          </circle>
          <circle class="pipeline-link-packet${dimCls}" r="${coreRadius}" ${style}>
            <animateMotion dur="${dur}s" repeatCount="indefinite" begin="${begin}" rotate="auto">
              <mpath href="#${pathId}"></mpath>
            </animateMotion>
          </circle>
        `;
      }

      function skipLinkLane(sourceId, targetId, height) {
        const routeKey = `${sourceId}->${targetId}`;
        const topLanes = {
          "semantic-diff-explainer->test-coverage-validator": 48,
          "policy-gate->truth-report-synthesizer": 66
        };
        const bottomLanes = {
          "intent-extractor->evidence-mapper": 132,
          "semantic-evidence-agent->test-coverage-validator": 110,
          "semantic-evidence-agent->truth-report-synthesizer": 78,
          "slop-detector->truth-report-synthesizer": 96
        };
        if (topLanes[routeKey] != null) {
          return { y: topLanes[routeKey], exitOffset: 30, entryOffset: 32 };
        }
        if (bottomLanes[routeKey] != null) {
          return { y: Math.max(90, height - bottomLanes[routeKey]), exitOffset: 30, entryOffset: 32 };
        }
        return { y: Math.max(90, height - 74), exitOffset: 28, entryOffset: 28 };
      }

      function agentLayerIndex(agentId) {
        const index = agentPipelineLayers.findIndex((layer) => layer.agentIds.includes(agentId));
        return index < 0 ? 0 : index;
      }

      function pipelineLinks() {
        const known = new Set(state.agents.map((agent) => agent.id));
        return Object.entries(agentDependencies).flatMap(([targetId, sourceIds]) =>
          sourceIds
            .filter((sourceId) => known.has(sourceId) && known.has(targetId))
            .map((sourceId) => ({ sourceId, targetId }))
        );
      }

      function pipelineLinkVisualState(sourceId, targetId, run) {
        const source = state.agents.find((agent) => agent.id === sourceId);
        const target = state.agents.find((agent) => agent.id === targetId);
        if (!source || !target) return "disabled";
        if (!state.enabledAgents.has(sourceId) || !state.enabledAgents.has(targetId)) return "disabled";
        const sourceState = flowVisualState(source, run);
        const targetState = flowVisualState(target, run);
        if (sourceState === "failed" || targetState === "failed") return "failed";
        if (sourceState === "active" || targetState === "active") return "active";
        if (sourceState === "skipped" || targetState === "skipped") return "skipped";
        if (sourceState === "completed" || targetState === "completed") return "completed";
        return "ready";
      }

      function pipelineStats(run) {
        return state.agents.reduce((stats, agent) => {
          const visualState = flowVisualState(agent, run);
          if (visualState === "active") stats.running += 1;
          else if (visualState === "completed") stats.done += 1;
          else if (visualState === "failed") stats.failed += 1;
          else if (visualState === "disabled") stats.disabled += 1;
          else if (visualState === "skipped") stats.skipped += 1;
          else stats.ready += 1;
          return stats;
        }, { running: 0, done: 0, failed: 0, disabled: 0, skipped: 0, ready: 0 });
      }

      function cssAttrSelectorValue(value) {
        return String(value).replace(/\\/g, "\\\\").replace(/"/g, "\\\"");
      }

      function flowVisualState(agent, run) {
        const result = run?.agent_results?.[agent.id];
        if (!state.enabledAgents.has(agent.id)) return "disabled";
        const status = String(result?.status || "").toLowerCase();
        if (["failed", "failure", "error"].includes(status)) return "failed";
        if (status === "skipped") return "skipped";
        if (status) return "completed";
        if (agent.id === state.runningAgentId) return "active";
        if (state.flowCompletedAgentIds.has(agent.id)) return "completed";
        return "ready";
      }

      function agentVisual(agent) {
        return agentVisuals[agent.id] || { icon: agent.label.slice(0, 2).toUpperCase(), tone: "hotspots" };
      }

      function renderAgentOutput(run = state.currentRun) {
        const agent = state.agents.find((item) => item.id === state.selectedAgentId) || state.agents[0];
        if (!agent) {
          agentOutputHeadingEl.textContent = "Agent details";
          agentOutputEl.innerHTML = `<p class="muted">No agent selected.</p>`;
          return;
        }
        agentOutputHeadingEl.textContent = agent.label;
        const result = run?.agent_results?.[agent.id];
        const enabled = state.enabledAgents.has(agent.id);
        if (!result) {
          const hasRun = Boolean(run?.id);
          const emptyMessage = !enabled
            ? "This agent is disabled. Enable it in the pipeline panel to include it in the next run."
            : hasRun
              ? "This agent didn't run for the current analysis (pipeline failed earlier or the agent was skipped). Run a fresh analysis to populate."
              : "No analysis has been run yet. Click \"Run Demo PR\" to populate agent outputs.";
          agentOutputEl.innerHTML = `<div class="agent-output-layout">
            <div class="agent-output-summary">
              <p class="section-kicker">${esc(agent.stage)}</p>
              <h4>${esc(agent.label)}</h4>
              <div class="chip-row">${pill(enabled ? (hasRun ? "no output" : "awaiting run") : "disabled", enabled ? "info" : "disabled")}</div>
              <p>${esc(agent.description)}</p>
            </div>
            <div class="agent-output-json">
              <p class="muted" style="padding: 1rem; margin: 0;">${esc(emptyMessage)}</p>
            </div>
          </div>`;
          return;
        }
        const payload = {
          agent_id: result.agent_id,
          status: result.status,
          confidence: result.confidence,
          messages: result.messages || [],
          output: result.output || {},
          trace: result.trace || []
        };
        agentOutputEl.innerHTML = `<div class="agent-output-layout">
          <div class="agent-output-summary">
            <p class="section-kicker">${esc(agent.stage)}</p>
            <h4>${esc(agent.label)}</h4>
            <div class="chip-row">
              ${pill(result.status || "completed")}
              ${result.confidence == null ? "" : pill(`${Math.round(result.confidence * 100)}% confidence`, "pass")}
            </div>
            <p>${esc((result.messages || [agent.description])[0] || agent.description)}</p>
          </div>
          <div class="agent-output-json">
            <pre>${esc(JSON.stringify(payload, null, 2))}</pre>
          </div>
        </div>`;
      }

      function startFlowAnimation() {
        stopFlowAnimation({ clearCompleted: true, rerender: false });
        const enabled = state.agents.filter((agent) => state.enabledAgents.has(agent.id));
        if (!enabled.length) return;
        let index = 0;
        state.flowCompletedAgentIds = new Set();
        state.runningAgentId = enabled[0].id;
        state.runStartedAt = Date.now();
        renderAgentWorkflow();
        state.flowTimer = window.setInterval(() => {
          const finishedAgent = enabled[index];
          if (finishedAgent) state.flowCompletedAgentIds.add(finishedAgent.id);
          index += 1;
          if (index >= enabled.length) {
            stopFlowAnimation();
            return;
          }
          state.runningAgentId = enabled[index].id;
          renderAgentWorkflow();
        }, Math.max(250, state.delayMs || 750));
      }

      function stopFlowAnimation(options = {}) {
        if (state.flowTimer) window.clearInterval(state.flowTimer);
        state.flowTimer = null;
        state.runningAgentId = null;
        if (state.runStartedAt) {
          state.lastRunElapsedMs = Date.now() - state.runStartedAt;
          state.runStartedAt = null;
        }
        if (options.clearCompleted) state.flowCompletedAgentIds = new Set();
        if (options.rerender !== false) renderAgentWorkflow();
      }

      function replayPipeline() {
        if (!state.currentRun) return;
        if (state.runningAgentId) return;
        const enabled = state.agents.filter((agent) => state.enabledAgents.has(agent.id));
        if (!enabled.length) return;
        const savedRun = state.currentRun;
        state.currentRun = null;
        state.replayInFlight = true;
        state.flowCompletedAgentIds = new Set();
        state.runStartedAt = Date.now();
        state.runningAgentId = enabled[0].id;
        renderAgentWorkflow();
        if (state.flowTimer) window.clearInterval(state.flowTimer);
        let index = 0;
        state.flowTimer = window.setInterval(() => {
          const finishedAgent = enabled[index];
          if (finishedAgent) state.flowCompletedAgentIds.add(finishedAgent.id);
          index += 1;
          if (index >= enabled.length) {
            window.clearInterval(state.flowTimer);
