<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MergeGuard Agentic Command Center</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b10;
        --bg-soft: #0e131d;
        --surface: rgba(17, 22, 34, 0.92);
        --surface-strong: #151b29;
        --surface-soft: #101722;
        --border: rgba(148, 163, 184, 0.18);
        --border-strong: rgba(148, 163, 184, 0.34);
        --text: #edf2ff;
        --text-soft: #bdc7d8;
        --muted: #7f8aa3;
        --blue: #38bdf8;
        --indigo: #818cf8;
        --green: #22c55e;
        --amber: #f59e0b;
        --red: #f43f5e;
        --violet: #a78bfa;
        --shadow: 0 18px 60px rgba(0, 0, 0, 0.38);
        --shadow-soft: 0 1px 0 rgba(255, 255, 255, 0.04) inset;
        --radius: 8px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-width: 320px;
        background:
          linear-gradient(135deg, rgba(56, 189, 248, 0.12), transparent 28%),
          linear-gradient(315deg, rgba(34, 197, 94, 0.08), transparent 24%),
          linear-gradient(180deg, #080a0f 0%, #0b111a 48%, #090b10 100%);
        color: var(--text);
        font: 14px/1.48 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        background-image:
          linear-gradient(rgba(148, 163, 184, 0.07) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.07) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: linear-gradient(to bottom, black, transparent 82%);
      }

      button,
      select {
        font: inherit;
      }

      button {
        color: inherit;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }

      a {
        color: var(--blue);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        min-height: 68px;
        padding: 12px 22px;
        border-bottom: 1px solid var(--border);
        background: rgba(9, 11, 16, 0.82);
        backdrop-filter: blur(18px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background:
          linear-gradient(135deg, var(--blue), var(--green) 52%, var(--amber));
        box-shadow: 0 0 24px rgba(56, 189, 248, 0.34);
      }

      .brand h1 {
        margin: 0;
        font-size: 16px;
        line-height: 1.1;
      }

      .brand p {
        margin: 2px 0 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .nav-links {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .nav-links a {
        padding: 7px 10px;
        border-radius: 7px;
        color: var(--text-soft);
        font-size: 13px;
        font-weight: 650;
        text-decoration: none;
      }

      .nav-links a:hover {
        background: rgba(148, 163, 184, 0.1);
        color: var(--text);
      }

      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 38px;
        padding: 0 14px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: rgba(21, 27, 41, 0.92);
        color: var(--text);
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      }

      .button:hover {
        transform: translateY(-1px);
        border-color: rgba(56, 189, 248, 0.58);
        background: rgba(24, 33, 50, 0.95);
      }

      .button:disabled {
        cursor: wait;
        opacity: 0.64;
        transform: none;
      }

      .button-primary {
        border-color: rgba(34, 197, 94, 0.45);
        background: linear-gradient(135deg, #0891b2, #16a34a);
        color: white;
        box-shadow: 0 12px 30px rgba(22, 163, 74, 0.18);
      }

      .shell {
        display: grid;
        gap: 16px;
        width: min(1480px, 100%);
        margin: 0 auto;
        padding: 18px;
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 420px);
        gap: 16px;
        align-items: stretch;
      }

      .hero-panel,
      .risk-panel,
      .panel,
      .metric,
      .queue-card,
      .review-card,
      .agent-card,
      .empty-state,
      .error {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        box-shadow: var(--shadow-soft), var(--shadow);
      }

      .hero-panel {
        position: relative;
        overflow: hidden;
        min-height: 214px;
        padding: 24px;
      }

      .hero-panel::after {
        position: absolute;
        right: 0;
        bottom: 0;
        width: 58%;
        height: 1px;
        content: "";
        background: linear-gradient(90deg, transparent, var(--blue), var(--green));
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--blue);
        font-size: 12px;
        font-weight: 850;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .hero-title {
        max-width: 780px;
        margin: 0;
        font-size: clamp(28px, 5vw, 54px);
        line-height: 1;
        letter-spacing: 0;
      }

      .hero-copy {
        max-width: 780px;
        margin: 14px 0 0;
        color: var(--text-soft);
        font-size: 15px;
      }

      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }

      .risk-panel {
        display: grid;
        grid-template-columns: 136px minmax(0, 1fr);
        gap: 18px;
        align-items: center;
        padding: 20px;
      }

      .risk-dial {
        --score: 0;
        width: 132px;
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background:
          conic-gradient(var(--risk-color, var(--blue)) calc(var(--score) * 1%), rgba(148, 163, 184, 0.14) 0),
          radial-gradient(circle at center, #111827 0 58%, transparent 59%);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      }

      .risk-dial-inner {
        display: grid;
        place-items: center;
        width: 92px;
        aspect-ratio: 1;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: #0a0f18;
      }

      .risk-number {
        font-size: 30px;
        font-weight: 900;
        line-height: 1;
      }

      .risk-caption {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .risk-panel h2 {
        margin: 0 0 8px;
        font-size: 22px;
      }

      .risk-panel p {
        margin: 0;
        color: var(--text-soft);
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .compact-metrics {
        width: min(620px, 100%);
      }

      .metric {
        min-height: 108px;
        padding: 15px;
      }

      .compact-metrics .metric {
        min-height: 76px;
        padding: 12px;
      }

      .compact-metrics .metric strong {
        font-size: 24px;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .metric strong {
        display: block;
        margin-top: 8px;
        font-size: 34px;
        line-height: 1;
      }

      .metric small {
        display: block;
        margin-top: 9px;
        color: var(--text-soft);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(360px, 0.78fr) minmax(0, 1.22fr);
        gap: 16px;
        align-items: start;
      }

      .queue-pane {
        position: sticky;
        top: 86px;
        display: grid;
        gap: 12px;
        min-width: 0;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 14px 0;
      }

      .panel-title {
        margin: 0;
        font-size: 14px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .filters {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
        padding: 14px;
      }

      .filters label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .filters select {
        width: 100%;
        min-height: 36px;
        border: 1px solid var(--border);
        border-radius: 7px;
        background: #0b111a;
        color: var(--text);
        outline: none;
      }

      .queue-list {
        display: grid;
        gap: 10px;
        max-height: calc(100vh - 280px);
        min-height: 320px;
        overflow: auto;
        padding: 0 14px 14px;
      }

      .pr-list-panel {
        display: grid;
        gap: 14px;
        padding: 18px;
      }

      .page-heading,
      .pr-list-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
      }

      .page-heading h2 {
        margin: 0;
        font-size: clamp(28px, 4vw, 44px);
        line-height: 1;
      }

      .page-heading .muted {
        max-width: 680px;
        margin: 10px 0 0;
        font-size: 14px;
      }

      .pr-list {
        max-height: none;
        min-height: 160px;
        overflow: visible;
        padding: 0;
      }

      .pr-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(120px, 190px) auto;
        gap: 16px;
        align-items: center;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(12, 18, 28, 0.86);
        box-shadow: var(--shadow-soft);
      }

      .pr-row-main {
        min-width: 0;
      }

      .pr-row-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .pr-title-line {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .pr-title-line h3 {
        margin: 0;
        overflow-wrap: anywhere;
        font-size: 16px;
      }

      .pr-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      .small-button {
        min-height: 34px;
        padding: 0 11px;
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        background: rgba(21, 27, 41, 0.94);
        color: var(--text);
        font-size: 12px;
        font-weight: 850;
        cursor: pointer;
      }

      .small-button:hover {
        border-color: rgba(56, 189, 248, 0.58);
      }

      .small-button.primary {
        border-color: rgba(56, 189, 248, 0.48);
        background: linear-gradient(135deg, rgba(14, 116, 144, 0.94), rgba(37, 99, 235, 0.88));
      }

      .small-button.success {
        border-color: rgba(34, 197, 94, 0.46);
        background: rgba(22, 101, 52, 0.66);
      }

      .small-button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      .queue-card {
        width: 100%;
        padding: 13px;
        text-align: left;
        cursor: pointer;
        transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      }

      .queue-card:hover,
      .queue-card.selected {
        transform: translateY(-1px);
        border-color: rgba(56, 189, 248, 0.5);
        background: rgba(19, 29, 45, 0.98);
      }

      .queue-card.selected {
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.34), var(--shadow);
      }

      .queue-card-top,
      .review-card-top,
      .agent-card-top {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .queue-title {
        margin: 0;
        color: var(--text);
        font-size: 14px;
        font-weight: 850;
      }

      .queue-subtitle,
      .muted {
        color: var(--muted);
        font-size: 12px;
      }

      .queue-action {
        margin: 10px 0 0;
        color: var(--text-soft);
        font-size: 12px;
      }

      .score-stack {
        display: grid;
        gap: 6px;
        min-width: 80px;
      }

      .score-number {
        font-size: 22px;
        font-weight: 950;
        line-height: 1;
        text-align: right;
      }

      .score-track {
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.16);
      }

      .score-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--blue), var(--green));
      }

      .score-fill.hot {
        background: linear-gradient(90deg, var(--amber), var(--red));
      }

      .score-fill.mid {
        background: linear-gradient(90deg, var(--blue), var(--amber));
      }

      .detail-pane {
        display: grid;
        gap: 12px;
        min-width: 0;
      }

      .detail-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        padding: 18px;
      }

      .detail-hero h2 {
        margin: 0;
        font-size: clamp(20px, 3vw, 32px);
        line-height: 1.08;
      }

      .detail-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .summary-strip {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 16px;
      }

      .summary-item {
        min-height: 78px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(12, 18, 28, 0.76);
      }

      .summary-item span {
        display: block;
        color: var(--muted);
        font-size: 11px;
        font-weight: 850;
        text-transform: uppercase;
      }

      .summary-item strong {
        display: block;
        margin-top: 6px;
        color: var(--text);
        font-size: 14px;
      }

      .agent-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .dashboard-tabs-panel {
        padding: 0;
        overflow: hidden;
      }

      .dashboard-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 12px;
        border-bottom: 1px solid var(--border);
        background: rgba(9, 13, 21, 0.76);
      }

      .dashboard-tab {
        display: inline-flex;
        flex: 0 0 auto;
        align-items: center;
        gap: 8px;
        min-height: 36px;
        padding: 0 12px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: rgba(148, 163, 184, 0.08);
        color: var(--text-soft);
        font-size: 12px;
        font-weight: 850;
        cursor: pointer;
      }

      .dashboard-tab:hover {
        border-color: rgba(56, 189, 248, 0.36);
        color: var(--text);
      }

      .dashboard-tab.active {
        border-color: rgba(56, 189, 248, 0.58);
        background: rgba(56, 189, 248, 0.13);
        color: var(--text);
      }

      .dashboard-tab small {
        min-width: 22px;
        padding: 2px 6px;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.16);
        color: #bae6fd;
        text-align: center;
      }

      .dashboard-tab-body {
        max-height: min(68vh, 760px);
        overflow: auto;
        padding: 16px;
      }

      .tab-panel-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 14px;
        margin-bottom: 14px;
      }

      .tab-panel-head h3 {
        margin-bottom: 4px;
      }

      .tab-panel-head p {
        max-width: 760px;
        margin: 0;
      }

      .tab-section {
        display: grid;
        gap: 12px;
      }

      .tab-section + .tab-section {
        margin-top: 16px;
      }

      .agent-workflow-panel {
        display: grid;
        gap: 14px;
      }

      .workflow-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        flex-wrap: wrap;
      }

      .delay-control {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: min(340px, 100%);
        color: var(--text-soft);
        font-size: 12px;
        font-weight: 800;
      }

      .delay-control input {
        width: min(220px, 42vw);
        accent-color: var(--blue);
      }

      .agent-flow-shell {
        display: grid;
        gap: 12px;
      }

      .agent-flow-canvas {
        position: relative;
        min-height: 560px;
        overflow: hidden;
        padding: 24px;
        border: 1px dashed rgba(148, 163, 184, 0.22);
        border-radius: 8px;
        background:
          radial-gradient(circle, rgba(148, 163, 184, 0.16) 1px, transparent 1px),
          rgba(5, 10, 18, 0.46);
        background-size: 24px 24px;
      }

      .flow-step {
        position: absolute;
        left: var(--x);
        top: var(--y);
        z-index: 2;
        display: grid;
        justify-items: center;
        width: 148px;
        transform: translate(-50%, -50%);
      }

      .flow-lines {
        position: absolute;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .flow-line {
        stroke: rgba(148, 163, 184, 0.28);
        stroke-width: 2.4;
        stroke-dasharray: 7 9;
        stroke-linecap: round;
      }

      .flow-line.completed {
        stroke: rgba(34, 197, 94, 0.62);
        stroke-dasharray: 0;
      }

      .flow-line.failed {
        stroke: rgba(244, 63, 94, 0.7);
        stroke-dasharray: 0;
      }

      .flow-line.active {
        stroke: rgba(56, 189, 248, 0.86);
        animation: flowDash 0.9s linear infinite;
      }

      .flow-line.disabled,
      .flow-line.skipped {
        stroke: rgba(148, 163, 184, 0.17);
      }

      @keyframes flowDash {
        to {
          stroke-dashoffset: -32;
        }
      }

      .mergeguard-hub {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 188px;
        min-height: 132px;
        padding: 16px;
        border: 1px solid rgba(56, 189, 248, 0.54);
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(8, 145, 178, 0.32), rgba(22, 163, 74, 0.18)),
          rgba(12, 18, 28, 0.98);
        box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.12), 0 18px 48px rgba(0, 0, 0, 0.32);
        text-align: center;
        transform: translate(-50%, -50%);
      }

      .hub-mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        margin-bottom: 10px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--blue), var(--green));
        color: #031018;
        font-size: 16px;
        font-weight: 950;
      }

      .hub-label {
        color: var(--text);
        font-size: 15px;
        font-weight: 950;
      }

      .hub-caption {
        margin-top: 4px;
        color: var(--text-soft);
        font-size: 12px;
      }

      .flow-node {
        display: grid;
        justify-items: center;
        gap: 8px;
        width: 100%;
        transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
      }

      .flow-node-main {
        display: grid;
        place-items: center;
        width: 74px;
        height: 74px;
        padding: 0;
        border: 2px solid rgba(148, 163, 184, 0.32);
        border-radius: 50%;
        background: rgba(12, 18, 28, 0.96);
        color: inherit;
        cursor: pointer;
        box-shadow: var(--shadow-soft), 0 14px 38px rgba(0, 0, 0, 0.24);
      }

      .flow-node.completed .flow-node-main {
        border-color: rgba(34, 197, 94, 0.82);
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1), var(--shadow-soft);
      }

      .flow-node.failed .flow-node-main {
        border-color: rgba(244, 63, 94, 0.9);
        box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.12), var(--shadow-soft);
      }

      .flow-node.active .flow-node-main {
        border-color: rgba(56, 189, 248, 0.92);
        background: rgba(16, 35, 31, 0.96);
        box-shadow: 0 0 0 5px rgba(56, 189, 248, 0.12), var(--shadow-soft);
        transform: translateY(-2px);
      }

      .flow-node.selected .flow-node-main {
        outline: 2px solid rgba(56, 189, 248, 0.52);
        outline-offset: 5px;
      }

      .flow-node.skipped,
      .flow-node.disabled {
        opacity: 0.56;
      }

      .agent-icon {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border-radius: 8px;
        background: rgba(56, 189, 248, 0.13);
        color: #bae6fd;
        font-size: 13px;
        font-weight: 950;
      }

      .agent-icon.intent {
        background: rgba(129, 140, 248, 0.16);
        color: #c7d2fe;
      }

      .agent-icon.behavior {
        background: rgba(245, 158, 11, 0.16);
        color: #fde68a;
      }

      .agent-icon.concepts {
        background: rgba(167, 139, 250, 0.17);
        color: #ddd6fe;
      }

      .agent-icon.policy {
        background: rgba(244, 63, 94, 0.16);
        color: #fecdd3;
      }

      .agent-icon.prompt {
        background: rgba(14, 165, 233, 0.16);
        color: #bae6fd;
      }

      .agent-icon.contracts {
        background: rgba(34, 197, 94, 0.15);
        color: #bbf7d0;
      }

      .agent-icon.evidence {
        background: rgba(20, 184, 166, 0.16);
        color: #99f6e4;
      }

      .agent-icon.report {
        background: rgba(248, 113, 113, 0.16);
        color: #fecaca;
      }

      .flow-caption {
        display: grid;
        justify-items: center;
        gap: 4px;
        min-width: 0;
        text-align: center;
      }

      .flow-stage {
        color: var(--muted);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .flow-label {
        min-height: 0;
        color: var(--text);
        font-size: 12px;
        font-weight: 900;
        line-height: 1.15;
      }

      .flow-description {
        display: none;
      }

      .flow-status {
        display: flex;
        justify-content: center;
      }

      .flow-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 2px;
      }

      .agent-output {
        min-height: 230px;
        max-height: 460px;
        overflow: auto;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(7, 11, 17, 0.72);
      }

      .agent-output-layout {
        display: grid;
        grid-template-columns: minmax(220px, 0.42fr) minmax(0, 1fr);
        gap: 14px;
      }

      .agent-output-summary {
        display: grid;
        align-content: start;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: rgba(12, 18, 28, 0.78);
      }

      .agent-output-summary h4 {
        margin: 0;
        font-size: 18px;
      }

      .agent-output-summary p {
        margin: 0;
        color: var(--text-soft);
        font-size: 12px;
      }

      .agent-output-json {
        min-width: 0;
      }

      .switch {
        position: relative;
        display: inline-flex;
        align-items: center;
        width: 42px;
        height: 24px;
      }

      .switch input {
        position: absolute;
        opacity: 0;
      }

      .switch span {
        width: 42px;
        height: 24px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.13);
        cursor: pointer;
        transition: background 0.16s ease, border-color 0.16s ease;
      }

      .switch span::after {
        position: absolute;
        top: 4px;
        left: 4px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        content: "";
        background: var(--muted);
        transition: transform 0.16s ease, background 0.16s ease;
      }

      .switch input:checked + span {
        border-color: rgba(34, 197, 94, 0.42);
        background: rgba(34, 197, 94, 0.18);
      }

      .switch input:checked + span::after {
        transform: translateX(18px);
        background: var(--green);
      }

      .agent-output h4 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      .agent-output pre {
        margin: 12px 0 0;
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 8px;
        background: #05070b;
        color: #dbeafe;
        font-size: 12px;
        white-space: pre-wrap;
      }

      .agent-card,
      .review-card {
        padding: 13px;
      }

      .agent-card code {
        display: block;
        overflow-wrap: anywhere;
        color: var(--text);
        font-size: 12px;
        font-weight: 800;
      }

      .agent-card p {
        margin: 8px 0 0;
        color: var(--text-soft);
        font-size: 12px;
      }

      .confidence {
        color: var(--green);
        font-size: 12px;
        font-weight: 900;
      }

      .review-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .review-card h4 {
        margin: 0;
        overflow-wrap: anywhere;
        font-size: 13px;
      }

      .review-card p {
        margin: 8px 0 0;
        color: var(--text-soft);
        font-size: 12px;
      }

      .review-card .muted {
        margin-top: 8px;
      }

      .panel {
        padding: 16px;
      }

      .panel h3 {
        margin: 0 0 12px;
        font-size: 16px;
      }

      .section-kicker {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 850;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip,
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 24px;
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.1);
        color: var(--text-soft);
        font-size: 11px;
        font-weight: 850;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .pill-blocked,
      .pill-block,
      .pill-failure,
      .pill-fail,
      .pill-analysis_failed,
      .pill-failed {
        border-color: rgba(244, 63, 94, 0.42);
        background: rgba(244, 63, 94, 0.13);
        color: #fecdd3;
      }

      .pill-review,
      .pill-review_required,
      .pill-warn,
      .pill-neutral {
        border-color: rgba(245, 158, 11, 0.42);
        background: rgba(245, 158, 11, 0.13);
        color: #fde68a;
      }

      .pill-pass,
      .pill-completed,
      .pill-success {
        border-color: rgba(34, 197, 94, 0.4);
        background: rgba(34, 197, 94, 0.12);
        color: #bbf7d0;
      }

      .pill-running,
      .pill-info {
        border-color: rgba(56, 189, 248, 0.42);
        background: rgba(56, 189, 248, 0.12);
        color: #bae6fd;
      }

      .pill-queued,
      .pill-unknown {
        border-color: rgba(167, 139, 250, 0.42);
        background: rgba(167, 139, 250, 0.12);
        color: #ddd6fe;
      }

      .empty-state,
      .error {
        min-height: 220px;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text-soft);
        text-align: center;
      }

      .error {
        min-height: auto;
        border-color: rgba(244, 63, 94, 0.42);
        color: #fecdd3;
      }

      .comment-box {
        max-height: 360px;
        overflow: auto;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #070b11;
        color: var(--text-soft);
        white-space: pre-wrap;
      }

      .bar-list {
        display: grid;
        gap: 8px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: minmax(110px, 180px) 1fr 34px;
        gap: 10px;
        align-items: center;
        color: var(--text-soft);
        font-size: 12px;
      }

      .bar-track {
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.14);
      }

      .bar-fill {
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--indigo), var(--blue), var(--green));
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 1180px) {
        .hero,
        .workspace {
          grid-template-columns: 1fr;
        }

        .queue-pane {
          position: static;
        }

        .queue-list {
          max-height: none;
        }
      }

      @media (max-width: 820px) {
        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .nav-links {
          overflow-x: auto;
          width: 100%;
          padding-bottom: 2px;
        }

        .topbar-actions {
          width: 100%;
        }

        .topbar-actions .button {
          flex: 1;
        }

        .shell {
          padding: 12px;
        }

        .hero-panel,
        .risk-panel,
        .detail-hero,
        .panel {
          padding: 14px;
        }

        .risk-panel,
        .detail-hero,
        .summary-strip,
        .metrics,
        .filters,
        .pr-row,
        .agent-flow-shell,
        .agent-grid,
        .agent-output-layout,
        .review-grid {
          grid-template-columns: 1fr;
        }

        .pr-row-actions {
          justify-content: flex-start;
        }

        .agent-flow-canvas {
          min-height: 680px;
        }

        .flow-step {
          width: 118px;
        }

        .flow-node-main {
          width: 62px;
          height: 62px;
        }

        .agent-icon {
          width: 38px;
          height: 38px;
          font-size: 12px;
        }

        .mergeguard-hub {
          width: 150px;
          min-height: 112px;
        }

        .tab-panel-head {
          flex-direction: column;
        }

        .risk-dial {
          width: 118px;
        }

        .bar-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <h1>MergeGuard</h1>
          <p>Agentic command center</p>
        </div>
      </div>
      <nav class="nav-links" aria-label="Dashboard sections">
        <a href="#queue-panel">Pull requests</a>
        <a href="#agent-workflow-panel">Agent run</a>
        <a href="#detail-pane">Dashboard</a>
      </nav>
      <div class="topbar-actions">
        <button id="refresh-button" class="button" type="button">Refresh</button>
        <button id="run-demo" class="button button-primary" type="button">Run Demo PR</button>
      </div>
    </header>

    <main class="shell">
      <section id="queue-panel" class="panel pr-list-panel" aria-label="Pull request list">
        <div class="page-heading">
          <div>
            <p class="eyebrow">Live PR intake</p>
            <h2>Pull requests</h2>
            <p class="muted">New PR analyses appear here automatically. Choose a PR, run agents, then open the dashboard.</p>
          </div>
          <section id="metrics" class="metrics compact-metrics" aria-label="Metrics"></section>
        </div>
        <form id="filters" class="filters">
          <label>
            Repo
            <select name="repo" id="repo-filter">
              <option value="">All repos</option>
            </select>
          </label>
          <label>
            Owner
            <select name="owner" id="owner-filter">
              <option value="">All owners</option>
            </select>
          </label>
          <label>
            State
            <select name="risk_state" id="state-filter">
              <option value="">All states</option>
              <option value="pass">Pass</option>
              <option value="review">Review</option>
              <option value="blocked">Blocked</option>
              <option value="analysis_failed">Analysis failed</option>
            </select>
          </label>
        </form>
        <div class="pr-list-header">
          <h3 class="panel-title">PR queue</h3>
          <span id="queue-count" class="pill pill-info">0 PRS</span>
        </div>
        <div id="queue-list" class="queue-list pr-list"></div>
      </section>

      <section id="agent-workflow-panel" class="panel agent-workflow-panel hidden" aria-label="Agent workflow">
        <div class="workflow-toolbar">
          <div>
            <p class="section-kicker">Agent workflow</p>
            <h3 id="workflow-title" class="panel-title">Available agents</h3>
            <p id="workflow-subtitle" class="muted">Toggle agents, then analyze a PR to watch the flow.</p>
          </div>
          <label class="delay-control">
            Execution gap
            <input id="agent-delay" type="range" min="0" max="2000" step="250" value="750" />
            <span id="agent-delay-value">750ms</span>
          </label>
        </div>
        <div class="agent-flow-shell">
          <div id="agent-flow" class="agent-flow-canvas"></div>
          <aside id="agent-output" class="agent-output"></aside>
        </div>
      </section>

      <section id="detail-pane" class="detail-pane hidden" aria-label="Pull request dashboard"></section>
    </main>

    <script type="module">
      const state = {
        rows: [],
        selectedRunId: null,
        selectedPrId: null,
        selectedDetailTab: "overview",
        activeAnalysisPrId: null,
        currentRun: null,
        agents: [],
        enabledAgents: new Set(),
        selectedAgentId: null,
        runningAgentId: null,
        flowTimer: null,
        delayMs: 750,
        filters: { repo: "", owner: "", risk_state: "" }
      };

      const agentPositions = [
        { x: 12, y: 22 },
        { x: 30, y: 12 },
        { x: 50, y: 14 },
        { x: 70, y: 12 },
        { x: 88, y: 22 },
        { x: 16, y: 78 },
        { x: 38, y: 86 },
        { x: 62, y: 86 },
        { x: 84, y: 78 }
      ];

      const agentVisuals = {
        "review-compression": { icon: "RC", tone: "hotspots" },
        "intent-extractor": { icon: "IN", tone: "intent" },
        "semantic-diff-explainer": { icon: "SD", tone: "behavior" },
        "concept-classifier": { icon: "CC", tone: "concepts" },
        "policy-gate": { icon: "PG", tone: "policy" },
        "prompt-canary": { icon: "PC", tone: "prompt" },
        "contract-comparator": { icon: "CT", tone: "contracts" },
        "evidence-mapper": { icon: "EV", tone: "evidence" },
        "truth-report-synthesizer": { icon: "TR", tone: "report" }
      };

      const metricsEl = document.querySelector("#metrics");
      const queueListEl = document.querySelector("#queue-list");
      const detailEl = document.querySelector("#detail-pane");
      const repoFilterEl = document.querySelector("#repo-filter");
      const ownerFilterEl = document.querySelector("#owner-filter");
      const stateFilterEl = document.querySelector("#state-filter");
      const runButton = document.querySelector("#run-demo");
      const refreshButton = document.querySelector("#refresh-button");
      const queueCountEl = document.querySelector("#queue-count");
      const workflowPanelEl = document.querySelector("#agent-workflow-panel");
      const workflowTitleEl = document.querySelector("#workflow-title");
      const workflowSubtitleEl = document.querySelector("#workflow-subtitle");
      const agentFlowEl = document.querySelector("#agent-flow");
      const agentOutputEl = document.querySelector("#agent-output");
      const agentDelayEl = document.querySelector("#agent-delay");
      const agentDelayValueEl = document.querySelector("#agent-delay-value");

      runButton.addEventListener("click", runDemo);
      refreshButton.addEventListener("click", () => loadQueue());
      agentDelayEl.addEventListener("input", () => {
        state.delayMs = Number(agentDelayEl.value);
        agentDelayValueEl.textContent = `${state.delayMs}ms`;
      });
      document.querySelector("#filters").addEventListener("change", (event) => {
        state.filters[event.target.name] = event.target.value;
        loadQueue();
      });

      await loadAgents();
      await loadQueue();
      window.setInterval(() => loadQueue({ preserveView: true }), 3000);

      async function loadAgents() {
        const data = await fetchJson("/api/agents");
        state.agents = data.agents || [];
        state.enabledAgents = new Set(state.agents.map((agent) => agent.id));
        state.selectedAgentId = state.agents[0]?.id || null;
        renderAgentWorkflow();
      }

      async function runDemo() {
        const previous = runButton.textContent;
        runButton.disabled = true;
        runButton.textContent = "Running...";
        workflowPanelEl.classList.remove("hidden");
        detailEl.classList.add("hidden");
        updateWorkflowHeader("Analyzing demo PR", "Invoking enabled agents with visible execution gaps.");
        startFlowAnimation();
        try {
          const response = await fetch("/api/demo/analyze", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              enabled_agents: [...state.enabledAgents],
              agent_delay_ms: state.delayMs
            })
          });
          const data = await response.json();
          if (data.run) {
            state.selectedRunId = data.run.id;
            state.selectedPrId = data.run.pull_request_id;
            state.currentRun = data.run;
            updateWorkflowHeader("Agent run complete", "Use Show details in the PR list to open the dashboard.");
            renderAgentWorkflow(data.run);
          }
          await loadQueue({ preferredRunId: data.run?.id });
          if (!response.ok) {
            throw new Error(data.run?.summary?.next_action || data.error || "Demo analysis failed");
          }
        } catch (error) {
          detailEl.insertAdjacentHTML("afterbegin", `<div class="error">${esc(error.message || error)}</div>`);
        } finally {
          stopFlowAnimation();
          runButton.disabled = false;
          runButton.textContent = previous;
        }
      }

      async function loadQueue(options = {}) {
        const data = await fetchJson("/api/queue");
        state.rows = data.queue || [];
        renderMetrics(data.metrics || {});
        renderFilters();

        const selectedRow = chooseSelectedRow(options.preferredRunId);
        if (options.preferredRunId && selectedRow?.latest_run) {
          state.selectedRunId = selectedRow.latest_run.id;
          state.selectedPrId = selectedRow.pull_request.id;
        }

        renderQueue();
      }

      function chooseSelectedRow(preferredRunId) {
        if (preferredRunId) {
          const hit = state.rows.find((row) => row.latest_run?.id === preferredRunId);
          if (hit) return hit;
        }
        if (state.selectedRunId) {
          const hit = state.rows.find((row) => row.latest_run?.id === state.selectedRunId);
          if (hit) return hit;
        }
        if (state.selectedPrId) {
          const hit = state.rows.find((row) => row.pull_request?.id === state.selectedPrId);
          if (hit) return hit;
        }
        return state.rows[0];
      }

      function renderMetrics(metrics) {
        const open = metrics.open_prs || 0;
        const runs = metrics.analysis_runs || 0;
        const blocked = metrics.blocked || 0;
        const high = metrics.high_risk || 0;
        const execs = metrics.agent_executions || 0;
        metricsEl.innerHTML = [
          metric("Open PRs", open, `${blocked} blocked`),
          metric("Analysis runs", runs, `${metrics.completed_runs || 0} completed`),
          metric("High risk", high, "risk >= 65"),
          metric("Agent execs", execs, "independent runs")
        ].join("");
      }

      function renderFilters() {
        const repos = unique(state.rows.map((row) => row.pull_request?.repository?.full_name).filter(Boolean));
        const owners = unique(
          state.rows
            .flatMap((row) => {
              const summary = row.latest_run?.summary || {};
              return [
                row.pull_request?.author,
                ...(summary.owner_summary || []).map((owner) => owner.owner)
              ];
            })
            .filter(Boolean)
        );
        updateSelect(repoFilterEl, repos, "All repos", state.filters.repo);
        updateSelect(ownerFilterEl, owners, "All owners", state.filters.owner);
        stateFilterEl.value = state.filters.risk_state || "";
      }

      function renderQueue() {
        const rows = filteredRows();
        queueCountEl.textContent = `${rows.length} PR${rows.length === 1 ? "" : "S"}`;
        if (!rows.length) {
          queueListEl.innerHTML = `<div class="empty-state">No analyzed pull requests match this scope.</div>`;
          return;
        }
        queueListEl.innerHTML = rows.map(queueCard).join("");
        for (const button of queueListEl.querySelectorAll("[data-action='analyze']")) {
          button.addEventListener("click", () => analyzePr(button.dataset.prId));
        }
        for (const button of queueListEl.querySelectorAll("[data-action='details']")) {
          button.addEventListener("click", () => showDetails(button.dataset.runId));
        }
      }

      async function analyzePr(prId) {
        const row = state.rows.find((item) => item.pull_request?.id === prId);
        if (!row) return;
        const pr = row.pull_request;
        state.activeAnalysisPrId = prId;
        state.selectedPrId = prId;
        state.selectedRunId = null;
        state.currentRun = null;
        workflowPanelEl.classList.remove("hidden");
        detailEl.classList.add("hidden");
        updateWorkflowHeader(
          `Analyzing #${pr.number}`,
          `${pr.repository?.full_name || "repository"} / ${pr.title || "Untitled PR"}`
        );
        startFlowAnimation();
        renderQueue();
        try {
          const response = await fetch(`/api/prs/${encodeURIComponent(prId)}/analyze`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              enabled_agents: [...state.enabledAgents],
              agent_delay_ms: state.delayMs
            })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "PR analysis failed");
          state.selectedRunId = data.run.id;
          state.currentRun = data.run;
          updateWorkflowHeader("Agent run complete", "Show details is now available in the PR list.");
          renderAgentWorkflow(data.run);
          await loadQueue({ preferredRunId: data.run.id });
        } catch (error) {
          agentOutputEl.innerHTML = `<div class="error">${esc(error.message || error)}</div>`;
        } finally {
          state.activeAnalysisPrId = null;
          stopFlowAnimation();
          renderQueue();
        }
      }

      async function showDetails(runId) {
        if (!runId) return;
        const payload = await fetchJson(`/api/runs/${encodeURIComponent(runId)}`);
        state.selectedRunId = runId;
        state.selectedPrId = payload.run?.pull_request_id || null;
        state.selectedDetailTab = "overview";
        workflowPanelEl.classList.add("hidden");
        detailEl.classList.remove("hidden");
        renderDetail(payload.run);
        detailEl.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function renderAgentWorkflow(run = state.currentRun) {
        if (!state.agents.length) {
          agentFlowEl.innerHTML = `<div class="empty-state">Loading agents.</div>`;
          agentOutputEl.innerHTML = `<p class="muted">No agent selected.</p>`;
          return;
        }

        agentFlowEl.innerHTML = `
          ${flowLineSvg(run)}
          <div class="mergeguard-hub" aria-label="MergeGuard Tool">
            <div class="hub-mark">MG</div>
            <div class="hub-label">MergeGuard Tool</div>
            <div class="hub-caption">orchestrates agent evidence</div>
          </div>
          ${state.agents.map((agent, index) => flowStep(agent, run, index)).join("")}
        `;
        for (const button of agentFlowEl.querySelectorAll(".flow-node-main")) {
          button.addEventListener("click", () => {
            state.selectedAgentId = button.dataset.agentId;
            renderAgentWorkflow();
          });
        }
        for (const toggle of agentFlowEl.querySelectorAll(".agent-toggle")) {
          toggle.addEventListener("change", () => {
            if (toggle.checked) state.enabledAgents.add(toggle.dataset.agentId);
            else state.enabledAgents.delete(toggle.dataset.agentId);
            renderAgentWorkflow();
          });
        }
        renderAgentOutput(run);
      }

      function updateWorkflowHeader(title, subtitle) {
        workflowTitleEl.textContent = title;
        workflowSubtitleEl.textContent = subtitle;
      }

      function flowLineSvg(run) {
        return `<svg class="flow-lines" aria-hidden="true">
          ${state.agents.map((agent, index) => {
            const position = flowPosition(index);
            return `<line
              class="flow-line ${escAttr(flowVisualState(agent, run))}"
              x1="50%"
              y1="50%"
              x2="${position.x}%"
              y2="${position.y}%"></line>`;
          }).join("")}
        </svg>`;
      }

      function flowStep(agent, run, index) {
        const result = run?.agent_results?.[agent.id];
        const enabled = state.enabledAgents.has(agent.id);
        const selected = agent.id === state.selectedAgentId ? " selected" : "";
        const visualState = flowVisualState(agent, run);
        const status = result?.status || (visualState === "active" ? "running" : enabled ? "ready" : "disabled");
        const disabled = !enabled ? " disabled" : "";
        const visual = agentVisual(agent);
        const position = flowPosition(index);
        return `<div class="flow-step" style="--x:${position.x}%;--y:${position.y}%">
          <div class="flow-node ${escAttr(visualState)}${selected}${disabled}">
            <button class="flow-node-main" type="button" data-agent-id="${escAttr(agent.id)}" title="${escAttr(agent.label)}">
              <span class="agent-icon ${escAttr(visual.tone)}">${esc(visual.icon)}</span>
            </button>
            <div class="flow-caption">
              <span class="flow-stage">${String(index + 1).padStart(2, "0")} / ${esc(agent.stage)}</span>
              <span class="flow-label">${esc(agent.label)}</span>
              <span class="flow-description">${esc(agent.description)}</span>
            </div>
            <div class="flow-footer">
              <span class="flow-status">${pill(status, status)}</span>
              <label class="switch" title="Enable ${escAttr(agent.label)}">
                <input class="agent-toggle" type="checkbox" data-agent-id="${escAttr(agent.id)}" ${enabled ? "checked" : ""} />
                <span aria-hidden="true"></span>
              </label>
            </div>
          </div>
        </div>`;
      }

      function flowVisualState(agent, run) {
        const result = run?.agent_results?.[agent.id];
        if (!state.enabledAgents.has(agent.id)) return "disabled";
        if (agent.id === state.runningAgentId) return "active";
        const status = String(result?.status || "").toLowerCase();
        if (["failed", "failure", "error"].includes(status)) return "failed";
        if (status === "skipped") return "skipped";
        if (status) return "completed";
        return "ready";
      }

      function flowPosition(index) {
        return agentPositions[index % agentPositions.length];
      }

      function agentVisual(agent) {
        return agentVisuals[agent.id] || { icon: agent.label.slice(0, 2).toUpperCase(), tone: "hotspots" };
      }

      function renderAgentOutput(run = state.currentRun) {
        const agent = state.agents.find((item) => item.id === state.selectedAgentId) || state.agents[0];
        if (!agent) {
          agentOutputEl.innerHTML = `<p class="muted">No agent selected.</p>`;
          return;
        }
        const result = run?.agent_results?.[agent.id];
        const enabled = state.enabledAgents.has(agent.id);
        if (!result) {
          agentOutputEl.innerHTML = `<div class="agent-output-layout">
            <div class="agent-output-summary">
              <p class="section-kicker">${esc(agent.stage)}</p>
              <h4>${esc(agent.label)}</h4>
              <div class="chip-row">${pill(enabled ? "ready" : "disabled", enabled ? "info" : "disabled")}</div>
              <p>${esc(agent.description)}</p>
            </div>
            <div class="agent-output-json">
              <pre>${esc(JSON.stringify({ agent_id: agent.id, status: enabled ? "ready" : "disabled" }, null, 2))}</pre>
            </div>
          </div>`;
          return;
        }
        const payload = {
          agent_id: result.agent_id,
          status: result.status,
          confidence: result.confidence,
          messages: result.messages || [],
          output: result.output || {},
          trace: result.trace || []
        };
        agentOutputEl.innerHTML = `<div class="agent-output-layout">
          <div class="agent-output-summary">
            <p class="section-kicker">${esc(agent.stage)}</p>
            <h4>${esc(agent.label)}</h4>
            <div class="chip-row">
              ${pill(result.status || "completed")}
              ${result.confidence == null ? "" : pill(`${Math.round(result.confidence * 100)}% confidence`, "pass")}
            </div>
            <p>${esc((result.messages || [agent.description])[0] || agent.description)}</p>
          </div>
          <div class="agent-output-json">
            <pre>${esc(JSON.stringify(payload, null, 2))}</pre>
          </div>
        </div>`;
      }

      function startFlowAnimation() {
        stopFlowAnimation();
        const enabled = state.agents.filter((agent) => state.enabledAgents.has(agent.id));
        if (!enabled.length) return;
        let index = 0;
        state.runningAgentId = enabled[0].id;
        renderAgentWorkflow();
        state.flowTimer = window.setInterval(() => {
          index += 1;
          if (index >= enabled.length) {
            stopFlowAnimation();
            return;
          }
          state.runningAgentId = enabled[index].id;
          renderAgentWorkflow();
        }, Math.max(250, state.delayMs || 750));
      }

      function stopFlowAnimation() {
        if (state.flowTimer) window.clearInterval(state.flowTimer);
        state.flowTimer = null;
        state.runningAgentId = null;
        renderAgentWorkflow();
      }

      function filteredRows() {
        return state.rows.filter((row) => {
          const pr = row.pull_request || {};
          const summary = row.latest_run?.summary || {};
          const repo = pr.repository?.full_name || "";
          if (state.filters.repo && repo !== state.filters.repo) return false;
          if (state.filters.owner) {
            const owners = [
              pr.author,
              ...(summary.owner_summary || []).map((owner) => owner.owner)
            ];
            if (!owners.includes(state.filters.owner)) return false;
          }
          if (state.filters.risk_state && summary.status !== state.filters.risk_state) return false;
          return true;
        });
      }

      function queueCard(row) {
        const pr = row.pull_request || {};
        const run = row.latest_run || {};
        const summary = run.summary || {};
        const score = numericScore(summary.risk_score);
        const status = summary.status || run.state || "queued";
        const tone = score >= 70 ? "hot" : score >= 40 ? "mid" : "";
        const analyzing = state.activeAnalysisPrId === pr.id;
        const canShowDetails = run.id && ["completed", "failed"].includes(run.state);
        return `<article class="pr-row" data-pr-id="${escAttr(pr.id || "")}">
          <div class="pr-row-main">
            <div class="pr-title-line">
              <h3>#${esc(pr.number || "")} ${esc(pr.title || "Untitled PR")}</h3>
            </div>
            <div class="pr-meta">
              <span class="muted">${esc(pr.repository?.full_name || "")}</span>
              <span class="muted">${esc(pr.author || "unknown")}</span>
              ${pill(status)}
              ${pill(`${Object.keys(run.agent_results || {}).length} agents`, "info")}
            </div>
            <p class="queue-action">${esc(summary.next_action || "No analysis has run yet.")}</p>
          </div>
          <div class="score-stack">
            <div class="score-number">${scoreLabel(summary.risk_score)}</div>
            <div class="score-track"><div class="score-fill ${tone}" style="width:${score}%"></div></div>
          </div>
          <div class="pr-row-actions">
            <button class="small-button primary" type="button" data-action="analyze" data-pr-id="${escAttr(pr.id || "")}" ${analyzing ? "disabled" : ""}>
              ${analyzing ? "Analyzing" : "Analyze"}
            </button>
            ${canShowDetails ? `<button class="small-button success" type="button" data-action="details" data-run-id="${escAttr(run.id)}">Show details</button>` : ""}
          </div>
        </article>`;
      }

      function renderDetail(run) {
        if (!run) return;
        state.currentRun = run;
        const summary = run.summary || {};
        const pr = run.pull_request || {};
        const score = numericScore(summary.risk_score);
        const status = summary.status || run.state || "queued";
        const agentNames = Object.keys(run.agent_results || {});
        const tabs = detailTabs(run, summary, pr, agentNames);
        const selectedTab = tabs.find((tab) => tab.id === state.selectedDetailTab) || tabs[0];
        state.selectedDetailTab = selectedTab.id;

        detailEl.innerHTML = `
          <section class="panel detail-hero">
            <div>
              <p class="section-kicker">Truth report</p>
              <h2>#${esc(pr.number || "")} ${esc(pr.title || "Untitled pull request")}</h2>
              <div class="detail-meta">
                ${pill(status)}
                ${pill(`${agentNames.length} agents`, "info")}
                ${pill(run.state || "unknown", run.state || "unknown")}
                ${pr.url ? `<a class="chip" href="${escAttr(pr.url)}" target="_blank" rel="noreferrer">Open PR</a>` : ""}
              </div>
              <div class="summary-strip">
                ${summaryItem("Repository", pr.repository?.full_name || "unknown")}
                ${summaryItem("Top blocker", summary.top_blocker || "None")}
                ${summaryItem("Next action", summary.next_action || "Analysis pending")}
              </div>
            </div>
            ${riskDial(score)}
          </section>

          <section class="panel dashboard-tabs-panel" aria-label="PR analysis detail tabs">
            <div class="dashboard-tabs" role="tablist" aria-label="PR analysis sections">
              ${tabs.map((tab) => tabButton(tab, tab.id === selectedTab.id)).join("")}
            </div>
            ${tabPanel(selectedTab)}
          </section>
        `;

        for (const button of detailEl.querySelectorAll("[data-detail-tab]")) {
          button.addEventListener("click", () => {
            state.selectedDetailTab = button.dataset.detailTab;
            renderDetail(state.currentRun);
          });
        }
      }

      function detailTabs(run, summary, pr, agentNames) {
        return [
          {
            id: "overview",
            label: "Overview",
            kicker: "Readiness",
            title: "Review posture",
            description: "The merge decision, required checks, and reviewer-facing next steps.",
            count: countItems(summary.checks),
            content: `
              <div class="tab-section">
                ${cards(summary.checks, checkCard, "No checks generated for this run.")}
              </div>
              <div class="tab-section">
                <pre class="comment-box">${esc(summary.comment || "No generated review comment yet.")}</pre>
              </div>
            `
          },
          {
            id: "agents",
            label: "Agents",
            kicker: "Execution mesh",
            title: "Independent agent outputs",
            description: "Status and confidence from each deployed MergeGuard agent.",
            count: agentNames.length,
            content: `<div class="agent-grid">${agentNames
              .map((name) => agentCard(name, run.agent_results[name]))
              .join("")}</div>`
          },
          {
            id: "review",
            label: "Review",
            kicker: "Routing",
            title: "Hotspots and owners",
            description: "Where the reviewer should spend attention first.",
            count: countItems(summary.hotspots),
            content: `
              <div class="tab-section">${barList(summary.hotspot_themes || [], "theme", "count")}</div>
              <div class="tab-section">${cards(summary.owner_summary, ownerCard, "No owner routing found.")}</div>
              <div class="tab-section">${cards(summary.hotspots, hotspotCard, "No hotspots flagged.")}</div>
            `
          },
          {
            id: "evidence",
            label: "Evidence",
            kicker: "Intent coverage",
            title: "Intent and evidence",
            description: "How PR intent maps to tests, changed files, and missing proof.",
            count: countItems(summary.evidence_links),
            content: cards(summary.evidence_links, evidenceCard, "No evidence gaps detected.")
          },
          {
            id: "behavior",
            label: "Behavior",
            kicker: "Runtime behavior",
            title: "Behavioral diff and blast radius",
            description: "Detected behavior changes and downstream impact.",
            count: countItems(summary.behavioral_deltas) + countItems(summary.blast_radius),
            content: `
              <div class="tab-section">${cards(summary.behavioral_deltas, behaviorCard, "No behavior deltas detected.")}</div>
              <div class="tab-section">${cards(summary.blast_radius, blastCard, "No blast-radius items detected.")}</div>
            `
          },
          {
            id: "gates",
            label: "Gates",
            kicker: "Policy and prompt",
            title: "Concept policies and prompt canaries",
            description: "Policy blocks, owner overrides, prompt drift, and model-output checks.",
            count: countItems(summary.policy_findings) + countItems(summary.prompt_canary_runs),
            content: `
              <div class="tab-section">${cards(summary.policy_findings, policyCard, "Concept policy rules pass.")}</div>
              <div class="tab-section">${cards(summary.prompt_canary_runs, promptCard, "No prompt canaries required.")}</div>
            `
          },
          {
            id: "contracts",
            label: "Contracts",
            kicker: "Runtime assumptions",
            title: "Contracts and suggested tests",
            description: "Contract drift and generated test ideas for follow-up validation.",
            count: countItems(summary.contract_findings) + countItems(summary.suggested_tests),
            content: `
              <div class="tab-section">${cards(summary.contract_findings, contractCard, "No runtime contract drift.")}</div>
              <div class="tab-section">${cards(summary.suggested_tests, suggestedTestCard, "No generated test suggestions.")}</div>
            `
          },
          {
            id: "comment",
            label: "Comment",
            kicker: "Review comment",
            title: "Generated PR comment",
            description: "Ready-to-post reviewer summary synthesized from the agent run.",
            count: summary.comment ? 1 : 0,
            content: `<pre class="comment-box">${esc(summary.comment || "No comment generated.")}</pre>`
          }
        ];
      }

      function tabButton(tab, selected) {
        return `<button
          id="detail-tab-${escAttr(tab.id)}"
          class="dashboard-tab${selected ? " active" : ""}"
          type="button"
          role="tab"
          aria-selected="${selected ? "true" : "false"}"
          aria-controls="detail-panel-${escAttr(tab.id)}"
          data-detail-tab="${escAttr(tab.id)}">
          <span>${esc(tab.label)}</span>
          <small>${esc(tab.count || 0)}</small>
        </button>`;
      }

      function tabPanel(tab) {
        return `<div
          id="detail-panel-${escAttr(tab.id)}"
          class="dashboard-tab-body"
          role="tabpanel"
          aria-labelledby="detail-tab-${escAttr(tab.id)}">
          <div class="tab-panel-head">
            <div>
              <p class="section-kicker">${esc(tab.kicker)}</p>
              <h3>${esc(tab.title)}</h3>
              <p class="muted">${esc(tab.description)}</p>
            </div>
            ${pill(`${tab.count || 0} items`, "info")}
          </div>
          ${tab.content}
        </div>`;
      }

      function metric(label, value, hint) {
        return `<div class="metric"><span>${esc(label)}</span><strong>${esc(value)}</strong><small>${esc(hint || "")}</small></div>`;
      }

      function summaryItem(label, value) {
        return `<div class="summary-item"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
      }

      function agentCard(name, result) {
        const confidence = result?.confidence == null ? "" : `${Math.round(result.confidence * 100)}%`;
        const message = (result?.messages || [])[0] || result?.status || "completed";
        return `<div class="agent-card">
          <div class="agent-card-top">
            <code>${esc(name)}</code>
            ${pill(result?.status || "completed")}
          </div>
          <p>${esc(message)}</p>
          ${confidence ? `<div class="confidence">${esc(confidence)} confidence</div>` : ""}
        </div>`;
      }

      function countItems(items) {
        return Array.isArray(items) ? items.length : 0;
      }

      function cards(items, renderer, emptyText) {
        const list = items || [];
        if (!list.length) return `<p class="muted">${esc(emptyText)}</p>`;
        return `<div class="review-grid">${list.slice(0, 8).map((item) => `<article class="review-card">${renderer(item)}</article>`).join("")}</div>`;
      }

      function checkCard(item) {
        return `<div class="review-card-top"><h4>${esc(item.name || "MergeGuard check")}</h4>${pill(item.conclusion || item.status || "unknown")}</div>
          <p>${esc(item.summary || item.details || "No additional check details.")}</p>`;
      }

      function ownerCard(item) {
        const fileCount = item.file_count ?? item.count ?? (item.files || []).length;
        return `<div class="review-card-top"><h4>${esc(item.owner || "unassigned")}</h4>${pill(`${fileCount} files`, "info")}</div>
          <p>${esc((item.files || []).join(", ") || "Review ownership inferred from changed paths.")}</p>`;
      }

      function hotspotCard(item) {
        return `<div class="review-card-top"><h4><code>${esc(item.path)}</code></h4>${scoreChip(item.risk_score)}</div>
          <p>${esc(item.reason || "")}</p>
          <div class="muted">${esc((item.owners || []).join(", ") || "unassigned")}</div>`;
      }

      function evidenceCard(item) {
        return `<div class="review-card-top"><h4>${esc(item.intent_text || item.message || "Evidence")}</h4>${pill(item.evidence_status || item.severity || "info")}</div>
          <p>${esc(item.suggested_action || "")}</p>
          <div class="muted">${esc((item.mapped_paths || item.evidence_paths || []).join(", ") || "no mapped paths")}</div>`;
      }

      function behaviorCard(item) {
        return `<div class="review-card-top"><h4><code>${esc(item.path)}</code></h4>${pill(item.severity || "review")}</div>
          <p>${esc(item.new_behavior || item.summary || "")}</p>
          <div class="muted">${esc(item.divergent_input || item.symbol || "")}</div>`;
      }

      function blastCard(item) {
        return `<h4><code>${esc(item.path)}</code></h4>
          <p>${esc((item.downstream_services || []).join(", ") || "No downstream service listed.")}</p>
          <div class="muted">Callers: ${esc((item.direct_callers || []).join(", ") || "none")}</div>`;
      }

      function policyCard(item) {
        return `<div class="review-card-top"><h4>${esc(item.rule_id || item.concept)}</h4>${pill(item.severity || "warn")}</div>
          <p>${esc(item.message || "")}</p>
          <div class="muted">${esc(item.owner || "unassigned")} / ${esc(item.path || "")}</div>`;
      }

      function promptCard(item) {
        return `<div class="review-card-top"><h4>${esc(item.suite || "prompt canary")}</h4>${pill(item.status || "unknown")}</div>
          <p>${esc(item.drift_summary || item.prompt_path || "")}</p>
          <div class="muted">correctness ${esc(item.correctness)} / format ${esc(item.format)} / cost ${esc(item.cost_delta_pct)}%</div>`;
      }

      function contractCard(item) {
        return `<div class="review-card-top"><h4><code>${esc(item.path)}</code></h4>${pill(item.severity || "review")}</div>
          <p>${esc(item.violated_assumption || "")}</p>
          <div class="muted">${esc(item.suggested_test?.path || "")}</div>`;
      }

      function suggestedTestCard(item) {
        return `<h4><code>${esc(item.path)}</code></h4>
          <p>${esc(item.intent || "")}</p>
          <div class="muted">${esc(item.framework || "repo-default")}</div>`;
      }

      function barList(items, labelKey, valueKey) {
        const list = items || [];
        if (!list.length) return "";
        const max = Math.max(...list.map((item) => Number(item[valueKey] || 0)), 1);
        return `<div class="bar-list">${list.slice(0, 8).map((item) => {
          const value = Number(item[valueKey] || 0);
          const pct = Math.round((value / max) * 100);
          return `<div class="bar-row">
            <span>${esc(item[labelKey])}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
            <strong>${esc(value)}</strong>
          </div>`;
        }).join("")}</div>`;
      }

      function riskDial(score) {
        const color = score >= 70 ? "var(--red)" : score >= 40 ? "var(--amber)" : "var(--green)";
        return `<div class="risk-dial" style="--score:${score};--risk-color:${color}">
          <div class="risk-dial-inner">
            <div>
              <div class="risk-number">${score}</div>
              <div class="risk-caption">risk</div>
            </div>
          </div>
        </div>`;
      }

      function scoreChip(score) {
        return `<span class="chip">risk ${scoreLabel(score)}</span>`;
      }

      function pill(value, tone) {
        const label = statusLabel(value);
        const key = String(tone || value || "unknown").toLowerCase().replace(/[^a-z0-9_]+/g, "_");
        return `<span class="pill pill-${escAttr(key)}">${esc(label)}</span>`;
      }

      function statusLabel(value) {
        return String(value || "unknown").replaceAll("_", " ").toUpperCase();
      }

      function scoreLabel(score) {
        return score == null ? "n/a" : String(score);
      }

      function numericScore(score) {
        return Math.max(0, Math.min(100, Number(score || 0)));
      }

      function updateSelect(select, values, fallback, selected) {
        const current = selected || select.value;
        select.innerHTML = `<option value="">${esc(fallback)}</option>${values
          .map((value) => `<option value="${escAttr(value)}">${esc(value)}</option>`)
          .join("")}`;
        select.value = values.includes(current) ? current : "";
      }

      function unique(values) {
        return [...new Set(values)].sort((a, b) => a.localeCompare(b));
      }

      async function fetchJson(path, options) {
        const response = await fetch(path, options);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || `${response.status} ${response.statusText}`);
        }
        return data;
      }

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function escAttr(value) {
        return esc(value).replaceAll("`", "&#96;");
      }
    </script>
  </body>
</html>
