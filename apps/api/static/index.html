            state.flowTimer = null;
            state.runningAgentId = null;
            if (state.runStartedAt) {
              state.lastRunElapsedMs = Date.now() - state.runStartedAt;
              state.runStartedAt = null;
            }
            state.replayInFlight = false;
            state.currentRun = savedRun;
            renderAgentWorkflow(savedRun);
            return;
          }
          state.runningAgentId = enabled[index].id;
          renderAgentWorkflow();
        }, Math.max(250, state.delayMs || 750));
      }

      function filteredRows() {
        return state.rows.filter((row) => {
          const pr = row.pull_request || {};
          const summary = row.latest_run?.summary || {};
          const repo = pr.repository?.full_name || "";
          if (state.filters.repo && repo !== state.filters.repo) return false;
          if (state.filters.owner) {
            const owners = [
              pr.author,
              ...(summary.owner_summary || []).map((owner) => owner.owner)
            ];
            if (!owners.includes(state.filters.owner)) return false;
          }
          if (state.filters.risk_state && summary.status !== state.filters.risk_state) return false;
          return true;
        });
      }

      function queueTabRows(rows, tab = state.queueTab) {
        return rows.filter((row) => (tab === "reviewed" ? isReviewedPr(row) : isActivePr(row)));
      }

      function hasFinishedAnalysis(row) {
        const runState = String(row.latest_run?.state || "").toLowerCase();
        return ["completed", "failed", "analysis_failed"].includes(runState);
      }

      function needsAnalysis(row) {
        return !hasFinishedAnalysis(row);
      }

      function isReviewedPr(row) {
        const status = String(row.latest_run?.summary?.status || "").toLowerCase();
        return ["pass", "passed", "approved", "merged"].includes(status);
      }

      function isActivePr(row) {
        return !isReviewedPr(row);
      }

      function queueCard(row) {
        const pr = row.pull_request || {};
        const run = row.latest_run || {};
        const summary = run.summary || {};
        const score = numericScore(summary.risk_score);
        const status = summary.status || run.state || "queued";
        const tone = score >= 70 ? "hot" : score >= 40 ? "mid" : "";
        const analyzing = state.activeAnalysisPrId === pr.id;
        const canShowDetails = run.id && ["completed", "failed"].includes(run.state);
        return `<article class="pr-row" data-pr-id="${escAttr(pr.id || "")}">
          <div class="pr-row-main">
            <div class="pr-title-line">
              <h3>#${esc(pr.number || "")} ${esc(pr.title || "Untitled PR")}</h3>
            </div>
            <div class="pr-meta">
              <span class="muted">${esc(pr.repository?.full_name || "")}</span>
              <span class="muted">${esc(pr.author || "unknown")}</span>
              ${pill(status)}
              ${pill(`${Object.keys(run.agent_results || {}).length} agents`, "info")}
            </div>
            <p class="queue-action">${esc(summary.next_action || "No analysis has run yet.")}</p>
          </div>
          <div class="score-stack">
            <div class="score-number">${scoreLabel(summary.risk_score)}</div>
            <div class="score-track"><div class="score-fill ${tone}" style="width:${score}%"></div></div>
          </div>
          <div class="pr-row-actions">
            <button class="small-button primary" type="button" data-action="analyze" data-pr-id="${escAttr(pr.id || "")}" ${analyzing ? "disabled" : ""}>
              ${analyzing ? "Analyzing" : "Analyze"}
            </button>
            ${canShowDetails ? `<button class="small-button success" type="button" data-action="details" data-run-id="${escAttr(run.id)}">Show details</button>` : ""}
          </div>
        </article>`;
      }

      function renderDetail(run) {
        if (!run) return;
        state.currentRun = run;
        const summary = run.summary || {};
        const pr = run.pull_request || {};
        const score = numericScore(summary.risk_score);
        const status = summary.status || run.state || "queued";
        const agentNames = Object.keys(run.agent_results || {});
        const tabs = detailTabs(run, summary, pr, agentNames);
        const selectedTab = tabs.find((tab) => tab.id === state.selectedDetailTab) || tabs[0];
        state.selectedDetailTab = selectedTab.id;

        detailEl.innerHTML = `
          <section class="panel detail-hero">
            <div>
              <p class="section-kicker">Truth report</p>
              <h2>#${esc(pr.number || "")} ${esc(pr.title || "Untitled pull request")}</h2>
              <div class="detail-meta">
                ${pill(status)}
                ${pill(`${agentNames.length} agents`, "info")}
                ${pill(run.state || "unknown", run.state || "unknown")}
                ${pr.url ? `<a class="chip" href="${escAttr(pr.url)}" target="_blank" rel="noreferrer">Open PR</a>` : ""}
              </div>
              <div class="summary-strip">
                ${summaryItem("Repository", pr.repository?.full_name || "unknown")}
                ${summaryItem("Top blocker", summary.top_blocker || "None")}
                ${summaryItem("Next action", summary.next_action || "Analysis pending")}
              </div>
            </div>
            ${riskDial(score)}
          </section>

          <section class="panel dashboard-tabs-panel" aria-label="PR analysis detail tabs">
            <div class="dashboard-tabs" role="tablist" aria-label="PR analysis sections">
              ${tabs.map((tab) => tabButton(tab, tab.id === selectedTab.id)).join("")}
            </div>
            ${tabPanel(selectedTab)}
          </section>
        `;

        for (const button of detailEl.querySelectorAll("[data-detail-tab]")) {
          button.addEventListener("click", () => {
            state.selectedDetailTab = button.dataset.detailTab;
            renderDetail(state.currentRun);
          });
        }
        bindCodeLinks();
        bindMemoryNodes();
        bindEvidenceGraph();
        bindAgentDecisionMesh();
        detailEl.querySelector(".dashboard-tab-body")?.scrollTo({ top: 0 });
      }

      function detailTabs(run, summary, pr, agentNames) {
        const coverage = summary.test_coverage || {};
        const memory = summary.semantic_memory || {};
        const slop = summary.slop || {};
        const coverageConfidence = coverage.confidence == null ? "n/a" : `${Math.round(coverage.confidence * 100)}%`;
        return [
          {
            id: "overview",
            label: "Overview",
            kicker: "Readiness",
            title: "Review posture",
            description: "The merge decision, required checks, and reviewer-facing next steps.",
            count: countItems(summary.checks),
            content: `
              <div class="tab-section">
                ${overviewChecks(summary.checks)}
              </div>
            `
          },
          {
            id: "agents",
            label: "Agents",
            kicker: "Execution mesh",
            title: "Agent Decision Mesh",
            description: "The completed agent council grouped by pipeline stage, confidence, and reviewer contribution.",
            count: agentNames.length,
            content: agentDecisionMeshContent(run, agentNames)
          },
          {
            id: "review",
            label: "Reviewer Brief",
            kicker: "Review decision",
            title: "Reviewer Brief",
            description: "Merge posture, reviewer priorities, file focus, and suggested response in one place.",
            count: reviewBriefCount(summary),
            content: reviewBriefContent(run, summary, pr)
          },
          {
            id: "slop",
            label: "Slop Remover",
            kicker: "Slop hygiene",
            title: "Slop Remover",
            description: "Slop is review noise: debug leftovers, placeholders, noisy churn, weak tests, and unrelated files that should be removed, reworked, or skimmed.",
            count: slopRemoverCount(summary),
            content: slopRemoverContent(summary)
          },
          {
            id: "evidence",
            label: "Evidence",
            kicker: "Verification evidence",
            title: "Requirement Proof Graph",
            description: "Claims connected to changed files, proof candidates, repository memory, and final evidence status.",
            count: countItems(summary.evidence_links),
            content: evidenceProofContent(summary)
          },
          {
            id: "memory",
            label: "Memory",
            kicker: "Vector recall",
            title: "Repository Memory Radar",
            description: "A constellation of tests, docs, policies, and prior PRs retrieved from repository memory.",
            count: memoryConstellationCount(summary),
            content: memoryConstellationContent(summary, pr)
          },
          {
            id: "tests",
            label: "Tests",
            kicker: "Functional coverage",
            title: "Coverage Cockpit",
            description: "A reviewer-first map of source targets, coverage gaps, and the tests that should be added or extended.",
            count: testCockpitCount(summary),
            content: testCockpitContent(summary)
          },
          {
            id: "behavior",
            label: "Behavior",
            kicker: "Runtime behavior",
            title: "Behavior Shift Lens",
            description: "Before, trigger, and after lanes that explain what changed at runtime and why it matters.",
            count: countItems(summary.behavioral_deltas) + countItems(summary.blast_radius),
            content: behaviorShiftContent(summary)
          },
          {
            id: "gates",
            label: "Gates",
            kicker: "Policy and prompt",
            title: "Guardrail Firewall",
            description: "Policy, prompt, and check gates rendered as the merge packet crossing the review firewall.",
            count: guardrailFirewallCount(summary),
            content: guardrailFirewallContent(summary)
          },
          {
            id: "contracts",
            label: "Contracts",
            kicker: "Runtime assumptions",
            title: "API Contract X-Ray",
            description: "Side-by-side old/new contract shapes with removed fields, changed assumptions, and generated validation tests.",
            count: countItems(summary.contract_findings) + countItems(summary.suggested_tests),
            content: contractXrayContent(summary)
          },
          {
            id: "comment",
            label: "Comment",
            kicker: "Review comment",
            title: "Generated PR comment",
            description: "Ready-to-post reviewer summary synthesized from the agent run.",
            count: summary.comment ? 1 : 0,
            content: `<pre class="comment-box">${esc(summary.comment || "No comment generated.")}</pre>`
          }
        ];
      }

      function tabButton(tab, selected) {
        return `<button
          id="detail-tab-${escAttr(tab.id)}"
          class="dashboard-tab${selected ? " active" : ""}"
          type="button"
          role="tab"
          aria-selected="${selected ? "true" : "false"}"
          aria-controls="detail-panel-${escAttr(tab.id)}"
          data-detail-tab="${escAttr(tab.id)}">
          <span>${esc(tab.label)}</span>
          <small>${esc(tab.count || 0)}</small>
        </button>`;
      }

      function tabPanel(tab) {
        return `<div
          id="detail-panel-${escAttr(tab.id)}"
          class="dashboard-tab-body"
          role="tabpanel"
          aria-labelledby="detail-tab-${escAttr(tab.id)}">
          <div class="tab-panel-head">
            <div>
              <p class="section-kicker">${esc(tab.kicker)}</p>
              <h3>${esc(tab.title)}</h3>
              <p class="muted">${esc(tab.description)}</p>
            </div>
            ${pill(`${tab.count || 0} items`, "info")}
          </div>
          ${tab.content}
        </div>`;
      }

      function metric(label, value, hint) {
        return `<div class="metric"><span>${esc(label)}</span><strong>${esc(value)}</strong><small>${esc(hint || "")}</small></div>`;
      }

      function summaryItem(label, value) {
        return `<div class="summary-item"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
      }

      function agentCard(name, result) {
        const confidence = result?.confidence == null ? "" : `${Math.round(result.confidence * 100)}%`;
        const message = (result?.messages || [])[0] || result?.status || "completed";
        return `<div class="agent-card">
          <div class="agent-card-top">
            <code>${esc(name)}</code>
            ${pill(result?.status || "completed")}
          </div>
          <p>${esc(message)}</p>
          ${confidence ? `<div class="confidence">${esc(confidence)} confidence</div>` : ""}
        </div>`;
      }

      function countItems(items) {
        return Array.isArray(items) ? items.length : 0;
      }

      function reviewBriefCount(summary) {
        const checklist = reviewChecklist(summary || {});
        return checklist.must.length
          + checklist.verify.length
          + reviewFileFocusItems(summary || {}).length
          + (summary?.comment ? 1 : 0);
      }

      function reviewBriefContent(run, summary, pr) {
        const score = numericScore(summary.risk_score);
        const decision = reviewDecision(summary, score, run);
        const confidence = reviewConfidence(summary, run);
        const intent = primaryReviewIntent(summary, pr);
        const checklist = reviewChecklist(summary);
        const files = reviewFileFocusItems(summary, run);
        const themes = reviewThemeChips(summary, files);
        const mustCount = checklist.must.filter((item) => !item.startsWith("No ")).length;
        const verifyCount = checklist.verify.filter((item) => !item.startsWith("No ")).length;
        return `<div class="review-heat">
          <section class="review-heat-hero">
            <div class="review-heat-title">
              <span class="review-list-label">Change triage / heat list</span>
              <h4>Read this top-to-bottom and you have reviewed it.</h4>
              <p>Files are ordered by review risk. The mini-strip on each row shows where the change clusters, so reviewers inspect dense or dangerous regions first.</p>
            </div>
            <div class="review-heat-badges">
              ${pill(`${mustCount} must-review`, mustCount ? "block" : "success")}
              ${pill(`${verifyCount} verify`, verifyCount ? "review" : "success")}
              ${pill(`${confidence}% confidence`, "info")}
            </div>
          </section>
          <section class="review-theme-row" aria-label="Review themes">
            ${themes.map(reviewThemeChip).join("")}
          </section>
          <section class="review-heat-list" aria-label="Reviewer heat list">
            ${files.length ? files.map((item, index) => reviewHeatRow(item, index)).join("") : `<div class="slop-empty">No priority files were flagged for this review.</div>`}
          </section>
          <section class="coverage-critical">
            <span>Reviewer decision</span>
            <strong>${esc(decision.reason || intent)}</strong>
          </section>
        </div>`;
      }

      function reviewThemeChips(summary, files) {
        const source = [
          ...(files || []).flatMap((item) => [item.path, ...(item.reasons || []), ...(item.actions || [])]),
          ...(summary.intent_items || []).map((item) => item.text),
          summary.top_blocker,
          summary.next_action
        ].join(" ").toLowerCase();
        const themeDefs = [
          ["refund", "refund", "var(--primary)"],
          ["email", "email", "var(--blue)"],
          ["security", "security", "var(--red)"],
          ["prompt", "prompt", "var(--violet)"],
          ["charge", "charge", "var(--amber)"],
          ["config", "config", "var(--green)"]
        ];
        const themes = themeDefs.map(([key, label, color]) => ({
          label,
          color,
          count: (source.match(new RegExp(key, "g")) || []).length
        })).filter((item) => item.count > 0).slice(0, 6);
        return themes.length ? themes : [{
          label: "review",
          color: "var(--primary)",
          count: Math.max(1, files?.length || 0)
        }];
      }

      function reviewThemeChip(item) {
        return `<div class="review-theme-chip" style="--theme-color:${item.color}">
          <span>${esc(item.label)}</span>
          <strong>${esc(item.count)}</strong>
        </div>`;
      }

      function reviewHeatRow(item, index) {
        const risk = numericScore(item.risk);
        const tone = risk >= 80 ? "var(--red)" : risk >= 55 ? "var(--amber)" : risk >= 30 ? "var(--primary)" : "var(--green)";
        const kind = reviewFileKind(item.path, item.reasons);
        const owner = item.owners[0] || "unassigned";
        return `<article class="review-heat-row" style="--row-color:${tone};--risk:${risk}">
          <div class="review-heat-file">
            <button class="code-link" type="button" data-code-path="${escAttr(item.path)}" aria-label="Open ${escAttr(item.path)} changed code"><code>${esc(item.path)}</code></button>
            <div class="review-heat-meta">
              <span class="review-heat-kind">${esc(kind)}</span>
              <span class="muted">${esc(owner)}</span>
            </div>
          </div>
          ${reviewChangeStrip(item.path, risk, index, kind)}
          <div class="review-risk-mini">
            <div class="review-risk-bar"><span></span></div>
            <span>risk ${esc(risk)}</span>
          </div>
          <div class="review-risk-number">${esc(risk)}</div>
        </article>`;
      }

      function reviewChangeStrip(path, risk, index, kind = "logic") {
        const seed = stableNumber(`${path}:${risk}:${index}`);
        const tickMarks = Array.from({ length: 20 }, (_, slot) => 4 + slot * 4.8);
        const blocks = reviewStripBlocks(kind, risk, seed);
        return `<div class="review-change-strip" aria-label="Change density strip">
          ${tickMarks.map((left) => `<span class="review-strip-tick" style="--left:${left.toFixed(1)}"></span>`).join("")}
          ${blocks.map((block) => `<span class="review-strip-block" style="--left:${block.left};--width:${block.width}"></span>`).join("")}
        </div>`;
      }

      function reviewStripBlocks(kind, risk, seed) {
        const presets = {
          scratch: [1, 4, 9, 12, 15, 18, 21, 24, 27],
          security: [7, 11, 13, 20, 24, 29, 34, 40],
          logic: [3, 9, 18, 22, 28, 40, 54, 60, 70, 76, 83, 89],
          prompt: [2, 5, 9, 12],
          config: [2],
          test: [8, 16, 24, 31]
        };
        const key = presets[kind] ? kind : "logic";
        const count = Math.max(1, Math.min(presets[key].length, Math.round(risk / 11)));
        const jitter = (seed % 5) - 2;
        return presets[key].slice(0, count).map((base, index) => {
          const wide = key === "prompt" && index < 2 ? 7 : key === "scratch" && index > 5 ? 5 : 3;
          const left = Math.max(1, Math.min(96 - wide, base + jitter + (index % 2 ? 1 : 0)));
          return { left: left.toFixed(1), width: wide.toFixed(1) };
        });
      }

      function reviewFileKind(path, reasons = []) {
        const text = `${path || ""} ${(reasons || []).join(" ")}`.toLowerCase();
        if (text.includes("scratch") || text.includes("debug")) return "scratch";
        if (text.includes("security") || text.includes("pii")) return "security";
        if (text.includes("prompt")) return "prompt";
        if (text.includes("test") || text.includes("spec")) return "test";
        if (text.includes("config") || text.includes("flag")) return "config";
        return "logic";
      }

      function reviewDecision(summary, score, run) {
        const status = String(summary.status || run?.state || "").toLowerCase();
        if (status.includes("block") || score >= 70) {
          return {
            status: "blocked",
            title: "Blocked until reviewer action is resolved",
            reason: summary.top_blocker || summary.next_action || "High-risk findings require review before merge.",
            color: "var(--red)"
          };
        }
        if (status.includes("review") || score >= 40) {
          return {
            status: "review",
            title: "Needs focused reviewer inspection",
            reason: summary.next_action || summary.top_blocker || "Inspect the highlighted files and evidence gaps before approval.",
            color: "var(--amber)"
          };
        }
        return {
          status: "pass",
          title: "Ready after final reviewer scan",
          reason: summary.next_action || "No blocking findings were detected by the agent run.",
          color: "var(--green)"
        };
      }

      function reviewConfidence(summary, run) {
        const checks = summary.checks || [];
        if (checks.length) {
          const decisive = checks.filter((item) => ["success", "failure"].includes(checkTone(item.conclusion || item.status))).length;
          return Math.max(35, Math.min(98, Math.round((decisive / checks.length) * 100)));
        }
        const results = Object.values(run?.agent_results || {});
        if (!results.length) return 50;
        const confidences = results.map((item) => Number(item.confidence)).filter(Number.isFinite);
        if (!confidences.length) return 65;
        return Math.round((confidences.reduce((sum, value) => sum + value, 0) / confidences.length) * 100);
      }

      function primaryReviewIntent(summary, pr) {
        const primary = (summary.intent_items || [])[0]?.text || pr.title || "Untitled PR";
        const secondary = (summary.intent_items || []).slice(1, 3).map((item) => item.text).filter(Boolean);
        return secondary.length ? `${primary}; ${secondary.join("; ")}` : primary;
      }

      function reviewSignal(label, value) {
        return `<div class="review-signal"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
      }

      function reviewChecklist(summary) {
        const must = uniqueReviewItems([
          summary.top_blocker,
          ...severityItems(summary.policy_findings, ["block", "blocked", "failure", "critical"]).map((item) => item.message || item.suggested_action),
          ...severityItems(summary.test_coverage_findings, ["block", "blocked"]).map((item) => item.suggested_action || item.message),
          ...severityItems(summary.prompt_canary_runs, ["failed", "failure", "block"]).map((item) => item.drift_summary || `Prompt drift check failed for ${item.prompt_path || item.suite || "prompt"}`),
          ...severityItems(summary.contract_findings, ["block", "review_required"]).map((item) => item.violated_assumption || item.suggested_test?.intent)
        ], 4);
        const verify = uniqueReviewItems([
          ...severityItems(summary.behavioral_deltas, ["review_required", "warn"]).map((item) => `${item.path}: ${item.divergent_input || item.new_behavior || "behavior changed"}`),
          ...severityItems(summary.evidence_links, ["missing", "partial", "review_required"]).map((item) => item.suggested_action || item.intent_text),
          ...severityItems(summary.slop_findings, ["review_required", "warn"]).map((item) => item.suggested_action || item.message),
          ...severityItems(summary.test_coverage_findings, ["review_required", "warn"]).map((item) => item.suggested_action || item.message)
        ], 4);
        const low = uniqueReviewItems([
          countItems(summary.memory_evidence) ? "Repository memory found related tests, docs, or prior PR context." : "",
          countItems(summary.owner_summary) ? "Review routing is available for changed ownership areas." : "",
          countItems(summary.hotspots) ? "Inspect non-hotspot files after the blocker path is resolved." : "No high-risk hotspots were identified."
        ], 3);
        return { must, verify, low };
      }

      function severityItems(items, states) {
        const wanted = new Set(states);
        return (items || []).filter((item) => {
          const state = String(item.severity || item.status || item.conclusion || item.evidence_status || "").toLowerCase();
          return [...wanted].some((value) => state.includes(value));
        });
      }

      function uniqueReviewItems(items, limit) {
        const seen = new Set();
        return (items || [])
          .map((item) => String(item || "").trim())
          .filter((item) => {
            const key = item.toLowerCase();
            if (!item || seen.has(key)) return false;
            seen.add(key);
            return true;
          })
          .slice(0, limit);
      }

      function reviewChecklistPanel(checklist) {
        return `<section class="review-list-card">
          ${reviewListGroup("Must inspect", checklist.must, "No blocking inspection items.")}
          ${reviewListGroup("Should verify", checklist.verify, "No additional verification items.")}
          ${reviewListGroup("Can skim", checklist.low, "No low-risk areas identified yet.")}
        </section>`;
      }

      function reviewListGroup(label, items, emptyText) {
        const tone = label.startsWith("Must") ? "must" : label.startsWith("Should") ? "verify" : "low";
        const rows = items.length ? items : [emptyText];
        return `<div class="review-list-group ${tone}">
          <span class="review-list-label">${esc(label)}</span>
          <ul>${rows.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>
        </div>`;
      }

      function reviewFileFocusItems(summary, run = state.currentRun) {
        const byPath = new Map();
        const ensure = (path) => {
          const key = String(path || "").trim();
          if (!key) return null;
          if (!byPath.has(key)) {
            byPath.set(key, { path: key, risk: 0, reasons: [], owners: [], actions: [] });
          }
          return byPath.get(key);
        };
        for (const item of summary.hotspots || []) {
          const row = ensure(item.path);
          if (!row) continue;
          row.risk = Math.max(row.risk, numericScore(item.risk_score));
          row.reasons.push(item.reason);
          row.actions.push(item.required_action);
          row.owners.push(...(item.owners || []));
        }
        for (const item of summary.test_coverage_findings || []) {
          const row = ensure(item.path);
          if (!row) continue;
          row.risk = Math.max(row.risk, item.severity === "block" ? 88 : 62);
          row.reasons.push(item.message);
          row.actions.push(item.suggested_action);
        }
        for (const item of summary.policy_findings || []) {
          const row = ensure(item.path);
          if (!row) continue;
          row.risk = Math.max(row.risk, 90);
          row.reasons.push(item.message || item.rule_id);
          row.actions.push(item.suggested_action || item.owner);
        }
        for (const item of summary.contract_findings || []) {
          const row = ensure(item.path);
          if (!row) continue;
          row.risk = Math.max(row.risk, 72);
          row.reasons.push(item.violated_assumption);
          row.actions.push(item.suggested_test?.intent || item.suggested_test?.path);
        }
        for (const item of [...(summary.remove_candidates || []), ...(summary.rework_candidates || []), ...(summary.slop_findings || [])]) {
          const row = ensure(item.path);
          if (!row) continue;
          row.risk = Math.max(row.risk, Math.min(58, numericScore(item.score) || 48));
          row.reasons.push(item.message || item.category);
          row.actions.push(item.suggested_action || item.disposition);
        }
        if (!byPath.size) {
          for (const file of [
            ...(run?.changed_files || []),
            ...(run?.input_payload?.changed_files || []),
            ...(run?.input_payload?.files || [])
          ]) {
            const row = ensure(file.path || file.filename);
            if (!row) continue;
            const churn = Number(file.additions || 0) + Number(file.deletions || 0) + Number(file.changes || 0);
            row.risk = Math.min(70, Math.max(24, Math.round(churn / 2)));
            row.reasons.push(churn ? `${churn} changed lines` : "Changed file in this PR");
            row.actions.push("Open and inspect this changed file.");
          }
        }
        return [...byPath.values()]
          .map((item) => ({
            ...item,
            reasons: uniqueReviewItems(item.reasons, 2),
            actions: uniqueReviewItems(item.actions, 2),
            owners: uniqueReviewItems(item.owners, 2)
          }))
          .sort((a, b) => b.risk - a.risk)
          .slice(0, 6);
      }

      function reviewFileFocusPanel(files) {
        if (!files.length) {
          return `<section class="review-file-focus"><span class="review-list-label">File focus</span><p class="muted">No priority files were flagged.</p></section>`;
        }
        return `<section class="review-file-focus">
          <span class="review-list-label">File focus</span>
          ${files.map((item) => `<article class="review-file-row">
            <div>
              <h4>
                <button class="code-link" type="button" data-code-path="${escAttr(item.path)}" aria-label="Open ${escAttr(item.path)} changed code">
                  <code>${esc(item.path)}</code>
                </button>
              </h4>
              <p>${esc(item.reasons.join(" "))}</p>
              <p>${esc(item.actions.join(" ") || "Inspect this file before approval.")}</p>
            </div>
            <div class="chip-row">
              ${scoreChip(item.risk)}
              ${item.owners.length ? pill(item.owners[0], "info") : ""}
            </div>
          </article>`).join("")}
        </section>`;
      }

      function fileInspectionContext(path) {
        const summary = state.currentRun?.summary || {};
        const reviewContext = reviewFileFocusItems(summary).find((item) => item.path === path);
        const evidenceContext = evidenceFileContext(summary, path);
        const memoryContext = memoryFileContext(summary, path);
        const contexts = [memoryContext, evidenceContext, reviewContext].filter(Boolean);
        if (!contexts.length) return null;
        if (contexts.length === 1) return contexts[0];
        return {
          path,
          risk: Math.max(...contexts.map((item) => numericScore(item.risk))),
          reasons: uniqueReviewItems(contexts.flatMap((item) => item.reasons || []), 5),
          actions: uniqueReviewItems(contexts.flatMap((item) => item.actions || []), 5),
          owners: uniqueReviewItems(contexts.flatMap((item) => item.owners || []), 2)
        };
      }

      function memoryFileContext(summary, path) {
        const hits = memoryConstellationNodes(summary).filter((item) => item.path === path);
        if (!hits.length) return null;
        return {
          path,
          risk: Math.max(...hits.map((item) => Math.round(memoryScore(item) * 100))),
          reasons: uniqueReviewItems(hits.map((item) => `Repository memory: ${item.title || item.path || "memory hit"} matched as ${memoryKindLabel(item.kind)}.`), 4),
          actions: uniqueReviewItems(hits.map(memoryNodeAction), 4),
          owners: []
        };
      }

      function mergeInspectionContexts(path, reviewContext, evidenceContext) {
        return {
          path,
          risk: Math.max(numericScore(reviewContext.risk), numericScore(evidenceContext.risk)),
          reasons: uniqueReviewItems([...(reviewContext.reasons || []), ...(evidenceContext.reasons || [])], 4),
          actions: uniqueReviewItems([...(reviewContext.actions || []), ...(evidenceContext.actions || [])], 4),
          owners: uniqueReviewItems([...(reviewContext.owners || []), ...(evidenceContext.owners || [])], 2)
        };
      }

      function evidenceFileContext(summary, path) {
        const reasons = [];
        const actions = [];
        let risk = 0;
        for (const item of summary.evidence_links || []) {
          const paths = [
            ...(item.mapped_paths || []),
            ...(item.evidence_paths || []),
            ...(item.memory_evidence_paths || []),
            ...(item.memory_test_candidates || [])
          ];
          if (!paths.includes(path)) continue;
          const tone = evidenceTone(item);
          risk = Math.max(risk, tone === "missing" ? 82 : tone === "partial" ? 58 : 24);
          reasons.push(`${item.intent_text || "Requirement"} is ${item.evidence_status || tone}.`);
          actions.push(item.suggested_action || fallbackEvidenceAction(tone));
        }
        if (!reasons.length) return null;
        return {
          path,
          risk,
          reasons: uniqueReviewItems(reasons, 4),
          actions: uniqueReviewItems(actions, 4),
          owners: []
        };
      }

      function findChangedFile(path) {
        const run = state.currentRun || {};
        const candidates = [
          ...(run.changed_files || []),
          ...(run.input_payload?.changed_files || []),
          ...(run.input_payload?.files || [])
        ];
        return candidates.find((file) => {
          const filePath = file.path || file.filename || file.file || "";
          return filePath === path;
        });
      }

      function renderCodeDialogBody(path, file, context, patch) {
        const additions = file?.additions == null ? null : `+${file.additions}`;
        const deletions = file?.deletions == null ? null : `-${file.deletions}`;
        const changes = [file?.status, additions, deletions].filter(Boolean).join("  ");
        const reasons = context?.reasons?.length ? context.reasons : ["No file-specific risk reason was captured for this path."];
        const actions = context?.actions?.length ? context.actions : ["Inspect the diff before approval."];
        const owners = context?.owners || [];
        const fallback = [
          "No patch was stored for this run.",
          "",
          "Reviewer context:",
          ...reasons.map((item) => `* ${item}`),
          ...actions.map((item) => `* ${item}`)
        ].join("\n");
        return `
          <aside class="code-context-card">
            <div>
              <span class="review-list-label">File</span>
              <h4><code>${esc(path || "unknown")}</code></h4>
            </div>
            <div class="chip-row">
              ${scoreChip(context?.risk ?? 0)}
              ${owners[0] ? pill(owners[0], "info") : ""}
            </div>
            ${changes ? `<p>${esc(changes)}</p>` : ""}
            <div>
              <span class="review-list-label">Why inspect</span>
              <ul class="code-context-list">${reasons.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>
            </div>
            <div>
              <span class="review-list-label">Reviewer action</span>
              <ul class="code-context-list">${actions.map((item) => `<li>${esc(item)}</li>`).join("")}</ul>
            </div>
          </aside>
          ${renderPatchViewer(patch || fallback)}
        `;
      }

      function renderPatchViewer(patch) {
        const lines = String(patch || "").split("\n");
        return `<pre class="code-viewer" aria-label="Changed code diff">${lines.map((line) => {
          const klass = patchLineClass(line);
          return `<span class="code-line ${klass}">${esc(line || " ")}</span>`;
        }).join("")}</pre>`;
      }

      function patchLineClass(line) {
        if (line.startsWith("@@")) return "hunk";
        if (line.startsWith("diff ") || line.startsWith("index ") || line.startsWith("+++ ") || line.startsWith("--- ")) return "meta";
        if (line.startsWith("+")) return "add";
        if (line.startsWith("-")) return "del";
        return "";
      }

      function reviewCommentPanel(comment) {
        if (!comment) return "";
        return `<section class="review-comment-card">
          <span class="review-list-label">Suggested review comment</span>
          <pre>${esc(comment)}</pre>
        </section>`;
      }

      function cards(items, renderer, emptyText) {
        const list = items || [];
        if (!list.length) return `<p class="muted">${esc(emptyText)}</p>`;
        return `<div class="review-grid">${list.slice(0, 8).map((item) => `<article class="review-card">${renderer(item)}</article>`).join("")}</div>`;
      }

      function overviewChecks(items) {
        const list = items || [];
        if (!list.length) return `<p class="muted">No checks generated for this run.</p>`;
        return `<div class="overview-check-grid">${list.slice(0, 8).map(overviewCheckCard).join("")}</div>`;
      }

      function overviewCheckCard(item) {
        const state = item.conclusion || item.status || "unknown";
        const tone = checkTone(state);
        const label = tone === "success" ? "success" : tone === "failure" ? "failure" : "neutral";
        const score = tone === "neutral" ? 72 : 100;
        return `<article class="overview-check-card ${escAttr(tone)}">
          <div class="overview-status-dial" style="--status-score:${score}">
            <div class="overview-status-inner">
              <div>
                <div class="overview-status-label">${esc(label)}</div>
                <div class="overview-status-caption">state</div>
              </div>
            </div>
          </div>
          <h4>${esc(displayCheckName(item.name || "MergeGuard check"))}</h4>
          <p>${esc(item.summary || item.details || "No additional check details.")}</p>
        </article>`;
      }

      function displayCheckName(name) {
        return String(name || "")
          .replace("MergeGuard / Review Brief", "MergeGuard / Change Triage")
          .replace("MergeGuard / Intent Match", "MergeGuard / Requirement Match")
          .replace("MergeGuard / Evidence Coverage", "MergeGuard / Verification Evidence")
          .replace("MergeGuard / Behavioral Diff", "MergeGuard / Behavior Impact")
          .replace("MergeGuard / Concept Policy", "MergeGuard / Policy Guardrails")
          .replace("MergeGuard / Prompt Canary", "MergeGuard / Prompt Drift Check");
      }

      function checkTone(value) {
        const key = String(value || "neutral").toLowerCase().replace(/[^a-z0-9_]+/g, "_");
        if (["success", "pass", "passed", "completed", "ok"].includes(key)) return "success";
        if (key.includes("fail") || key.includes("block") || key.includes("error") || key.includes("critical")) return "failure";
        return "neutral";
      }

      function ownerCard(item) {
        const fileCount = item.file_count ?? item.count ?? (item.files || []).length;
        return `<div class="review-card-top"><h4>${esc(item.owner || "unassigned")}</h4>${pill(`${fileCount} files`, "info")}</div>
          <p>${esc((item.files || []).join(", ") || "Review ownership inferred from changed paths.")}</p>`;
      }

      function hotspotCard(item) {
        return `<div class="review-card-top"><h4><code>${esc(item.path)}</code></h4>${scoreChip(item.risk_score)}</div>
          <p>${esc(item.reason || "")}</p>
          <div class="muted">${esc((item.owners || []).join(", ") || "unassigned")}</div>`;
      }

      function slopRemoverContent(summary) {
        const slop = summary.slop || {};
        const remove = uniqueSlopItems(slopLaneItems(summary.remove_candidates || slop.remove_candidates, "remove"));
        const rework = uniqueSlopItems(slopLaneItems(summary.rework_candidates || slop.rework_candidates, "rework"));
        const actionKeys = new Set([...remove, ...rework].map(slopItemKey));
        const allFindings = uniqueSlopItems(slopLaneItems(summary.slop_findings || slop.slop_findings, "skim"));
        const skim = allFindings.filter((item) => {
          const disposition = String(item.disposition || "").toLowerCase();
          return !actionKeys.has(slopItemKey(item)) && !["remove", "rework"].includes(disposition);
        });
        const allItems = uniqueSlopItems([...remove, ...rework, ...skim]);
        const score = numericScore(slop.slop_score ?? Math.max(0, ...allItems.map((item) => numericScore(item.score))));
        const slopTone = score >= 70 ? "var(--red)" : score >= 35 ? "var(--amber)" : "var(--green)";
        const status = score >= 70 ? "Cleanup required" : score >= 35 ? "Review hygiene" : "Clean";
        const loadReduced = remove.length + rework.length;
        return `<div class="slop-remover">
          <section class="slop-hero" style="--slop-score:${score};--slop-tone:${slopTone}">
            <div>
              <p class="section-kicker">Slop Remover</p>
              <h4>${esc(status)}</h4>
              <p>Slop is anything that makes the PR harder to review without improving the change: temporary files, debug hooks, placeholder code, weak tests, or unrelated churn.</p>
            </div>
            <div class="slop-score-dial" aria-label="Slop score ${score} out of 100">
              <div>
                <strong>${score}</strong>
                <span>slop</span>
              </div>
            </div>
          </section>
          <section class="slop-stats" aria-label="Slop Remover summary">
            ${slopStat("Remove", `${remove.length} ${plural(remove.length, "file")}`)}
            ${slopStat("Rework", `${rework.length} ${plural(rework.length, "file")}`)}
            ${slopStat("Can skim", `${skim.length} ${plural(skim.length, "file")}`)}
            ${slopStat("Load reduced", `${loadReduced} ${plural(loadReduced, "file")}`)}
          </section>
          <section class="slop-lanes" aria-label="Slop Remover action lanes">
            ${slopLane("Remove", "remove", remove, "Debug, scratch, generated, or unrelated changes that should leave the PR.", "No removal candidates.")}
            ${slopLane("Rework", "rework", rework, "Placeholder or weak implementation that should be fixed before approval.", "No rework candidates.")}
            ${slopLane("Can skim", "skim", skim, "Low-risk review noise that should not consume reviewer attention.", "No low-priority slop.")}
          </section>
          <section class="slop-insights">
            ${slopSignalBoard(allItems)}
            ${slopCleanupComment(allItems)}
          </section>
        </div>`;
      }

      function slopRemoverCount(summary) {
        const slop = summary.slop || {};
        return uniqueSlopItems([
          ...slopLaneItems(summary.remove_candidates || slop.remove_candidates, "remove"),
          ...slopLaneItems(summary.rework_candidates || slop.rework_candidates, "rework"),
          ...slopLaneItems(summary.slop_findings || slop.slop_findings, "skim")
        ]).length;
      }

      function slopLaneItems(items, fallbackDisposition) {
        return (items || []).map((item) => ({
          ...item,
          disposition: item.disposition || fallbackDisposition
        }));
      }

      function uniqueSlopItems(items) {
        const seen = new Set();
        return (items || []).filter((item) => {
          const key = slopItemKey(item);
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
      }

      function slopItemKey(item) {
        return `${item.path || "unknown"}::${item.disposition || ""}::${item.message || item.suggested_action || ""}`;
      }

      function slopStat(label, value) {
        return `<div class="slop-stat"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
      }

      function slopLane(title, tone, items, description, emptyText) {
        return `<section class="slop-lane ${escAttr(tone)}">
          <div class="slop-lane-head">
            <div>
              <span class="review-list-label">${esc(tone)}</span>
              <h4>${esc(title)}</h4>
              <p>${esc(description)}</p>
            </div>
            ${pill(`${items.length}`, tone)}
          </div>
          ${items.length ? items.map((item) => slopRemoverCard(item, tone)).join("") : `<div class="slop-empty">${esc(emptyText)}</div>`}
        </section>`;
      }

      function slopRemoverCard(item, tone) {
        const path = item.path || "changed file";
        const signals = uniqueReviewItems(item.signals || item.categories || [item.category], 5);
        const confidence = item.confidence == null ? "" : pill(`${Math.round(item.confidence * 100)}% confidence`, "info");
        return `<article class="slop-card ${escAttr(tone)}">
          <div class="slop-card-top">
            <h5>
              <button class="code-link" type="button" data-code-path="${escAttr(path)}" aria-label="Open ${escAttr(path)} changed code">
                <code>${esc(path)}</code>
              </button>
            </h5>
          </div>
          <p>${esc(item.message || item.suggested_action || "Review hygiene finding.")}</p>
          <div class="chip-row">
            ${scoreChip(item.score)}
            ${pill(item.category || "slop", item.severity || tone)}
            ${confidence}
          </div>
          <div class="slop-signal-cloud">
            ${signals.length ? signals.map((signal) => `<span class="slop-signal">${esc(signal)}</span>`).join("") : `<span class="slop-signal">review hygiene</span>`}
          </div>
          <div class="slop-action">
            <span>Reviewer action</span>
            <strong>${esc(item.suggested_action || fallbackSlopAction(tone))}</strong>
          </div>
        </article>`;
      }

      function slopSignalBoard(items) {
        const counts = new Map();
        for (const item of items) {
          for (const signal of item.signals || item.categories || [item.category].filter(Boolean)) {
            const key = String(signal || "").trim();
            if (!key) continue;
            counts.set(key, (counts.get(key) || 0) + 1);
          }
        }
        const signals = [...counts.entries()]
          .sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]))
          .slice(0, 10);
        return `<section class="slop-insight-card">
          <span class="review-list-label">Signal fingerprint</span>
          <div class="slop-signal-cloud">
            ${signals.length ? signals.map(([signal, count]) => `<span class="slop-signal">${esc(signal)}${count > 1 ? ` x${count}` : ""}</span>`).join("") : `<span class="slop-signal">No Slop signals</span>`}
          </div>
          <p class="muted">Use these signals to understand why Slop Remover grouped the files into cleanup lanes.</p>
        </section>`;
      }

      function slopCleanupComment(items) {
        const lines = items.length
          ? [
              "Slop Remover found review hygiene items:",
              ...items.slice(0, 5).map((item) => `* ${String(item.disposition || "review").toUpperCase()} ${item.path || "changed file"}: ${item.suggested_action || item.message || "Inspect before merge."}`)
            ]
          : ["Slop Remover found no review hygiene cleanup items."];
        return `<section class="slop-insight-card">
          <span class="review-list-label">Reviewer cleanup note</span>
          <pre>${esc(lines.join("\n"))}</pre>
        </section>`;
      }

      function fallbackSlopAction(tone) {
        if (tone === "remove") return "Remove this change or add a reviewer-visible justification.";
        if (tone === "rework") return "Rework this change before approval.";
        return "Skim after higher-risk cleanup items are resolved.";
      }

      function plural(count, noun) {
        return `${noun}${count === 1 ? "" : "s"}`;
      }

      function slopCard(item) {
        const signals = (item.signals || []).join(", ");
        return `<div class="review-card-top"><h4><code>${esc(item.path || "changed file")}</code></h4>${pill(item.disposition || item.severity || "review")}</div>
          <p>${esc(item.message || item.suggested_action || "Review hygiene finding.")}</p>
          <div class="chip-row">
            ${pill(item.category || "slop", item.severity || "neutral")}
            ${item.score == null ? "" : scoreChip(item.score)}
          </div>
          <div class="muted">${esc(signals || item.suggested_action || "Inspect this change before merge.")}</div>`;
      }

      function evidenceProofContent(summary) {
        const links = summary.evidence_links || [];
        const rows = links.map(evidenceGraphRow);
        const selected = rows[0] || null;
        const stageHeight = Math.max(510, rows.length * 74 + 92);
        return `<div class="evidence-graph" style="--proof-stage-height:${stageHeight}px">
          <section class="proof-graph-stage" aria-label="Requirement proof graph">
            <svg class="proof-graph-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
              ${rows.map((row, index) => evidenceGraphLine(row, index, rows.length)).join("")}
            </svg>
            <div class="proof-graph-labels" aria-hidden="true">
              <span>Claim</span>
              <span>Changed files</span>
              <span>Proof</span>
              <span>Verdict</span>
            </div>
            ${rows.length ? rows.map((row, index) => evidenceGraphNodes(row, index, rows.length)).join("") : `<div class="proof-graph-empty">No requirement evidence was produced for this PR.</div>`}
            <aside id="evidence-graph-detail" class="proof-graph-detail" aria-live="polite">
              ${selected ? evidenceGraphDetail(selected) : `<span class="review-list-label">Selected claim</span><h4>No proof selected</h4><p>No requirement evidence was produced for this PR.</p>`}
            </aside>
          </section>
        </div>`;
      }

      function evidenceGraphRow(item) {
        const tone = evidenceTone(item);
        const changedPaths = cleanEvidencePaths(item.mapped_paths || []);
        const directPaths = cleanEvidencePaths(item.evidence_paths || []);
        const memoryPaths = cleanEvidencePaths([...(item.memory_test_candidates || []), ...(item.memory_evidence_paths || [])]);
        const proofPaths = uniqueReviewItems([...directPaths, ...memoryPaths], 8);
        return {
          ...item,
          tone,
          changedPaths,
          proofPaths,
          memoryCount: Number(item.memory_match_count || 0),
          graphId: item.intent_id || item.intent_text || item.message || `claim-${tone}`
        };
      }

      function cleanEvidencePaths(paths) {
        return uniqueReviewItems((paths || []).filter((path) => path && path !== "."), 8);
      }

      function evidenceGraphLine(row, index, total) {
        const y = evidenceGraphY(index, total);
        const color = evidenceToneColor(row.tone);
        return `
          <path style="--edge-color:${color}" d="M 18 ${y} C 22 ${y}, 25 ${y}, 29 ${y}" />
          <path style="--edge-color:${color}" d="M 35 ${y} C 39 ${y}, 41 ${y}, 45 ${y}" />
          <path style="--edge-color:${color}" d="M 51 ${y} C 55 ${y}, 56 ${y}, 60 ${y}" />
        `;
      }

      function evidenceGraphNodes(row, index, total) {
        const y = evidenceGraphY(index, total);
        const rowY = 60 * index;
        const payload = escAttr(encodeURIComponent(JSON.stringify(row)));
        const active = index === 0 ? " active" : "";
        const id = escAttr(row.graphId);
        const style = `--y:${y}%;--row-y:${rowY}px`;
        return `
          ${evidenceGraphNode(row, id, payload, active, "claim", "Claim", row.intent_text || row.message || "Requirement", "12%", style)}
          ${evidenceGraphNode(row, id, payload, active, "changed", "Changed", `${row.changedPaths.length}`, "29%", style)}
          ${evidenceGraphNode(row, id, payload, active, "proof", "Proof", `${row.proofPaths.length} links`, "45%", style)}
          ${evidenceGraphNode(row, id, payload, active, "verdict", "Verdict", statusLabel(row.evidence_status || row.tone), "60%", style)}
        `;
      }

      function evidenceGraphNode(row, id, payload, active, kind, label, value, x, style) {
        const width = kind === "claim" ? "" : "--node-w:76px;";
        return `<button
          class="proof-graph-node ${escAttr(row.tone)} ${escAttr(kind)}${active}"
          type="button"
          style="--x:${x};${style};${width}"
          data-evidence-node="${id}"
          data-evidence-payload="${payload}"
          aria-label="Open proof details for ${escAttr(row.intent_text || row.message || "requirement")}">
          <span>${esc(label)}</span>
          <strong>${esc(kind === "claim" ? shortLabel(value, 54) : value)}</strong>
        </button>`;
      }

      function evidenceGraphY(index, total) {
        if (total <= 1) return 50;
        return Math.round((18 + (64 / Math.max(1, total - 1)) * index) * 10) / 10;
      }

      function evidenceGraphDetail(row) {
        const confidence = row.confidence == null ? "" : pill(`${Math.round(row.confidence * 100)}% confidence`, "info");
        return `<span class="review-list-label">Selected claim</span>
          <h4>${esc(row.intent_text || row.message || "Requirement")}</h4>
          <div class="chip-row">
            ${pill(row.evidence_status || row.tone, row.tone)}
            ${confidence}
            ${pill(`${row.memoryCount || 0} memory`, row.memoryCount ? "success" : "neutral")}
          </div>
          <div class="proof-chain" aria-label="Selected claim proof chain">
            ${proofNode("Claim", "1")}
            ${proofNode("Changed", row.changedPaths.length || "0")}
            ${proofNode("Proof", row.proofPaths.length || "0")}
            ${proofNode("Verdict", statusLabel(row.evidence_status || row.tone))}
          </div>
          ${evidencePathSection("Changed files", row.changedPaths.slice(0, 6), row.tone)}
          ${evidencePathSection("Proof candidates", row.proofPaths, row.tone)}
          <div class="evidence-action">
            <span>Reviewer action</span>
            <strong>${esc(row.suggested_action || fallbackEvidenceAction(row.tone))}</strong>
          </div>`;
      }

      function decodeEvidenceNode(value) {
        try {
          return JSON.parse(decodeURIComponent(value));
        } catch {
          return {};
        }
      }

      function evidenceToneColor(tone) {
        return tone === "missing" ? "var(--red)" : tone === "verified" ? "var(--green)" : "var(--amber)";
      }

      function evidenceGroups(links) {
        return (links || []).reduce((groups, item) => {
          groups[evidenceTone(item)].push(item);
          return groups;
        }, { missing: [], partial: [], verified: [] });
      }

      function evidenceTone(item) {
        const status = String(item.evidence_status || item.status || "").toLowerCase();
        const directEvidence = countItems(item.evidence_paths);
        if (status.includes("missing") || status.includes("not_found")) return "missing";
        if (status.includes("verified") || status.includes("success") || status.includes("covered") || status.includes("found") || status.includes("pass")) return "verified";
        if (directEvidence > 0 && !status.includes("partial")) return "verified";
        return "partial";
      }

      function evidenceStat(label, value) {
        return `<div class="evidence-stat"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
      }

      function evidenceLane(title, tone, items, description, emptyText) {
        return `<section class="evidence-lane ${escAttr(tone)}">
          <div class="evidence-lane-head">
            <div>
              <span class="review-list-label">${esc(tone)}</span>
              <h4>${esc(title)}</h4>
              <p>${esc(description)}</p>
            </div>
            ${pill(`${items.length}`, tone)}
          </div>
          ${items.length ? items.map((item) => evidenceProofCard(item, tone)).join("") : `<div class="slop-empty">${esc(emptyText)}</div>`}
        </section>`;
      }

      function evidenceProofCard(item, tone) {
        const changedPaths = item.mapped_paths || [];
        const directPaths = item.evidence_paths || [];
        const memoryPaths = uniqueReviewItems([...(item.memory_test_candidates || []), ...(item.memory_evidence_paths || [])], 5);
        const proofPaths = uniqueReviewItems([...directPaths, ...memoryPaths], 6);
        const confidence = item.confidence == null ? "" : pill(`${Math.round(item.confidence * 100)}% confidence`, "info");
        return `<article class="evidence-card">
          <div class="review-card-top">
            <h5>${esc(item.intent_text || item.message || "Requirement")}</h5>
            ${pill(item.evidence_status || tone, tone)}
          </div>
          <div class="proof-chain" aria-label="Evidence proof chain">
            ${proofNode("Claim", "1")}
            ${proofNode("Changed", changedPaths.length || "0")}
            ${proofNode("Proof", proofPaths.length || "0")}
            ${proofNode("Verdict", statusLabel(item.evidence_status || tone))}
          </div>
          <div class="chip-row">
            ${confidence}
            ${pill(`${item.memory_match_count || 0} memory`, item.memory_match_count ? "success" : "neutral")}
          </div>
          ${evidencePathSection("Changed files", changedPaths.slice(0, 5), tone)}
          ${evidencePathSection("Proof candidates", proofPaths, tone)}
          <div class="evidence-action">
            <span>Reviewer action</span>
            <strong>${esc(item.suggested_action || fallbackEvidenceAction(tone))}</strong>
          </div>
        </article>`;
      }

      function proofNode(label, value) {
        return `<div class="proof-node"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
      }

      function evidencePathSection(label, paths, tone) {
        if (!paths.length) {
          return `<div><span class="review-list-label">${esc(label)}</span><div class="evidence-path-cloud"><span class="evidence-path">none linked</span></div></div>`;
        }
        return `<div>
          <span class="review-list-label">${esc(label)}</span>
          <div class="evidence-path-cloud">${paths.map((path) => evidencePathChip(path, tone)).join("")}</div>
        </div>`;
      }

      function evidencePathChip(path, tone) {
        return `<button class="evidence-path ${escAttr(tone)}" type="button" data-code-path="${escAttr(path)}" aria-label="Open ${escAttr(path)} evidence file">${esc(path)}</button>`;
      }

      function fallbackEvidenceAction(tone) {
        if (tone === "missing") return "Add or link proof before merge.";
        if (tone === "partial") return "Extend the related evidence or explain why it is sufficient.";
        return "Verify the linked proof matches the PR claim.";
      }

      function memoryConstellationCount(summary) {
        return memoryConstellationNodes(summary).length;
      }

      function memoryConstellationContent(summary, pr) {
        const memory = summary.semantic_memory || {};
        const nodes = memoryConstellationNodes(summary);
        const selected = nodes[0] || null;
        const indexed = memory.index?.records_stored == null ? "n/a" : `${memory.index.records_stored}`;
        return `<div class="memory-radar">
          <section class="memory-stage" aria-label="Repository memory constellation">
            <div class="memory-radar-stats">
              ${memoryRadarStat("Provider", memory.memory_provider || "not configured")}
              ${memoryRadarStat("Indexed", indexed)}
              ${memoryRadarStat("Tests", `${countItems(summary.related_tests || memory.related_tests)}`)}
              ${memoryRadarStat("Prior PRs", `${countItems(summary.similar_prs || memory.similar_prs)}`)}
            </div>
            <div class="memory-orbit one" aria-hidden="true"></div>
            <div class="memory-orbit two" aria-hidden="true"></div>
            <div class="memory-orbit three" aria-hidden="true"></div>
            <div class="memory-center" aria-label="Current pull request">
              <div>
                <strong>#${esc(pr.number || "")}</strong>
                <span>current PR</span>
              </div>
            </div>
            ${nodes.length ? nodes.map((node, index) => memoryNodeButton(node, index, nodes.length)).join("") : `<div class="memory-empty">No repository memory matches were returned for this PR.</div>`}
            <aside id="memory-node-detail" class="memory-detail-panel" aria-live="polite">
              ${selected ? memoryNodeDetail(selected) : `<span class="review-list-label">Selected memory</span><h4>No memory selected</h4><p>No repository memory matches were returned.</p>`}
            </aside>
          </section>
        </div>`;
      }

      function memoryRadarStat(label, value) {
        return `<div class="memory-radar-stat"><span>${esc(label)}</span><strong>${esc(value)}</strong></div>`;
      }

      function memoryConstellationNodes(summary) {
        const memory = summary.semantic_memory || {};
        const rawItems = [];
        const collect = (items, origin) => {
          for (const item of items || []) rawItems.push(memoryNormalizeNode(item, origin));
        };
        collect(summary.related_tests || memory.related_tests, "related_tests");
        collect(summary.similar_prs || memory.similar_prs, "similar_prs");
        collect(summary.memory_matches || memory.semantic_matches, "semantic_matches");
        collect(memory.recommended_test_updates, "recommended_test_updates");
        for (const item of summary.memory_evidence || memory.requirement_evidence || []) {
          collect(item.matches, "requirement_match");
          collect(item.test_candidates, "requirement_test");
          collect(item.doc_candidates, "requirement_doc");
        }

        const byKey = new Map();
        for (const item of rawItems.filter(Boolean)) {
          const key = `${item.kind}:${item.path || item.title}:${item.pr_number || ""}`;
          const existing = byKey.get(key);
          if (!existing || memoryScore(item) > memoryScore(existing)) {
            byKey.set(key, item);
          }
        }
        return [...byKey.values()]
          .sort((a, b) => memoryScore(b) - memoryScore(a) || memoryKindOrder(a.kind) - memoryKindOrder(b.kind))
          .slice(0, 12);
      }

      function memoryNormalizeNode(item, origin) {
        if (!item) return null;
        const metadata = item.metadata || {};
        const kind = String(item.kind || metadata.type || item.framework || "memory").toLowerCase();
        const path = item.path || metadata.path || "";
        const title = item.title || metadata.title || item.intent || path || item.label || "Repository memory";
        return {
          kind,
          origin,
          title,
          path,
          pr_number: item.pr_number || metadata.pr_number || "",
          score: item.score ?? item.memory_score ?? item.confidence ?? 0.5,
          source: item.source || metadata.source || origin || "repository_memory",
          text: item.text || item.intent || item.summary || item.title || "",
          label: item.label || "",
          url: item.url || "",
          matched_terms: item.matched_terms || [],
          risk_terms: item.risk_terms || metadata.risk_terms || [],
          suggested_action: item.suggested_action || ""
        };
      }

      function memoryNodeButton(node, index, total) {
        const position = memoryNodePosition(node, index, total);
        const size = 58 + Math.round(memoryScore(node) * 34);
        const active = index === 0 ? " active" : "";
        return `<button
          class="memory-node kind-${escAttr(memoryKindClass(node.kind))}${active}"
          type="button"
          style="--x:${position.x}px;--y:${position.y}px;--size:${size}px"
          data-memory-node="true"
          data-memory-payload="${escAttr(encodeURIComponent(JSON.stringify(node)))}"
          aria-label="Open memory hit ${escAttr(node.title)}">
          <span class="memory-node-icon">${esc(memoryKindIcon(node.kind))}</span>
          <span class="memory-node-label">${esc(shortLabel(node.title, 32))}</span>
        </button>`;
      }

      function memoryNodePosition(node, index, total) {
        const radius = memoryKindRadius(node.kind);
        const angle = (total <= 1 ? -90 : -112 + (224 / Math.max(1, total - 1)) * index) * Math.PI / 180;
        return {
          x: Math.round(Math.cos(angle) * radius),
          y: Math.round(Math.sin(angle) * radius)
        };
      }

      function memoryNodeDetail(node) {
        const score = Math.round(memoryScore(node) * 100);
        const terms = uniqueReviewItems([...(node.matched_terms || []), ...(node.risk_terms || [])], 10);
        return `<span class="review-list-label">Selected memory</span>
          <h4>${esc(node.title || "Repository memory")}</h4>
          <div class="chip-row">
            ${pill(memoryKindLabel(node.kind), memoryKindTone(node.kind))}
            ${pill(`${score}% match`, score >= 80 ? "success" : score >= 50 ? "neutral" : "info")}
          </div>
          ${node.path || node.pr_number ? `<div class="evidence-path-cloud">${memoryLocationChip(node)}</div>` : ""}
          <p>${esc(node.text || "Repository memory matched this PR context.")}</p>
          ${terms.length ? `<div><span class="review-list-label">Matched terms</span><div class="slop-signal-cloud">${terms.map((term) => `<span class="slop-signal">${esc(term)}</span>`).join("")}</div></div>` : ""}
          <div class="evidence-action">
            <span>Reviewer action</span>
            <strong>${esc(memoryNodeAction(node))}</strong>
          </div>`;
      }

      function memoryLocationChip(node) {
        if (node.path && node.path !== ".") {
          return `<button class="evidence-path ${escAttr(memoryKindTone(node.kind))}" type="button" data-code-path="${escAttr(node.path)}" aria-label="Open ${escAttr(node.path)} memory file">${esc(node.path)}</button>`;
        }
        if (node.pr_number) return `<span class="evidence-path">PR #${esc(node.pr_number)}</span>`;
        return `<span class="evidence-path">${esc(node.source || "repository memory")}</span>`;
      }

      function decodeMemoryNode(value) {
        try {
          return JSON.parse(decodeURIComponent(value));
        } catch {
          return {};
        }
      }

      function memoryScore(node) {
        const raw = Number(node?.score ?? 0);
        if (!Number.isFinite(raw)) return 0;
        return Math.max(0, Math.min(1, raw > 1 ? raw / 100 : raw));
      }

      function memoryKindRadius(kind) {
        const key = memoryKindClass(kind);
        if (key === "test") return 124;
        if (key === "doc" || key === "policy") return 166;
        if (key === "prior_pr") return 212;
        return 190;
      }

      function memoryKindOrder(kind) {
        return { test: 0, policy: 1, doc: 2, prior_pr: 3 }[memoryKindClass(kind)] ?? 9;
      }

      function memoryKindClass(kind) {
        const key = String(kind || "memory").toLowerCase().replace(/[^a-z0-9]+/g, "_");
        if (key.includes("prior")) return "prior_pr";
        if (key.includes("test")) return "test";
        if (key.includes("policy")) return "policy";
        if (key.includes("doc")) return "doc";
        return key || "memory";
      }

      function memoryKindIcon(kind) {
        return { test: "T", doc: "D", policy: "P", prior_pr: "PR" }[memoryKindClass(kind)] || "M";
      }

      function memoryKindLabel(kind) {
        return {
          test: "related test",
          doc: "doc",
          policy: "policy",
          prior_pr: "prior PR"
        }[memoryKindClass(kind)] || "memory";
      }

      function memoryKindTone(kind) {
        return {
          test: "success",
          doc: "info",
          policy: "review",
          prior_pr: "queued"
        }[memoryKindClass(kind)] || "info";
      }

      function memoryNodeAction(node) {
        if (node.suggested_action) return node.suggested_action;
        const kind = memoryKindClass(node.kind);
        if (kind === "test") return "Inspect or extend this related test for the current PR behavior.";
        if (kind === "policy") return "Use this policy as review context before approving the PR.";
        if (kind === "doc") return "Compare the PR behavior against this repository documentation.";
        if (kind === "prior_pr") return "Compare this change with the prior PR decision and required checks.";
        return "Review this memory hit for useful PR context.";
      }

      function shortLabel(value, limit) {
        const text = String(value || "");
        return text.length > limit ? `${text.slice(0, limit - 1)}...` : text;
      }

      function stableNumber(value) {
        return String(value || "").split("").reduce((hash, char) => {
          return (hash * 31 + char.charCodeAt(0)) >>> 0;
        }, 7);
      }

      function evidenceCard(item) {
        return `<div class="review-card-top"><h4>${esc(item.intent_text || item.message || "Evidence")}</h4>${pill(item.evidence_status || item.severity || "info")}</div>
          <p>${esc(item.suggested_action || "")}</p>
          <div class="muted">${esc((item.mapped_paths || item.evidence_paths || []).join(", ") || "no mapped paths")}</div>`;
      }

      function memoryEvidenceCard(item) {
        const candidates = [
          ...(item.test_candidates || []),
          ...(item.doc_candidates || [])
        ].map((candidate) => candidate.path || candidate.title).filter(Boolean);
        return `<div class="review-card-top"><h4>${esc(item.intent_text || "Requirement memory")}</h4>${pill(item.status || "unknown")}</div>
          <p>${esc(item.suggested_action || "Review retrieved repository memory.")}</p>
          <div class="muted">${esc(candidates.join(", ") || "no candidate paths")}</div>`;
      }

      function memoryHitCard(item) {
        const score = item.score == null ? "" : ` ${Math.round(Number(item.score) * 100)}%`;
        return `<div class="review-card-top"><h4>${item.path ? `<code>${esc(item.path)}</code>` : esc(item.title || item.label || "Memory")}</h4>${pill(`${item.kind || "memory"}${score}`, "info")}</div>
          <p>${esc(item.text || item.title || "")}</p>
          <div class="muted">${esc(item.source || item.label || "repository memory")}</div>`;
      }

      function agentDecisionMeshContent(run, agentNames) {
        const agents = agentDecisionAgents(run, agentNames);
        const stats = agentDecisionStats(agents, run);
        const confidence = stats.confidence;
        return `<div class="agent-decision-mesh">
          <section class="agent-mesh-hero">
            <div class="agent-mesh-core">
              <div class="agent-mesh-orb" style="--mesh-score:${confidence}">${confidence}</div>
              <div>
                <h4>${esc(stats.failed ? "Agent council found blockers" : "Agent council completed")}</h4>
                <p>${esc(`${stats.completed}/${stats.total} agents completed. ${stats.failed} failed, ${stats.review} require reviewer attention.`)}</p>
              </div>
              <div class="chip-row">
                ${pill(`${stats.completed} done`, "success")}
                ${pill(`${stats.failed} failed`, stats.failed ? "block" : "success")}
                ${pill(`${confidence}% confidence`, confidence >= 70 ? "success" : "review")}
              </div>
            </div>
            <div class="agent-stage-chain" aria-label="Agent pipeline stage summary">
              ${agentPipelineLayers.map((layer) => agentStageLink(layer, agents, run)).join("")}
            </div>
          </section>
          <section class="agent-command-grid" aria-label="Agent output map">
            ${agentPipelineLayers.map((layer) => agentDecisionStage(layer, agents, run)).join("")}
          </section>
        </div>`;
      }

      function agentDecisionAgents(run, agentNames) {
        const byId = new Map();
        for (const agent of state.agents || []) byId.set(agent.id, agent);
        for (const name of agentNames || []) {
          if (!byId.has(name)) byId.set(name, {
            id: name,
            label: humanizeAgentId(name),
            stage: "agent",
            description: ""
          });
        }
        return [...byId.values()].filter((agent) => run?.agent_results?.[agent.id] || (agentNames || []).includes(agent.id));
      }

      function agentDecisionStats(agents, run) {
        const results = run?.agent_results || {};
        let completed = 0;
        let failed = 0;
        let review = 0;
        let confidenceTotal = 0;
        let confidenceCount = 0;
        for (const agent of agents) {
          const result = results[agent.id] || {};
          const tone = normalizeTone(result.status || "unknown");
          if (tone === "success") completed += 1;
          if (tone === "block") failed += 1;
          if (tone === "review") review += 1;
          if (result.confidence != null) {
            confidenceTotal += percentValue(result.confidence);
            confidenceCount += 1;
          }
        }
        return {
          total: agents.length,
          completed,
          failed,
          review,
          confidence: confidenceCount ? Math.round(confidenceTotal / confidenceCount) : 0
        };
      }

      function agentStageLink(layer, agents, run) {
        const stageAgents = layer.agentIds
          .map((agentId) => agents.find((agent) => agent.id === agentId))
          .filter(Boolean);
        const stats = agentDecisionStats(stageAgents, run);
        const tone = stats.failed ? "var(--red)" : stats.review ? "var(--amber)" : "var(--green)";
        return `<div class="agent-stage-link" style="--stage-color:${tone}">
          <span>${esc(layer.kicker)}</span>
          <strong>${esc(layer.title)}</strong>
          <small>${esc(`${stats.completed}/${stageAgents.length} complete`)}</small>
        </div>`;
      }

      function agentDecisionStage(layer, agents, run) {
        const stageAgents = layer.agentIds
          .map((agentId) => agents.find((agent) => agent.id === agentId))
          .filter(Boolean);
        const stats = agentDecisionStats(stageAgents, run);
        return `<section class="agent-command-stage">
          <div class="agent-command-head">
            <div>
              <span class="review-list-label">${esc(layer.kicker)}</span>
              <h4>${esc(layer.title)}</h4>
            </div>
            ${pill(`${stats.completed}/${stageAgents.length}`, stats.failed ? "block" : "success")}
          </div>
          ${stageAgents.length ? stageAgents.map((agent) => agentDecisionNode(agent, run)).join("") : `<div class="slop-empty">No agent output for this stage.</div>`}
        </section>`;
      }

      function agentDecisionNode(agent, run) {
        const result = run?.agent_results?.[agent.id] || {};
        const tone = normalizeTone(result.status || "unknown");
        const confidence = percentValue(result.confidence);
        const visual = agentVisual(agent);
        return `<button class="agent-command-node ${escAttr(tone)}" type="button" data-agent-detail-id="${escAttr(agent.id)}" style="--agent-score:${confidence}">
          <span class="agent-node-top">
            <span class="agent-icon ${escAttr(visual.tone)}">${esc(visual.icon)}</span>
            <span>
              <span class="review-list-label">${esc(agent.stage || "agent")}</span>
              <h5>${esc(agent.label || humanizeAgentId(agent.id))}</h5>
            </span>
            <span class="agent-confidence-ring">${confidence}</span>
          </span>
          <p>${esc(agentDecisionMessage(result, agent))}</p>
          <span class="agent-output-tags">
            ${agentOutputTags(result).map((tag) => `<span class="agent-output-tag">${esc(tag)}</span>`).join("")}
          </span>
        </button>`;
      }

      function agentDecisionMessage(result, agent) {
        const message = (result.messages || [])[0];
        if (message) return message;
        if (result.status) return `${agent.label || humanizeAgentId(agent.id)} returned ${statusLabel(result.status)}.`;
        return agent.description || "No detailed message was returned by this agent.";
      }

      function agentOutputTags(result) {
        const output = result.output || {};
        const tags = [];
        for (const [key, value] of Object.entries(output).slice(0, 6)) {
          if (Array.isArray(value)) tags.push(`${key}: ${value.length}`);
          else if (value && typeof value === "object") tags.push(`${key}: ${Object.keys(value).length}`);
          else if (value != null && value !== "") tags.push(`${key}: ${shortLabel(value, 18)}`);
        }
        return tags.length ? tags : [statusLabel(result.status || "ready")];
      }

      function humanizeAgentId(id) {
        return String(id || "agent")
          .replace(/[-_]+/g, " ")
          .replace(/\b\w/g, (char) => char.toUpperCase());
      }

      function testCockpitCount(summary) {
        const coverage = summary.test_coverage || {};
        return countItems(arrayFallback(summary.test_coverage_matrix, coverage.coverage_matrix)) +
          countItems(arrayFallback(summary.test_coverage_findings, coverage.coverage_findings)) +
          countItems(uniqueTestRecommendations(coverage.recommendations || [], 99));
      }

      function testCockpitContent(summary) {
        const coverage = summary.test_coverage || {};
        const findings = arrayFallback(summary.test_coverage_findings, coverage.coverage_findings);
        const matrix = arrayFallback(summary.test_coverage_matrix, coverage.coverage_matrix);
        const behaviorCoverage = coverage.behavior_coverage || [];
        const intentCoverage = coverage.intent_coverage || [];
        const recommendations = uniqueTestRecommendations([
          ...(coverage.recommendations || []),
          ...(summary.suggested_tests || [])
        ], 6);
        const score = percentValue(coverage.coverage_score);
        const confidence = percentValue(coverage.confidence);
        const gapCount = findings.filter((item) => testTargetTone(item) !== "covered").length;
        const targets = matrix.length ? matrix : [...behaviorCoverage, ...intentCoverage];
        const rows = coverageRequirementRows(targets, findings, recommendations);
        const present = rows.filter((row) => row.coverage >= 70).length;
        const toAdd = rows.filter((row) => row.coverage > 0 && row.coverage < 70).length;
        const critical = rows.filter((row) => row.coverage === 0 || row.tone === "missing").length;
        const criticalRow = rows.find((row) => row.coverage === 0 || row.tone === "missing") || rows[0];
        return `<div class="coverage-sun-view">
          <section class="coverage-sun-head">
            <div>
              <span class="review-list-label">Tests / coverage sun</span>
              <h4>One picture for "is this PR tested?"</h4>
              <p>Each requirement is a wedge. Filled wedges already have useful tests; empty wedges are review debt and should receive a new or extended test.</p>
            </div>
            <div class="coverage-sun-badges">
              ${pill(`${present} present`, present ? "success" : "neutral")}
              ${pill(`${toAdd} to add`, toAdd ? "review" : "success")}
              ${pill(`${critical} critical`, critical ? "block" : "success")}
            </div>
          </section>
          <section class="coverage-sun-layout">
            <div class="coverage-sun-card">
              <div class="coverage-sun" style="--coverage-sun:${coverageSunGradient(rows)}">
