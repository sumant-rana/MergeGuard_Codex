                <div class="coverage-sun-center"><div><strong>${score}</strong><span>overall</span></div></div>
              </div>
              ${rows.slice(0, 8).map((row, index) => coverageSunLabel(row, index, rows.length)).join("")}
            </div>
            <div class="coverage-req-list">
              ${rows.length ? rows.slice(0, 8).map(coverageRequirementRow).join("") : `<div class="slop-empty">No changed source targets required tests.</div>`}
              ${criticalRow ? `<div class="coverage-critical"><span>Critical gap</span><strong>${esc(coverageCriticalText(criticalRow, findings))}</strong></div>` : ""}
              <div class="chip-row">
                ${pill(`${confidence}% confidence`, "info")}
                ${pill(`${recommendations.length} test ideas`, recommendations.length ? "review" : "success")}
              </div>
            </div>
          </section>
        </div>`;
      }

      function coverageRequirementRows(targets, findings, recommendations) {
        const rows = [];
        for (const item of targets || []) {
          const coverage = percentValue(item.coverage);
          const tone = testTargetTone(item);
          const label = coverageRequirementLabel(item);
          rows.push({
            label,
            path: item.path || "",
            coverage,
            tone,
            status: item.status || tone,
            reason: item.reason || relatedFindingsForPath(findings, item.path)[0]?.message || "Coverage target generated from changed behavior.",
            action: relatedFindingsForPath(findings, item.path)[0]?.suggested_action || "Add or link a changed test for this target."
          });
        }
        if (!rows.length) {
          for (const item of findings || []) {
            rows.push({
              label: coverageRequirementLabel(item),
              path: item.path || "",
              coverage: 0,
              tone: "missing",
              status: item.severity || "missing",
              reason: item.message || "Coverage gap detected.",
              action: item.suggested_action || "Add or link changed-test evidence."
            });
          }
        }
        for (const item of recommendations || []) {
          if (rows.length >= 8) break;
          rows.push({
            label: item.intent || item.path || "Suggested test",
            path: item.path || "",
            coverage: 25,
            tone: "partial",
            status: "to add",
            reason: item.intent || "Generated test recommendation.",
            action: item.path ? `Add or extend ${item.path}.` : "Add a focused test."
          });
        }
        return rows.slice(0, 8);
      }

      function coverageRequirementLabel(item) {
        const raw = item.intent || item.intent_text || item.symbol || item.path || item.message || "changed behavior";
        return String(raw).replaceAll("_", " ");
      }

      function coverageSunGradient(rows) {
        if (!rows.length) return "conic-gradient(color-mix(in oklab, var(--muted) 18%, transparent) 0 100%)";
        const step = 100 / rows.length;
        const stops = [];
        rows.forEach((row, index) => {
          const start = index * step;
          const end = (index + 1) * step;
          const gap = Math.min(0.7, step * 0.1);
          const color = coverageToneColor(row);
          const fillColor = row.coverage === 0 ? `color-mix(in oklab, ${color} 16%, var(--surface-inset))` : color;
          stops.push(`${fillColor} ${start.toFixed(2)}% ${(end - gap).toFixed(2)}%`);
          stops.push(`var(--surface-inset) ${(end - gap).toFixed(2)}% ${end.toFixed(2)}%`);
        });
        return `conic-gradient(${stops.join(",")})`;
      }

      function coverageSunLabel(row, index, total) {
        const angle = (-90 + (360 / Math.max(total, 1)) * (index + 0.5)) * Math.PI / 180;
        const radius = 206;
        const x = Math.round(Math.cos(angle) * radius);
        const y = Math.round(Math.sin(angle) * radius);
        return `<span class="coverage-sun-label" style="--lx:${x}px;--ly:${y}px;--label-color:${coverageToneColor(row)}">
          R${index + 1}<small>${row.coverage}%</small>
        </span>`;
      }

      function coverageRequirementRow(row, index) {
        return `<article class="coverage-req-row ${escAttr(row.tone)}" style="--coverage:${row.coverage};--req-color:${coverageToneColor(row)}">
          <div class="coverage-req-top">
            <h5>R${index + 1} · ${row.path ? codePathButton(row.path) : esc(shortLabel(row.label, 46))}</h5>
            ${pill(`${row.coverage}%`, row.tone)}
          </div>
          <div class="coverage-req-bar"><span></span></div>
          <p>${esc(row.reason)}</p>
        </article>`;
      }

      function coverageToneColor(row) {
        if (row.tone === "missing" || row.coverage === 0) return "var(--red)";
        if (row.coverage >= 70 || row.tone === "covered") return "var(--green)";
        return "var(--amber)";
      }

      function coverageCriticalText(row, findings) {
        const finding = relatedFindingsForPath(findings, row.path)[0];
        return finding?.suggested_action || row.action || `${row.label} needs changed-test evidence before merge.`;
      }

      function testCockpitSummary(score, gaps, targets) {
        if (!targets) return "No changed source targets were reported by the test coverage agent.";
        if (score >= 80 && gaps === 0) return "Changed behavior has enough direct test evidence for reviewer confidence.";
        if (gaps > 0) return `${gaps} source target${gaps === 1 ? "" : "s"} still need changed-test proof before merge.`;
        return "Some coverage exists, but the reviewer should confirm it exercises the changed behavior.";
      }

      function testTargetCard(item, findings) {
        const coverage = percentValue(item.coverage);
        const tone = testTargetTone(item);
        const path = item.path || item.symbol || "changed behavior";
        const matchedTests = (item.matched_tests || []).map((test) => test.path || test.title).filter(Boolean);
        const relatedFindings = relatedFindingsForPath(findings, item.path);
        const reason = item.reason || relatedFindings[0]?.message || "Coverage target generated from changed behavior.";
        const action = relatedFindings[0]?.suggested_action || (matchedTests.length ? "Verify the matched tests assert the changed behavior." : "Add or link a changed test for this target.");
        return `<article class="test-target ${escAttr(tone)}" style="--target-score:${coverage}">
          <div class="test-target-head">
            <div>
              <span class="review-list-label">${esc(item.classification || item.symbol || "source target")}</span>
              <h5>${path ? codePathButton(path) : "Changed target"}</h5>
            </div>
            ${pill(item.status || tone, tone)}
          </div>
          <div class="test-target-meter" aria-label="Coverage ${coverage}%"><span></span></div>
          <p>${esc(reason)}</p>
          <div class="evidence-path-cloud">
            ${matchedTests.length ? matchedTests.slice(0, 3).map((test) => evidencePathChip(test, tone)).join("") : `<span class="evidence-path ${escAttr(tone)}">no matched tests</span>`}
          </div>
          <div class="evidence-action"><span>Reviewer action</span><strong>${esc(action)}</strong></div>
        </article>`;
      }

      function testRecommendationCard(item) {
        const score = item.memory_score == null ? "" : pill(`${Math.round(memoryScore({ score: item.memory_score }) * 100)}% memory`, "success");
        return `<article class="test-rec-card">
          <div class="review-card-top">
            <h5>${item.path ? codePathButton(item.path) : esc(item.framework || "test idea")}</h5>
            ${score || pill(item.framework || "repo-default", "info")}
          </div>
          <p>${esc(item.intent || "Add a focused test that proves the changed behavior.")}</p>
        </article>`;
      }

      function behaviorShiftContent(summary) {
        const deltas = summary.behavioral_deltas || [];
        const blast = summary.blast_radius || [];
        const nodes = behaviorBlastNodes(deltas, blast);
        const magnitude = nodes.length ? Math.max(...nodes.map((node) => node.magnitude)) : 0;
        const epicenter = deltas[0]?.symbol || deltas[0]?.path || blast[0]?.path || "changed behavior";
        return `<div class="behavior-radar">
          <section class="behavior-radar-head">
            <div>
              <span class="review-list-label">Behavior / blast radius radar</span>
              <h4>Concentric blast rings radiate from the changed behavior.</h4>
              <p>Ring 1 is direct behavior, ring 2 is services and callers, ring 3 is downstream impact. Larger nodes and red rings deserve earlier inspection.</p>
            </div>
            <div class="behavior-radar-badges">
              ${pill(`magnitude ${magnitude}`, magnitude >= 70 ? "block" : "review")}
              ${pill(`${nodes.length} entities`, "info")}
              ${pill(`${deltas.length} deltas`, deltas.length ? "review" : "success")}
            </div>
          </section>
          <section class="behavior-radar-layout">
            <div class="behavior-radar-stage">
              <div class="behavior-radar-ring one" aria-hidden="true"></div>
              <div class="behavior-radar-ring two" aria-hidden="true"></div>
              <div class="behavior-radar-ring three" aria-hidden="true"></div>
              <div class="behavior-epicenter"><div><span>epicenter</span><strong>${esc(shortLabel(epicenter, 34))}</strong></div></div>
              ${nodes.map(behaviorRadarNode).join("")}
            </div>
            <div class="behavior-delta-stack">
              <span class="review-list-label">Behavior deltas</span>
              ${deltas.length ? deltas.slice(0, 5).map(behaviorDeltaCard).join("") : `<div class="slop-empty">No runtime behavior deltas detected.</div>`}
            </div>
          </section>
        </div>`;
      }

      function behaviorBlastNodes(deltas, blast) {
        const raw = [];
        for (const item of deltas || []) {
          raw.push({
            label: item.symbol || item.path || "behavior",
            magnitude: normalizeTone(item.severity) === "block" ? 90 : 72,
            ring: 1,
            tone: normalizeTone(item.severity) === "success" ? "low" : "high"
          });
        }
        for (const item of blast || []) {
          for (const service of item.downstream_services || []) raw.push({ label: service, magnitude: 72, ring: 2, tone: "medium" });
          for (const caller of item.direct_callers || []) raw.push({ label: caller, magnitude: 58, ring: 2, tone: "medium" });
          if (item.path) raw.push({ label: item.path, magnitude: 48, ring: 3, tone: "low" });
        }
        const byLabel = new Map();
        for (const node of raw) {
          const key = String(node.label || "").toLowerCase();
          if (!key) continue;
          const existing = byLabel.get(key);
          if (!existing || existing.magnitude < node.magnitude) byLabel.set(key, node);
        }
        return [...byLabel.values()].slice(0, 9).map((node, index, list) => {
          const ringRadius = node.ring === 1 ? 142 : node.ring === 2 ? 204 : 252;
          const angle = (-105 + (300 / Math.max(1, list.length - 1)) * index) * Math.PI / 180;
          return {
            ...node,
            x: Math.round(Math.cos(angle) * ringRadius),
            y: Math.round(Math.sin(angle) * ringRadius),
            size: 48 + Math.round(node.magnitude / 3.8)
          };
        });
      }

      function behaviorRadarNode(node) {
        return `<div class="behavior-radar-node ${escAttr(node.tone)}" style="--x:${node.x}px;--y:${node.y}px;--size:${node.size}px;--magnitude:${node.magnitude}">
          ${esc(node.magnitude)}
          <span class="behavior-radar-label">${esc(shortLabel(node.label, 26))}</span>
        </div>`;
      }

      function behaviorDeltaCard(item) {
        const tone = normalizeTone(item.severity) === "block" ? "high" : normalizeTone(item.severity) === "success" ? "low" : "medium";
        const path = item.path || item.symbol || "changed behavior";
        return `<article class="behavior-delta-card ${escAttr(tone)}">
          <span class="review-list-label">Divergent input</span>
          <h5>${path ? codePathButton(path) : esc(item.symbol || "Behavior change")}</h5>
          <p>${esc(item.divergent_input || "Changed input or state observed by the behavior agent.")}</p>
          <p>${esc(item.new_behavior || item.summary || "Head behavior differs from the base model.")}</p>
        </article>`;
      }

      function behaviorShiftRow(item) {
        const tone = normalizeTone(item.severity || "review_required");
        const path = item.path || item.symbol || "changed behavior";
        return `<div class="behavior-row">
          <article class="behavior-cell before">
            <span class="review-list-label">Before</span>
            <h5>${esc(item.symbol || "Existing behavior")}</h5>
            <p>${esc(item.old_behavior || "Base behavior followed the previous implementation.")}</p>
          </article>
          <span class="behavior-arrow" aria-hidden="true"></span>
          <article class="behavior-cell trigger">
            <span class="review-list-label">Trigger input</span>
            <h5>${path ? codePathButton(path) : "Input"}</h5>
            <p>${esc(item.divergent_input || "Changed input or state observed by the behavior agent.")}</p>
          </article>
          <span class="behavior-arrow" aria-hidden="true"></span>
          <article class="behavior-cell ${escAttr(tone)}">
            <div class="review-card-top">
              <span class="review-list-label">After</span>
              ${pill(item.severity || "review", tone)}
            </div>
            <h5>${esc(item.symbol || "Runtime result")}</h5>
            <p>${esc(item.new_behavior || item.summary || "Head behavior differs from the base model.")}</p>
          </article>
        </div>`;
      }

      function blastImpactCard(item) {
        return `<article class="behavior-cell">
          <div class="review-card-top">
            <span class="review-list-label">Blast radius</span>
            ${pill(`${countItems(item.downstream_services)} services`, "info")}
          </div>
          <h5>${item.path ? codePathButton(item.path) : "Downstream impact"}</h5>
          <p>${esc((item.downstream_services || []).join(", ") || "No downstream service listed.")}</p>
          <div class="muted">Callers: ${esc((item.direct_callers || []).join(", ") || "none")}</div>
        </article>`;
      }

      function guardrailFirewallCount(summary) {
        return countItems(summary.policy_findings) + countItems(summary.prompt_canary_runs) + countItems(summary.checks);
      }

      function guardrailFirewallContent(summary) {
        const policy = summary.policy_findings || [];
        const prompts = summary.prompt_canary_runs || [];
        const checks = summary.checks || [];
        const blockers = [
          ...policy.filter((item) => normalizeTone(item.severity) === "block"),
          ...prompts.filter((item) => normalizeTone(item.status) === "block"),
          ...checks.filter((item) => normalizeTone(item.conclusion || item.status) === "block")
        ];
        return `<div class="gate-firewall">
          <section class="gate-stage">
            <aside class="gate-packet">
              <div class="gate-packet-icon">PR</div>
              <div>
                <h4>${blockers.length ? "Merge packet blocked" : "Merge packet clear"}</h4>
                <p>${esc(blockers.length ? `${blockers.length} gate${blockers.length === 1 ? "" : "s"} require reviewer action before merge.` : "Policy, prompt, and required checks are not blocking this PR.")}</p>
              </div>
              <div class="chip-row">
                ${pill(`${policy.length} policy`, policy.some((item) => normalizeTone(item.severity) === "block") ? "block" : "success")}
                ${pill(`${prompts.length} prompt`, prompts.some((item) => normalizeTone(item.status) === "block") ? "block" : "success")}
                ${pill(`${checks.length} checks`, checks.some((item) => normalizeTone(item.conclusion || item.status) === "block") ? "block" : "success")}
              </div>
            </aside>
            <div class="gate-wall">
              ${policy.length ? policy.slice(0, 5).map(policyGateCard).join("") : gatePassCard("Policy gate", "No policy guardrail blockers were returned.")}
              ${prompts.length ? prompts.slice(0, 3).map(promptGateCard).join("") : gatePassCard("Prompt gate", "No prompt drift checks required reviewer action.")}
              ${checks.length ? checkGateCard(checks) : gatePassCard("Required checks", "No required check details were returned.")}
            </div>
          </section>
        </div>`;
      }

      function policyGateCard(item) {
        const tone = normalizeTone(item.severity || "warn");
        return `<article class="gate-card ${escAttr(tone)}">
          <div class="review-card-top">
            <h5>${esc(item.rule_id || item.concept || "Policy gate")}</h5>
            ${pill(item.severity || "warn", tone)}
          </div>
          <p>${esc(item.message || "Policy guardrail needs review.")}</p>
          ${item.path ? `<div class="evidence-path-cloud">${evidencePathChip(item.path, tone)}</div>` : ""}
          <div class="evidence-action">
            <span>${esc(item.owner || "Reviewer action")}</span>
            <strong>${esc(item.suggested_action || "Resolve policy gate or request an owner override.")}</strong>
          </div>
        </article>`;
      }

      function promptGateCard(item) {
        const tone = normalizeTone(item.status || "unknown");
        return `<article class="gate-card ${escAttr(tone)}">
          <div class="review-card-top">
            <h5>${esc(displayPromptSuiteName(item.suite || item.prompt_path || "Prompt drift"))}</h5>
            ${pill(item.status || "unknown", tone)}
          </div>
          <p>${esc(item.drift_summary || item.prompt_path || "Prompt output stayed within configured thresholds.")}</p>
          <div class="prompt-metrics">
            ${promptMetricBar("correctness", item.correctness)}
            ${promptMetricBar("format", item.format)}
            ${promptMetricBar("refusal", item.refusal)}
            ${promptMetricBar("cost delta", item.cost_delta_pct)}
          </div>
        </article>`;
      }

      function checkGateCard(checks) {
        return `<article class="gate-card ${checks.some((item) => normalizeTone(item.conclusion || item.status) === "block") ? "block" : "success"}">
          <div class="review-card-top">
            <h5>Required checks</h5>
            ${pill(`${checks.length} checks`, "info")}
          </div>
          <p>Reviewer-facing check posture synthesized from all MergeGuard agents.</p>
          <div class="gate-check-grid">
            ${checks.slice(0, 14).map((item) => `<span class="gate-check-dot ${escAttr(normalizeTone(item.conclusion || item.status))}">${esc(shortLabel(item.name || item.check || "check", 28))}</span>`).join("")}
          </div>
        </article>`;
      }

      function gatePassCard(title, text) {
        return `<article class="gate-card success">
          <div class="review-card-top"><h5>${esc(title)}</h5>${pill("pass", "success")}</div>
          <p>${esc(text)}</p>
        </article>`;
      }

      function promptMetricBar(label, value) {
        if (value == null || value === "") return "";
        const pct = percentValue(value);
        return `<div class="prompt-bar" style="--bar-value:${pct}">
          <span>${esc(label)}</span>
          <span aria-label="${escAttr(label)} ${pct}%"></span>
          <strong>${esc(pct)}%</strong>
        </div>`;
      }

      function contractXrayContent(summary) {
        const findings = summary.contract_findings || [];
        const tests = uniqueTestRecommendations([
          ...(summary.suggested_tests || []),
          ...findings.map((item) => item.suggested_test).filter(Boolean)
        ], 6);
        return `<div class="contract-xray">
          <section class="contract-stage">
            <div class="contract-finding-list">
              ${findings.length ? findings.slice(0, 5).map(contractXrayFinding).join("") : `<div class="slop-empty">No runtime contract drift was detected.</div>`}
            </div>
            <aside class="contract-rail">
              <div>
                <h4>Compatibility tests</h4>
                <p>Generated tests that prove consumers still receive the contract they expect.</p>
              </div>
              ${tests.length ? tests.map(contractTestCard).join("") : `<div class="slop-empty">No generated contract test suggestions.</div>`}
            </aside>
          </section>
        </div>`;
      }

      function contractXrayFinding(item) {
        const oldContract = item.old_contract || {};
        const newContract = item.new_contract || {};
        const diff = contractDiff(oldContract, newContract);
        return `<article class="contract-finding">
          <div class="review-card-top">
            <div>
              <span class="review-list-label">${esc(item.symbol || "contract")}</span>
              <h5>${item.path ? codePathButton(item.path) : esc(item.symbol || "Contract drift")}</h5>
            </div>
            ${pill(item.severity || "review", normalizeTone(item.severity))}
          </div>
          <div class="contract-xray-row">
            ${contractShape("Base contract", oldContract, diff.oldStatuses)}
            <span class="contract-arrow" aria-hidden="true"></span>
            ${contractShape("Head contract", newContract, diff.newStatuses)}
          </div>
          <p>${esc(item.violated_assumption || contractDiffSummary(diff))}</p>
          <div class="chip-row">
            ${pill(`${diff.removed.length} removed`, diff.removed.length ? "block" : "success")}
            ${pill(`${diff.added.length} added`, diff.added.length ? "info" : "success")}
            ${pill(`${diff.changed.length} changed`, diff.changed.length ? "review" : "success")}
          </div>
        </article>`;
      }

      function contractShape(title, contract, statuses) {
        const entries = Object.entries(contract || {});
        return `<div class="contract-shape">
          <h6>${esc(title)}</h6>
          ${entries.length ? entries.map(([key, value]) => contractField(key, value, statuses[key] || "unchanged")).join("") : `<span class="contract-field removed">empty</span>`}
        </div>`;
      }

      function contractField(key, value, status) {
        return `<span class="contract-field ${escAttr(status)}">
          <code>${esc(key)}</code>
          <small>${esc(contractTypeLabel(value))}</small>
        </span>`;
      }

      function contractTestCard(item) {
        return `<article class="contract-test-card">
          <div class="review-card-top">
            <h5>${item.path ? codePathButton(item.path) : esc(item.framework || "contract test")}</h5>
            ${pill(item.framework || "repo-default", "info")}
          </div>
          <p>${esc(item.intent || "Assert backward-compatible runtime contract shape.")}</p>
        </article>`;
      }

      function contractDiff(oldContract, newContract) {
        const oldKeys = Object.keys(oldContract || {});
        const newKeys = Object.keys(newContract || {});
        const removed = oldKeys.filter((key) => !newKeys.includes(key));
        const added = newKeys.filter((key) => !oldKeys.includes(key));
        const changed = oldKeys.filter((key) => newKeys.includes(key) && contractTypeLabel(oldContract[key]) !== contractTypeLabel(newContract[key]));
        const oldStatuses = {};
        const newStatuses = {};
        for (const key of removed) oldStatuses[key] = "removed";
        for (const key of added) newStatuses[key] = "added";
        for (const key of changed) {
          oldStatuses[key] = "changed";
          newStatuses[key] = "changed";
        }
        return { removed, added, changed, oldStatuses, newStatuses };
      }

      function contractDiffSummary(diff) {
        const pieces = [];
        if (diff.removed.length) pieces.push(`removed fields: ${diff.removed.join(", ")}`);
        if (diff.added.length) pieces.push(`added fields: ${diff.added.join(", ")}`);
        if (diff.changed.length) pieces.push(`changed fields: ${diff.changed.join(", ")}`);
        return pieces.join("; ") || "No field-level shape change was detected.";
      }

      function contractTypeLabel(value) {
        if (value == null) return "null";
        if (Array.isArray(value)) return "array";
        if (typeof value === "object") return "object";
        return String(value);
      }

      function arrayFallback(primary, fallback) {
        return Array.isArray(primary) && primary.length ? primary : (Array.isArray(fallback) ? fallback : []);
      }

      function relatedFindingsForPath(findings, path) {
        if (!path) return [];
        return (findings || []).filter((item) => item.path === path);
      }

      function uniqueTestRecommendations(items, limit = 6) {
        const byKey = new Map();
        for (const item of items || []) {
          if (!item) continue;
          const key = `${item.path || ""}:${item.intent || ""}:${item.framework || ""}`;
          if (!byKey.has(key)) byKey.set(key, item);
        }
        return [...byKey.values()].slice(0, limit);
      }

      function percentValue(value) {
        const numeric = Number(value);
        if (!Number.isFinite(numeric)) return 0;
        const scaled = numeric <= 1 ? numeric * 100 : numeric;
        return Math.max(0, Math.min(100, Math.round(scaled)));
      }

      function toneColorForScore(score) {
        if (score >= 80) return "var(--green)";
        if (score >= 45) return "var(--amber)";
        return "var(--red)";
      }

      function testTargetTone(item) {
        const status = String(item.status || item.severity || "").toLowerCase();
        const coverage = percentValue(item.coverage);
        if (status.includes("missing") || status.includes("block") || status.includes("fail")) return "missing";
        if (status.includes("cover") || status.includes("pass") || coverage >= 80) return "covered";
        if (coverage > 0 || status.includes("partial")) return "partial";
        return "review";
      }

      function normalizeTone(value) {
        const key = String(value || "neutral").toLowerCase().replace(/[^a-z0-9]+/g, "_");
        if (["block", "blocked", "fail", "failed", "failure", "missing", "error"].some((item) => key.includes(item))) return "block";
        if (["warn", "review", "partial", "neutral", "unknown"].some((item) => key.includes(item))) return "review";
        if (["pass", "success", "completed", "covered", "verified", "ok"].some((item) => key.includes(item))) return "success";
        return key || "review";
      }

      function codePathButton(path) {
        return `<button class="code-link" type="button" data-code-path="${escAttr(path)}"><code>${esc(path)}</code></button>`;
      }

      function testCoverageFindingCard(item) {
        return `<div class="review-card-top"><h4>${esc(item.message || "Coverage gap")}</h4>${pill(item.severity || "review")}</div>
          <p>${esc(item.suggested_action || "Add or link changed-test evidence.")}</p>
          <div class="muted">${esc(item.path || "changed behavior")}</div>`;
      }

      function testCoverageCard(item) {
        const tests = (item.matched_tests || []).map((test) => test.path).join(", ");
        return `<div class="review-card-top"><h4><code>${esc(item.path)}</code></h4>${pill(item.status || "unknown")}</div>
          <p>${esc(item.reason || "")}</p>
          <div class="muted">coverage ${esc(Math.round(Number(item.coverage || 0) * 100))}% / confidence ${esc(Math.round(Number(item.confidence || 0) * 100))}%</div>
          <div class="muted">${esc(tests || "no matched changed tests")}</div>`;
      }

      function behaviorCard(item) {
        return `<div class="review-card-top"><h4><code>${esc(item.path)}</code></h4>${pill(item.severity || "review")}</div>
          <p>${esc(item.new_behavior || item.summary || "")}</p>
          <div class="muted">${esc(item.divergent_input || item.symbol || "")}</div>`;
      }

      function blastCard(item) {
        return `<h4><code>${esc(item.path)}</code></h4>
          <p>${esc((item.downstream_services || []).join(", ") || "No downstream service listed.")}</p>
          <div class="muted">Callers: ${esc((item.direct_callers || []).join(", ") || "none")}</div>`;
      }

      function policyCard(item) {
        return `<div class="review-card-top"><h4>${esc(item.rule_id || item.concept)}</h4>${pill(item.severity || "warn")}</div>
          <p>${esc(item.message || "")}</p>
          <div class="muted">${esc(item.owner || "unassigned")} / ${esc(item.path || "")}</div>`;
      }

      function promptCard(item) {
        return `<div class="review-card-top"><h4>${esc(displayPromptSuiteName(item.suite || "prompt drift check"))}</h4>${pill(item.status || "unknown")}</div>
          <p>${esc(item.drift_summary || item.prompt_path || "")}</p>
          <div class="muted">correctness ${esc(item.correctness)} / format ${esc(item.format)} / cost ${esc(item.cost_delta_pct)}%</div>`;
      }

      function displayPromptSuiteName(name) {
        return String(name || "")
          .replaceAll("prompt-canary", "prompt-drift")
          .replaceAll("prompt canary", "prompt drift check");
      }

      function contractCard(item) {
        return `<div class="review-card-top"><h4><code>${esc(item.path)}</code></h4>${pill(item.severity || "review")}</div>
          <p>${esc(item.violated_assumption || "")}</p>
          <div class="muted">${esc(item.suggested_test?.path || "")}</div>`;
      }

      function suggestedTestCard(item) {
        return `<h4><code>${esc(item.path)}</code></h4>
          <p>${esc(item.intent || "")}</p>
          <div class="muted">${esc(item.framework || "repo-default")}</div>`;
      }

      function barList(items, labelKey, valueKey) {
        const list = items || [];
        if (!list.length) return "";
        const max = Math.max(...list.map((item) => Number(item[valueKey] || 0)), 1);
        return `<div class="bar-list">${list.slice(0, 8).map((item) => {
          const value = Number(item[valueKey] || 0);
          const pct = Math.round((value / max) * 100);
          return `<div class="bar-row">
            <span>${esc(item[labelKey])}</span>
            <span class="bar-track"><span class="bar-fill" style="width:${pct}%"></span></span>
            <strong>${esc(value)}</strong>
          </div>`;
        }).join("")}</div>`;
      }

      function riskDial(score) {
        const color = score >= 70 ? "var(--red)" : score >= 40 ? "var(--amber)" : "var(--green)";
        return `<div class="risk-dial" style="--score:${score};--risk-color:${color}">
          <div class="risk-dial-inner">
            <div>
              <div class="risk-number">${score}</div>
              <div class="risk-caption">risk</div>
            </div>
          </div>
        </div>`;
      }

      function scoreChip(score) {
        return `<span class="chip">risk ${scoreLabel(score)}</span>`;
      }

      function pill(value, tone) {
        const label = statusLabel(value);
        const key = String(tone || value || "unknown").toLowerCase().replace(/[^a-z0-9_]+/g, "_");
        return `<span class="pill pill-${escAttr(key)}">${esc(label)}</span>`;
      }

      function statusLabel(value) {
        return String(value || "unknown").replaceAll("_", " ").toUpperCase();
      }

      function scoreLabel(score) {
        return score == null ? "n/a" : String(score);
      }

      function numericScore(score) {
        return Math.max(0, Math.min(100, Number(score || 0)));
      }

      function updateSelect(select, values, fallback, selected) {
        const current = selected || select.value;
        select.innerHTML = `<option value="">${esc(fallback)}</option>${values
          .map((value) => `<option value="${escAttr(value)}">${esc(value)}</option>`)
          .join("")}`;
        select.value = values.includes(current) ? current : "";
      }

      function unique(values) {
        return [...new Set(values)].sort((a, b) => a.localeCompare(b));
      }

      async function fetchJson(path, options) {
        const response = await fetch(path, options);
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || `${response.status} ${response.statusText}`);
        }
        return data;
      }

      function esc(value) {
        return String(value ?? "").replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);
      }

      function escAttr(value) {
        return esc(value).replaceAll("`", "&#96;");
      }
    </script>
  </body>
</html>
